<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Companies | Evaraos</title>
  <link rel="stylesheet" href="/evaraos/assets/css/styles.css" />
</head>
<body>
  <header id="topbar"></header>
  <div id="sidebar" style="display:none;"></div>
  <main id="companiesRoot"></main>

  <div class="modal-backdrop" id="companyModal">
    <div class="modal-card">
      <div class="section-title-row">
        <h2 id="companyModalTitle" style="margin:0;">Add Company</h2>
        <button class="btn secondary" id="companyModalCloseBtn" type="button">Close</button>
      </div>

      <form id="companyForm">
        <div class="form-grid">
          <div class="field">
            <label for="companyName">Company Name</label>
            <input id="companyName" required />
          </div>

          <div class="field">
            <label for="companySlug">Slug</label>
            <input id="companySlug" placeholder="supreme-trueclean" />
          </div>

          <div class="field">
            <label for="companyCity">City</label>
            <input id="companyCity" />
          </div>

          <div class="field">
            <label for="companyStateField">State</label>
            <input id="companyStateField" />
          </div>

          <div class="field">
            <label for="companyPhone">Phone</label>
            <input id="companyPhone" />
          </div>

          <div class="field">
            <label for="companyEmail">Email</label>
            <input id="companyEmail" type="email" />
          </div>

          <div class="field">
            <label for="companyStatus">Status</label>
            <select id="companyStatus">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>

          <div class="field">
            <label for="companyBrandColor">Brand Color</label>
            <input id="companyBrandColor" value="#E30613" />
          </div>

          <div class="field">
            <label for="companyOwnerName">Owner Name</label>
            <input id="companyOwnerName" />
          </div>

          <div class="field">
            <label for="companyOwnerEmail">Owner Email</label>
            <input id="companyOwnerEmail" type="email" />
          </div>

          <div class="field full">
            <label for="companyNotes">Notes</label>
            <textarea id="companyNotes" rows="4"></textarea>
          </div>
        </div>

        <div class="top-actions" style="margin-top:18px;">
          <button class="btn" type="submit">Save Company</button>
          <button class="btn secondary" id="companyModalCancelBtn" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="assets/companies.js"></script>
</body>
</html>
