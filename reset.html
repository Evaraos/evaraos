<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Security / cache control -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Reset Password • Evaraos Inc</title>

  <link rel="stylesheet" href="/evaraos/assets/css/base.css" />
  <link rel="stylesheet" href="/evaraos/assets/css/theme.css" />
  <link rel="stylesheet" href="/evaraos/assets/css/nav.css" />
  <link rel="stylesheet" href="/evaraos/assets/css/auth.css" />
  <link rel="stylesheet" href="/evaraos/assets/css/dashboard.css" />

  <script>
    document.documentElement.classList.add("auth-pending");
  </script>

  <style>
    html.auth-pending body,
    body.auth-pending {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script type="module">
    import { protectRoute } from "/evaraos/assets/js/firebase.js";
    protectRoute({
      requireAuth: false,
      redirectGuestTo: "/evaraos/login.html",
      redirectAuthedTo: "/evaraos/dashboard.html"
    });
  </script>
</head>
<body class="reset-page auth-pending" data-route-guard="auth">
  <div class="page-grid-overlay"></div>
  <div id="universalNavRoot"></div>

  <main class="login-shell">
    <section class="login-panel glass-card aurora-card auth-panel auth-panel-reset">
      <div class="login-badge-wrap">
        <img
          src="/evaraos/assets/img/evaraos_logo.png"
          alt="Evaraos logo"
          class="login-badge auth-badge auth-badge-large"
        />
      </div>

      <h1 class="login-title">Reset Password</h1>
      <p class="login-subtitle">
        Enter your account email and we’ll send you a secure password reset link.
      </p>

      <form id="resetForm" class="login-form" novalidate>
        <div class="form-group">
          <label class="field-label" for="resetEmail">Account Email</label>
          <div class="input-shell aurora-card">
            <input
              id="resetEmail"
              name="email"
              type="email"
              class="input"
              placeholder="Enter your account email"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <div class="login-actions-row">
          <button type="submit" class="btn btn-theme-primary premium-red-btn">Send Reset Link</button>
          <a href="/evaraos/login.html" class="btn btn-theme-secondary">Back to Login</a>
        </div>

        <p id="resetMessage" class="login-message" aria-live="polite"></p>
      </form>

      <div class="auth-footer-links">
        <span>Remembered your password?</span>
        <a href="/evaraos/login.html">Return to login</a>
      </div>
    </section>
  </main>

  <script type="module" src="/evaraos/assets/js/theme.js"></script>
  <script type="module" src="/evaraos/assets/js/firebase.js"></script>
  <script type="module" src="/evaraos/assets/js/auth.js"></script>
  <script type="module" src="/evaraos/assets/js/route-guard.js"></script>
  <script type="module" src="/evaraos/assets/js/nav.js"></script>
</body>
</html>
