name: Trusted Studio Release Runtime

on:
  push:
    branches:
      - evaraos
    paths:
      - "functions/studio-release-runtime-service.js"
      - "functions/index-stats.js"
      - "functions/studio-journal-core.js"
      - "functions/studio-journal-core.test.js"
      - "public/website-builder.html"
      - "public/assets/js/studio/studio-release-runtime-client.js"
      - "tools/studio-release-runtime-audit.js"
      - ".github/workflows/studio-release-runtime.yml"
  pull_request:
    paths:
      - "functions/studio-release-runtime-service.js"
      - "functions/index-stats.js"
      - "functions/studio-journal-core.js"
      - "functions/studio-journal-core.test.js"
      - "public/website-builder.html"
      - "public/assets/js/studio/studio-release-runtime-client.js"
      - "tools/studio-release-runtime-audit.js"
      - ".github/workflows/studio-release-runtime.yml"

permissions:
  contents: read

jobs:
  validate-trusted-release-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate release runtime syntax
        run: |
          set -euo pipefail
          node --check functions/studio-release-runtime-service.js
          node --check functions/index-stats.js
          node --experimental-default-type=module --check public/assets/js/studio/studio-release-runtime-client.js
          node --check tools/studio-release-runtime-audit.js

      - name: Validate trusted Studio journal contracts
        run: npm run test:studio-journal --prefix functions

      - name: Audit release authority boundaries
        run: node tools/studio-release-runtime-audit.js
