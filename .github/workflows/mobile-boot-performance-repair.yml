name: Mobile Boot Performance Verification

on:
  pull_request:
    branches: [evaraos]
    paths:
      - '.github/workflows/mobile-boot-performance-repair.yml'
      - 'public/**'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/mobile-boot-loader-fix
          fetch-depth: 0

      - name: Deduplicate verified profile hydration
        shell: python
        run: |
          from pathlib import Path
          import re

          firebase = Path('public/assets/js/firebase.js')
          text = firebase.read_text(encoding='utf-8')
          if 'let profileHydrationPromise = null;' not in text:
              text = text.replace(
                  'let globalAuthSyncStarted = false;\n',
                  'let globalAuthSyncStarted = false;\nlet profileHydrationPromise = null;\nlet profileHydrationUid = "";\n',
                  1,
              )

          replacement = '''export function hydrateUserProfile(user = auth.currentUser) {
            if (!user) return Promise.resolve(null);
            if (profileHydrationPromise && profileHydrationUid === user.uid) return profileHydrationPromise;

            profileHydrationUid = user.uid;
            profileHydrationPromise = (async () => {
              const cached = getSavedUserProfile();

              try {
                const snap = await getDoc(doc(db, "users", user.uid));
                const data = snap.exists() ? snap.data() : {};
                const role = data.role || cached?.role || getSavedUserRole() || "customer";

                const profile = {
                  uid: user.uid,
                  id: user.uid,
                  email: user.email || data.email || cached?.email || "",
                  displayName: data.displayName || data.fullName || cached?.displayName || user.displayName || user.email || "",
                  fullName: data.fullName || data.displayName || cached?.fullName || cached?.displayName || user.displayName || "",
                  name: data.name || data.fullName || data.displayName || cached?.name || cached?.fullName || cached?.displayName || user.displayName || "",
                  username: data.username || cached?.username || "",
                  role,
                  companyId: data.companyId || cached?.companyId || "",
                  companyName: data.companyName || cached?.companyName || "",
                  approvalStatus: data.approvalStatus || cached?.approvalStatus || "",
                  status: data.status || cached?.status || "active"
                };

                saveUserRole(role);
                saveUserProfile(profile);
                applyUserToUi(profile);
                dispatchSessionReady({ authenticated: true, role });
                return profile;
              } catch (error) {
                console.warn("User profile hydration skipped:", error);
                if (cached) applyUserToUi(cached);
                dispatchSessionReady({ authenticated: true, role: cached?.role || getSavedUserRole() });
                return cached;
              }
            })();

            return profileHydrationPromise;
          }

          export function startGlobalAuthSync() {'''

          text, count = re.subn(
              r'export async function hydrateUserProfile\(user = auth\.currentUser\) \{.*?\n\}\n\nexport function startGlobalAuthSync\(\) \{',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1 and 'profileHydrationPromise && profileHydrationUid === user.uid' not in text:
              raise SystemExit('Could not update Firebase profile hydration.')

          text = text.replace(
              '      if (!user) {\n        clearSavedUserRole();',
              '      if (!user) {\n        profileHydrationPromise = null;\n        profileHydrationUid = "";\n        clearSavedUserRole();',
              1,
          )
          firebase.write_text(text, encoding='utf-8')

          route = Path('public/assets/js/route-guard.js')
          text = route.read_text(encoding='utf-8')
          text, count = re.subn(
              r"import \{\n  auth,\n  db,\n  doc,\n  getDoc,\n  onAuthStateChanged,\n  saveUserRole,\n  saveUserProfile,\n  applyUserToUi,\n  clearSavedUserRole,\n  clearSavedUserProfile\n\} from './firebase\.js';",
              "import {\n  auth,\n  onAuthStateChanged,\n  hydrateUserProfile,\n  clearSavedUserRole,\n  clearSavedUserProfile\n} from './firebase.js';",
              text,
              count=1,
          )
          if count != 1 and 'hydrateUserProfile' not in text.split("from './firebase.js';", 1)[0]:
              raise SystemExit('Could not update route-guard imports.')

          verified = '''async function readVerifiedProfile(user) {
            if (!user?.uid) return null;

            const profile = await hydrateUserProfile(user);
            if (!profile || profile.uid !== user.uid || !profile.role || !accountIsActive(profile)) return null;
            return profile;
          }'''
          text, count = re.subn(
              r'async function readVerifiedProfile\(user\) \{.*?\n\}',
              verified,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1 and 'const profile = await hydrateUserProfile(user);' not in text:
              raise SystemExit('Could not update route-guard verification.')
          route.write_text(text, encoding='utf-8')

      - name: Validate repaired boot path
        shell: bash
        run: |
          set -euo pipefail
          node --check public/assets/js/loader.js
          node --experimental-default-type=module --check public/assets/js/nav.js
          node --experimental-default-type=module --check public/assets/js/nav/nav-main-v6.js
          node --experimental-default-type=module --check public/assets/js/firebase.js
          node --experimental-default-type=module --check public/assets/js/route-guard.js
          grep -q 'padding-top: calc(var(--eva-page-nav-clearance, 86px) + 12px);' public/assets/css/home/home-layout.css
          grep -q 'evaraWelcomeLoader' public/assets/js/loader.js
          grep -q 'WELCOME_SESSION_KEY' public/assets/js/loader.js
          ! grep -q 'owner-editor.js' public/assets/js/loader.js
          ! grep -q '/assets/js/firebase.js' public/index.html
          grep -q 'loader-viewport.css?v=3' public/assets/css/theme.css
          grep -q 'profileHydrationPromise' public/assets/js/firebase.js
          grep -q 'hydrateUserProfile' public/assets/js/route-guard.js
          ! grep -q 'getDoc' public/assets/js/route-guard.js

      - name: Commit verified optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "Profile hydration already optimized."
          else
            git commit -m "perf: deduplicate verified profile hydration"
            git push origin HEAD:performance/mobile-boot-loader-fix
          fi
