name: Verify Trusted Studio Functions Production

on:
  workflow_dispatch:
  push:
    branches: [evaraos]
    paths:
      - '.github/workflows/verify-trusted-studio-functions-production.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: verify-trusted-studio-functions-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify deployed callable inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact verification source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Verify and record production inventory
        id: verify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EVARAOS_WEB }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail

          STATUS="unverified"
          REASON="verification-not-run"
          MISSING_FUNCTIONS=""
          EVIDENCE_DIR="$RUNNER_TEMP/trusted-studio-inventory"
          INVENTORY_FILE="$EVIDENCE_DIR/firebase-functions-list.json"
          RAW_ERROR_FILE="$EVIDENCE_DIR/firebase-functions-list-raw.txt"
          DIAGNOSTIC_FILE="$EVIDENCE_DIR/firebase-functions-list-diagnostic.txt"
          PROOF_FILE="$EVIDENCE_DIR/trusted-studio-functions-verification.json"
          CREDENTIAL_FILE="$RUNNER_TEMP/firebase-service-account.json"
          mkdir -p "$EVIDENCE_DIR"
          REQUIRED_FUNCTIONS=(
            openStudioBranch
            commitStudioTransaction
            getStudioOperationRange
            createStudioCheckpoint
            restoreStudioCheckpoint
            createStudioBranch
            closeStudioSession
            prepareStudioRelease
          )

          cleanup() {
            rm -f "$CREDENTIAL_FILE" "$RAW_ERROR_FILE" firebase-debug.log
          }
          trap cleanup EXIT

          classify_failure() {
            local input="$1"
            if grep -Eqi 'permission.?denied|does not have permission|forbidden|HTTP Error: 403|status.?[:=].?403' "$input"; then
              REASON="insufficient-service-account-permissions"
            elif grep -Eqi 'API.*has not been used|API.*disabled|serviceusage.services.use|cloudfunctions.googleapis.com.*disabled' "$input"; then
              REASON="cloud-functions-api-disabled"
            elif grep -Eqi 'billing.*required|billing account|Blaze plan|upgrade.*billing' "$input"; then
              REASON="billing-required"
            elif grep -Eqi 'invalid_grant|unauthenticated|authentication.*failed|invalid credential|could not load.*credential' "$input"; then
              REASON="service-account-authentication-failed"
            elif grep -Eqi 'project.*not found|requested entity was not found|HTTP Error: 404|status.?[:=].?404' "$input"; then
              REASON="project-not-found-or-inaccessible"
            else
              REASON="firebase-functions-list-failed"
            fi
          }

          sanitize_diagnostic() {
            local input="$1"
            local output="$2"
            node - "$input" "$output" <<'NODE'
          const fs = require('fs');
          const [input, output] = process.argv.slice(2);
          const raw = fs.existsSync(input) ? fs.readFileSync(input, 'utf8') : '';
          const selected = raw
            .split(/\r?\n/)
            .filter((line) => /error|permission|denied|forbidden|status|403|404|api|disabled|billing|unauth|credential|not found|cloudfunctions|serviceusage/i.test(line))
            .slice(-40)
            .map((line) => line
              .replace(/Bearer\s+[A-Za-z0-9._~+\/-]+=*/gi, 'Bearer [REDACTED]')
              .replace(/ya29\.[A-Za-z0-9._~+\/-]+/g, '[REDACTED_OAUTH_TOKEN]')
              .replace(/eyJ[A-Za-z0-9._-]+\.[A-Za-z0-9._-]+\.[A-Za-z0-9._-]+/g, '[REDACTED_JWT]')
              .replace(/-----BEGIN PRIVATE KEY-----[\s\S]*?-----END PRIVATE KEY-----/g, '[REDACTED_PRIVATE_KEY]')
              .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.iam\.gserviceaccount\.com/g, '[REDACTED_SERVICE_ACCOUNT]'));
          fs.writeFileSync(output, `${selected.join('\n') || 'No classified Firebase diagnostic line was emitted.'}\n`);
          NODE
          }

          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            REASON="missing-service-account-secret"
            printf '%s\n' "FIREBASE_SERVICE_ACCOUNT_EVARAOS_WEB is not configured." > "$DIAGNOSTIC_FILE"
          else
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIAL_FILE"
            chmod 600 "$CREDENTIAL_FILE"

            if ! node -e "const value=JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); if(value.project_id !== 'evaraos-web') process.exit(2);" "$CREDENTIAL_FILE"; then
              REASON="invalid-service-account-project"
              printf '%s\n' "Service account project_id is not evaraos-web." > "$DIAGNOSTIC_FILE"
            else
              export GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIAL_FILE"
              set +e
              firebase functions:list --project evaraos-web --json --debug > "$INVENTORY_FILE" 2> "$RAW_ERROR_FILE"
              LIST_CODE=$?
              set -e
              if [ -f firebase-debug.log ]; then cat firebase-debug.log >> "$RAW_ERROR_FILE"; fi
              if [ "$LIST_CODE" -eq 0 ]; then
                for function_name in "${REQUIRED_FUNCTIONS[@]}"; do
                  if ! grep -q "$function_name" "$INVENTORY_FILE"; then
                    MISSING_FUNCTIONS="${MISSING_FUNCTIONS}${MISSING_FUNCTIONS:+,}${function_name}"
                  fi
                done
                if [ -z "$MISSING_FUNCTIONS" ]; then
                  STATUS="confirmed"
                  REASON="all-required-callables-present"
                  printf '%s\n' "Firebase Functions inventory returned successfully and contains all eight required callables." > "$DIAGNOSTIC_FILE"
                else
                  REASON="required-callables-missing"
                  printf 'Firebase inventory is reachable but missing: %s\n' "$MISSING_FUNCTIONS" > "$DIAGNOSTIC_FILE"
                fi
              else
                classify_failure "$RAW_ERROR_FILE"
                sanitize_diagnostic "$RAW_ERROR_FILE" "$DIAGNOSTIC_FILE"
              fi
            fi
          fi

          export STATUS REASON MISSING_FUNCTIONS PROOF_FILE
          node <<'NODE'
          const fs = require('fs');
          const required = [
            'openStudioBranch',
            'commitStudioTransaction',
            'getStudioOperationRange',
            'createStudioCheckpoint',
            'restoreStudioCheckpoint',
            'createStudioBranch',
            'closeStudioSession',
            'prepareStudioRelease'
          ];
          const missing = String(process.env.MISSING_FUNCTIONS || '')
            .split(',')
            .map((value) => value.trim())
            .filter(Boolean);
          const proof = {
            schemaVersion: 'evara.deployment-verification.v1',
            status: process.env.STATUS,
            reason: process.env.REASON,
            projectId: 'evaraos-web',
            region: 'us-central1',
            scope: 'trusted-studio-functions',
            verificationSourceCommit: process.env.SOURCE_SHA,
            workflowRunId: process.env.WORKFLOW_RUN_ID,
            verifiedAt: new Date().toISOString(),
            verification: 'firebase functions:list --json',
            requiredCallables: required,
            missingCallables: missing,
            secretsRecorded: false
          };
          fs.writeFileSync(process.env.PROOF_FILE, `${JSON.stringify(proof, null, 2)}\n`);
          NODE

          cp "$PROOF_FILE" "$GITHUB_WORKSPACE/trusted-studio-functions-verification.json"
          cp "$DIAGNOSTIC_FILE" "$GITHUB_WORKSPACE/firebase-functions-list-diagnostic.txt"
          if [ "$STATUS" = "confirmed" ]; then cp "$INVENTORY_FILE" "$GITHUB_WORKSPACE/firebase-functions-list.json"; fi

          git fetch origin evaraos
          git checkout -B deployment-verification origin/evaraos
          mkdir -p docs/deployments
          cp "$PROOF_FILE" docs/deployments/trusted-studio-functions-verification.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deployments/trusted-studio-functions-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "ops: record trusted Studio Functions verification [skip ci]"
            git push origin HEAD:evaraos
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" != "confirmed" ]; then
            echo "Trusted Studio Functions inventory is not confirmed: $REASON"
            exit 1
          fi

      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-studio-functions-inventory-${{ github.run_id }}
          path: |
            trusted-studio-functions-verification.json
            firebase-functions-list.json
            firebase-functions-list-diagnostic.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Update activation tracker
        if: always()
        uses: actions/github-script@v7
        env:
          INVENTORY_STATUS: ${{ steps.verify.outputs.status || 'unverified' }}
          INVENTORY_REASON: ${{ steps.verify.outputs.reason || 'unknown' }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const status = process.env.INVENTORY_STATUS;
            const icon = status === 'confirmed' ? '✅' : '⛔';
            const body = [
              '## Gate D — Independent Functions inventory result',
              '',
              `${icon} Status: **${status}**`,
              `Reason: \`${process.env.INVENTORY_REASON}\``,
              `Verification source: \`${process.env.SOURCE_SHA}\``,
              `Workflow run: \`${process.env.WORKFLOW_RUN_ID}\``,
              '',
              'Evidence:',
              '- Repository proof: `docs/deployments/trusted-studio-functions-verification.json`',
              '- Workflow artifact: `trusted-studio-functions-inventory-' + process.env.WORKFLOW_RUN_ID + '`',
              '- Sanitized diagnostic: `firebase-functions-list-diagnostic.txt`',
              '',
              status === 'confirmed'
                ? 'All eight trusted Studio callables are present in Firebase inventory. Gate D may advance to 10/10 after proof review.'
                : 'Gate D remains blocked. Use the classified reason and sanitized diagnostic to repair Firebase access or deployment.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 29,
              body
            });

      - name: Verification summary
        if: always()
        run: |
          echo "Status: ${{ steps.verify.outputs.status || 'unverified' }}"
          echo "Reason: ${{ steps.verify.outputs.reason || 'unknown' }}"
          echo "Project: evaraos-web"
          echo "Required callable count: 8"
