name: Verify Studio Release Candidate Source

on:
  workflow_dispatch:
  push:
    branches: [evaraos]
    paths:
      - '.github/workflows/verify-studio-release-candidate-once.yml'

permissions:
  contents: write

concurrency:
  group: verify-studio-release-candidate-source
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Studio source gates
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ops: verify Studio release candidate source'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run source gates and record proof
        id: verify
        env:
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/studio-verification"
          RESULT_FILE="$RUNNER_TEMP/studio-verification/results.tsv"
          : > "$RESULT_FILE"

          run_gate() {
            local name="$1"
            shift
            local log="$RUNNER_TEMP/studio-verification/${name}.log"
            set +e
            "$@" >"$log" 2>&1
            local code=$?
            set -e
            printf '%s\t%s\n' "$name" "$code" >> "$RESULT_FILE"
            cat "$log"
          }

          set -e
          run_gate app-check-audit node tools/studio-app-check-audit.js
          run_gate trusted-journal-audit node tools/studio-trusted-journal-audit.js
          run_gate production-authority-audit node tools/studio-production-authority-audit.js
          run_gate canvas-audit node tools/studio-canvas-sandbox-audit.js
          run_gate master-visual-audit node tools/visual-qa-audit.js

          set +e
          npm install --prefix functions --ignore-scripts --no-audit --no-fund >"$RUNNER_TEMP/studio-verification/functions-install.log" 2>&1
          INSTALL_CODE=$?
          set -e
          printf 'functions-install\t%s\n' "$INSTALL_CODE" >> "$RESULT_FILE"
          cat "$RUNNER_TEMP/studio-verification/functions-install.log"
          if [ "$INSTALL_CODE" -eq 0 ]; then
            run_gate trusted-journal-tests npm run test:studio-journal --prefix functions
          else
            printf 'trusted-journal-tests\t99\n' >> "$RESULT_FILE"
          fi

          export RESULT_FILE
          git fetch origin evaraos
          git checkout -B source-verification origin/evaraos
          mkdir -p docs/deployments
          node <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync(process.env.RESULT_FILE, 'utf8')
            .trim()
            .split(/\r?\n/)
            .filter(Boolean);
          const gates = Object.fromEntries(lines.map((line) => {
            const [name, code] = line.split('\t');
            return [name, { exitCode: Number(code), passed: Number(code) === 0 }];
          }));
          const passed = Object.values(gates).every((gate) => gate.passed);
          const proof = {
            schemaVersion: 'evara.source-verification.v1',
            status: passed ? 'confirmed' : 'failed',
            sourceCommit: process.env.SOURCE_SHA,
            workflowRunId: process.env.WORKFLOW_RUN_ID,
            verifiedAt: new Date().toISOString(),
            gates,
            secretsRequired: false
          };
          fs.writeFileSync(
            'docs/deployments/studio-release-candidate-source-verification.json',
            `${JSON.stringify(proof, null, 2)}\n`
          );
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deployments/studio-release-candidate-source-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "ops: record Studio source verification [skip ci]"
            git push origin HEAD:evaraos
          fi

          STATUS=$(node -e "const p=require('./docs/deployments/studio-release-candidate-source-verification.json'); process.stdout.write(p.status)")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "confirmed" ]; then
            echo "One or more Studio source gates failed."
            exit 1
          fi

      - name: Verification summary
        if: always()
        run: |
          echo "Status: ${{ steps.verify.outputs.status || 'unverified' }}"
          echo "Source: ${{ github.sha }}"
          echo "Proof: docs/deployments/studio-release-candidate-source-verification.json"
