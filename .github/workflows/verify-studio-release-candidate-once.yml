name: Verify Studio Release Candidate Source

on:
  workflow_dispatch:
  push:
    branches: [evaraos]
    paths:
      - '.github/workflows/verify-studio-release-candidate-once.yml'
      - 'functions/studio-journal-core.js'
      - 'functions/studio-journal-core.test.js'
      - 'functions/studio-journal-service.js'
      - 'functions/index-stats.js'
      - 'functions/package.json'
      - 'public/assets/js/firebase.js'
      - 'public/assets/js/studio/**'
      - 'public/assets/css/pages/studio-production-authority.css'
      - 'public/website-builder.html'
      - 'tools/studio-app-check-audit.js'
      - 'tools/studio-trusted-journal-audit.js'
      - 'tools/studio-production-authority-audit.js'
      - 'tools/studio-canvas-sandbox-audit.js'
      - 'tools/visual-qa-audit.js'

permissions:
  contents: write
  issues: write

concurrency:
  group: verify-studio-release-candidate-source
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Studio source gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run source gates
        id: gates
        env:
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/studio-verification"
          RESULT_FILE="$RUNNER_TEMP/studio-verification/results.tsv"
          PROOF_FILE="$RUNNER_TEMP/studio-verification/studio-release-candidate-source-verification.json"
          : > "$RESULT_FILE"

          run_gate() {
            local name="$1"
            shift
            local log="$RUNNER_TEMP/studio-verification/${name}.log"
            set +e
            "$@" >"$log" 2>&1
            local code=$?
            set -e
            printf '%s\t%s\n' "$name" "$code" >> "$RESULT_FILE"
            cat "$log"
          }

          set -e
          run_gate app-check-audit node tools/studio-app-check-audit.js
          run_gate trusted-journal-audit node tools/studio-trusted-journal-audit.js
          run_gate production-authority-audit node tools/studio-production-authority-audit.js
          run_gate canvas-audit node tools/studio-canvas-sandbox-audit.js
          run_gate master-visual-audit node tools/visual-qa-audit.js

          set +e
          npm install --prefix functions --package-lock=false --ignore-scripts --no-audit --no-fund >"$RUNNER_TEMP/studio-verification/functions-install.log" 2>&1
          INSTALL_CODE=$?
          set -e
          printf 'functions-install\t%s\n' "$INSTALL_CODE" >> "$RESULT_FILE"
          cat "$RUNNER_TEMP/studio-verification/functions-install.log"
          if [ "$INSTALL_CODE" -eq 0 ]; then
            run_gate trusted-journal-tests npm run test:studio-journal --prefix functions
          else
            printf 'trusted-journal-tests\t99\n' >> "$RESULT_FILE"
          fi

          export RESULT_FILE PROOF_FILE
          node <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync(process.env.RESULT_FILE, 'utf8')
            .trim()
            .split(/\r?\n/)
            .filter(Boolean);
          const gates = Object.fromEntries(lines.map((line) => {
            const [name, code] = line.split('\t');
            return [name, { exitCode: Number(code), passed: Number(code) === 0 }];
          }));
          const passed = Object.values(gates).every((gate) => gate.passed);
          const proof = {
            schemaVersion: 'evara.source-verification.v1',
            status: passed ? 'confirmed' : 'failed',
            sourceCommit: process.env.SOURCE_SHA,
            workflowRunId: process.env.WORKFLOW_RUN_ID,
            verifiedAt: new Date().toISOString(),
            gates,
            secretsRequired: false
          };
          fs.writeFileSync(process.env.PROOF_FILE, `${JSON.stringify(proof, null, 2)}\n`);
          NODE

          STATUS=$(node -e "const p=require(process.env.PROOF_FILE); process.stdout.write(p.status)")
          cp "$PROOF_FILE" "$GITHUB_WORKSPACE/studio-release-candidate-source-verification.json"
          mkdir -p "$GITHUB_WORKSPACE/studio-source-gate-logs"
          cp "$RUNNER_TEMP/studio-verification"/*.log "$GITHUB_WORKSPACE/studio-source-gate-logs/" || true
          cp "$RESULT_FILE" "$GITHUB_WORKSPACE/studio-source-gate-logs/results.tsv"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload source-verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-source-verification-${{ github.run_id }}
          path: |
            studio-release-candidate-source-verification.json
            studio-source-gate-logs
          if-no-files-found: error
          retention-days: 30

      - name: Commit proof to authoritative branch
        if: always() && hashFiles('studio-release-candidate-source-verification.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin evaraos
          git checkout -B source-verification origin/evaraos
          mkdir -p docs/deployments
          cp "$GITHUB_WORKSPACE/studio-release-candidate-source-verification.json" docs/deployments/studio-release-candidate-source-verification.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deployments/studio-release-candidate-source-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "ops: record Studio source verification [skip ci]"
            git push origin HEAD:evaraos
          fi

      - name: Update activation tracker
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFICATION_STATUS: ${{ steps.gates.outputs.status || 'unverified' }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const status = process.env.VERIFICATION_STATUS;
            const icon = status === 'confirmed' ? '✅' : status === 'failed' ? '⛔' : '🟡';
            const body = [
              '## Gate B — Source verification result',
              '',
              `${icon} Status: **${status}**`,
              `Source SHA: \`${process.env.SOURCE_SHA}\``,
              `Workflow run: \`${process.env.WORKFLOW_RUN_ID}\``,
              '',
              'Evidence:',
              '- Workflow artifact: `studio-source-verification-' + process.env.WORKFLOW_RUN_ID + '`',
              '- Repository proof: `docs/deployments/studio-release-candidate-source-verification.json`',
              '- Detailed logs are included in the artifact under `studio-source-gate-logs/`.',
              '',
              status === 'confirmed'
                ? 'Gate B may advance after the repository proof is reviewed.'
                : 'Gate B remains blocked. Repair every failing source check listed in the proof and logs.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 29,
              body
            });

      - name: Enforce source-verification result
        if: always()
        env:
          VERIFICATION_STATUS: ${{ steps.gates.outputs.status || 'unverified' }}
        run: |
          if [ "$VERIFICATION_STATUS" != "confirmed" ]; then
            echo "Studio source verification is not confirmed: $VERIFICATION_STATUS"
            exit 1
          fi
