name: Universal nav coverage

on:
  push:
    branches: [evaraos]
    paths: [.github/workflows/universal-nav-coverage.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evaraos
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/ensure-universal-nav.js
      - shell: bash
        run: |
          if git diff --quiet -- public; then exit 0; fi
          git config user.name "Evaraos Migration"
          git config user.email "actions@users.noreply.github.com"
          git add public
          git commit -m "Ensure universal nav on every public HTML page"
          git push origin HEAD:evaraos
