name: Activate message interactions v2

on:
  workflow_dispatch:
  push:
    branches: [evaraos]
    paths:
      - "tools/activate-message-interactions-v2.js"
      - "public/assets/js/messages-interactions-v2.js"
      - "public/assets/css/pages/messages-fixes-v2.css"

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evaraos
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/activate-message-interactions-v2.js
      - name: Commit activated files
        run: |
          if git diff --quiet -- public/messages.html firebase/firestore.rules; then exit 0; fi
          git config user.name "Evaraos Messages Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/messages.html firebase/firestore.rules
          git commit -m "Activate message camera reactions and dates"
          git push origin HEAD:evaraos
