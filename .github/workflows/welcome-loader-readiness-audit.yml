name: Welcome Loader Readiness Audit

on:
  push:
    branches: [ui/welcome-loader-logo-readiness]
    paths:
      - 'public/assets/js/loader.js'
      - 'public/assets/js/nav.js'
      - 'public/assets/js/nav/nav-main-v6.js'
      - 'public/assets/js/route-guard.js'
      - 'public/index.html'
      - '.github/workflows/welcome-loader-readiness-audit.yml'
  pull_request:
    branches: [evaraos]
    paths:
      - 'public/assets/js/loader.js'
      - 'public/assets/js/nav.js'
      - 'public/assets/js/nav/nav-main-v6.js'
      - 'public/assets/js/route-guard.js'
      - 'public/index.html'
      - '.github/workflows/welcome-loader-readiness-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check public/assets/js/loader.js
          node --check public/assets/js/nav.js
          node --check public/assets/js/nav/nav-main-v6.js
          node --check public/assets/js/route-guard.js

      - name: Verify loader, readiness, and PNG ownership contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const loader = fs.readFileSync('public/assets/js/loader.js', 'utf8');
          const nav = fs.readFileSync('public/assets/js/nav/nav-main-v6.js', 'utf8');
          const guard = fs.readFileSync('public/assets/js/route-guard.js', 'utf8');
          const index = fs.readFileSync('public/index.html', 'utf8');
          const requireText = (source, text, label) => {
            if (!source.includes(text)) throw new Error(`Missing ${label}: ${text}`);
          };
          const rejectText = (source, text, label) => {
            if (source.includes(text)) throw new Error(`Unexpected ${label}: ${text}`);
          };

          requireText(loader, "BRAND_MARK_SRC='/assets/brand/evaraos-mark.png?v=brand-png-2'", 'canonical transparent PNG mark');
          requireText(loader, "APP_ICON_SRC='/assets/brand/evaraos-app-icon.png?v=brand-png-1'", 'canonical square app icon');
          rejectText(loader, 'evaraos-official-app-icon-v4', 'stale official icon override');
          rejectText(loader, 'evaraos-user-app-icon-v3', 'stale user icon override');
          requireText(loader, 'domReady&&windowLoaded&&navGate&&sessionGate&&!authPending()', 'critical readiness gate');
          requireText(loader, 'routeRequiresSession()&&(!sessionReady||authPending())', 'protected-route timeout gate');
          requireText(loader, 'WELCOME_MIN_MS=1200', 'welcome minimum duration');
          requireText(nav, 'window.EvaraLoader?.markNavReady?.()', 'nav-only readiness signal');
          requireText(nav, 'evara:nav-ready', 'nav readiness event');
          requireText(guard, 'window.EvaraLoader?.markSessionReady', 'session-only readiness signal');
          rejectText(guard, "classList.remove('auth-pending', 'app-loading')", 'route-guard loader bypass');
          requireText(index, '/assets/brand/evaraos-mark.png?v=brand-png-2', 'homepage welcome mark');
          requireText(index, 'evaraos-welcome-loader-session-v3', 'shared welcome session key');
          requireText(index, '/assets/js/loader.js?v=42', 'loader cache version');
          requireText(index, '/assets/js/nav.js?v=nav-v57-loader-gate', 'nav cache version');
          console.log('Welcome loader readiness and logo contracts passed.');
          NODE

      - name: Run design-system and Studio static audits
        run: |
          node tools/design-system-audit.js
          node tools/studio-component-catalog-audit.js
          node tools/studio-action-icon-audit.js
          node tools/studio-blueprint-serialization-audit.js
          node tools/studio-blueprint-operation-audit.js
          node tools/studio-canvas-sandbox-audit.js
          node tools/studio-app-check-audit.js
          node tools/studio-trusted-journal-audit.js
          node tools/studio-production-authority-audit.js
          node tools/visual-qa-audit.js
