name: Backend Security Validation

on:
  push:
    branches:
      - "evaraos"
    paths:
      - "firebase/**"
      - "firebase.json"
      - "firestore.indexes.json"
      - "functions/**"
      - "tests/backend-security/**"
      - "public/account-status.html"
      - "public/assets/js/access-control.js"
      - "public/assets/js/applications.js"
      - "public/assets/js/messages.js"
      - "public/assets/js/messages-group-photo.js"
      - "public/assets/js/route-guard.js"
      - "public/assets/js/staff-application.js"
      - "public/assets/js/account-status.js"
      - "public/assets/js/nav/nav-role-lockdown.js"
      - "public/assets/js/studio/blueprint-drafts.js"
      - "public/assets/js/studio/role-preview.js"
      - "tools/access-authority-audit.mjs"
      - "tools/account-lifecycle-audit.mjs"
      - "tools/experience-backend-audit.js"
      - "tools/messaging-registry-contract-audit.js"
      - "tools/staff-approval-contract-audit.js"
      - "tools/staff-applicant-lifecycle-audit.js"
      - ".github/workflows/backend-security.yml"
  pull_request:
    paths:
      - "firebase/**"
      - "firebase.json"
      - "firestore.indexes.json"
      - "functions/**"
      - "tests/backend-security/**"
      - "public/account-status.html"
      - "public/assets/js/access-control.js"
      - "public/assets/js/applications.js"
      - "public/assets/js/messages.js"
      - "public/assets/js/messages-group-photo.js"
      - "public/assets/js/route-guard.js"
      - "public/assets/js/staff-application.js"
      - "public/assets/js/account-status.js"
      - "public/assets/js/nav/nav-role-lockdown.js"
      - "public/assets/js/studio/blueprint-drafts.js"
      - "public/assets/js/studio/role-preview.js"
      - "tools/access-authority-audit.mjs"
      - "tools/account-lifecycle-audit.mjs"
      - "tools/experience-backend-audit.js"
      - "tools/messaging-registry-contract-audit.js"
      - "tools/staff-approval-contract-audit.js"
      - "tools/staff-applicant-lifecycle-audit.js"
      - ".github/workflows/backend-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-and-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install security test dependencies
        working-directory: tests/backend-security
        run: npm install --no-audit --no-fund

      - name: Validate Cloud Function syntax
        run: |
          node --check functions/index-stats.js
          node --check functions/experience-config-core.js
          node --check functions/experience-config-core.test.js
          node --check functions/experience-config-service.js
          node --check functions/staff-approval.js
          node --check functions/audit-events.js
          node --check functions/messaging-registry-core.js
          node --check functions/messaging-registry-core.test.js
          node --check functions/messaging-registry.js
          node --check functions/message-notifications.js
          node --check functions/push-notifications.js
          node --check functions/stats-rebuild.js
          node --check functions/blueprint-security.js
          node --check functions/marketplace-commerce-runtime.js
          node --check functions/marketplace-commerce-read.js

      - name: Validate authorization client syntax
        run: |
          node --experimental-default-type=module --check public/assets/js/access-control.js
          node --experimental-default-type=module --check public/assets/js/applications.js
          node --experimental-default-type=module --check public/assets/js/messages.js
          node --experimental-default-type=module --check public/assets/js/messages-group-photo.js
          node --experimental-default-type=module --check public/assets/js/route-guard.js
          node --experimental-default-type=module --check public/assets/js/staff-application.js
          node --experimental-default-type=module --check public/assets/js/account-status.js
          node --experimental-default-type=module --check public/assets/js/nav/nav-role-lockdown.js
          node --experimental-default-type=module --check public/assets/js/studio/blueprint-drafts.js
          node --experimental-default-type=module --check public/assets/js/studio/role-preview.js

      - name: Validate canonical access and lifecycle authority
        run: |
          node tools/access-authority-audit.mjs
          node tools/account-lifecycle-audit.mjs

      - name: Validate trusted Experience backend contract
        run: node tools/experience-backend-audit.js

      - name: Validate canonical messaging registry contract
        run: node tools/messaging-registry-contract-audit.js

      - name: Validate canonical staff approval contract
        run: node tools/staff-approval-contract-audit.js

      - name: Validate staff applicant lifecycle contract
        run: node tools/staff-applicant-lifecycle-audit.js

      - name: Run Experience configuration unit tests
        run: node --test functions/experience-config-core.test.js

      - name: Run messaging registry migration unit tests
        run: node --test functions/messaging-registry-core.test.js

      - name: Run Firebase rules emulator tests
        working-directory: tests/backend-security
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee security-test-output.log

      - name: Preserve security test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-test-output
          path: tests/backend-security/security-test-output.log
          if-no-files-found: warn
          retention-days: 7
