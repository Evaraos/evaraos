name: Top Spacing Audit

on:
  pull_request:
    branches: [evaraos]
    paths:
      - '.github/workflows/top-spacing-audit.yml'
      - 'public/**'
      - 'settings/**'
      - '*.html'

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/top-spacing-audit-fix
          fetch-depth: 0

      - name: Normalize page top spacing
        shell: python
        run: |
          from pathlib import Path

          DESKTOP = 'var(--eva-page-top-space)'
          COMPACT = 'var(--eva-page-top-space-compact)'
          STICKY = 'var(--eva-page-sticky-top)'

          def replace(path, old, new, required=True):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  if required and new not in text:
                      raise SystemExit(f'Missing expected spacing pattern in {path}: {old}')
                  return False
              p.write_text(text.replace(old, new), encoding='utf-8')
              return True

          base = Path('public/assets/css/base.css')
          base_text = base.read_text(encoding='utf-8')
          if '--eva-page-top-space:' not in base_text:
              base_text = base_text.replace(
                  '  --loader-z: 2147483647;\n',
                  '  --loader-z: 2147483647;\n'
                  '  --eva-page-top-space: calc(env(safe-area-inset-top, 0px) + 84px);\n'
                  '  --eva-page-top-space-compact: calc(env(safe-area-inset-top, 0px) + 74px);\n'
                  '  --eva-page-sticky-top: var(--eva-page-top-space);\n'
              )
          base_text = base_text.replace(
              '.home-shell,.page-shell{width:min(100%,var(--page-max));margin:0 auto;padding:84px 16px 32px}',
              '.home-shell,.page-shell{width:min(100%,var(--page-max));margin:0 auto;padding:var(--eva-page-top-space) 16px 32px}'
          ).replace(
              '@media(max-width:760px){.home-shell,.page-shell{padding:74px 12px 24px}',
              '@media(max-width:760px){.home-shell,.page-shell{padding:var(--eva-page-top-space-compact) 12px 24px}'
          )
          base.write_text(base_text, encoding='utf-8')

          replacements = {
              'public/assets/css/dashboard/dashboard-layout.css': [
                  ('--dashboard-top-offset: 6.5rem;', f'--dashboard-top-offset: {DESKTOP};'),
                  ('margin-top: 6.125rem;', f'margin-top: {COMPACT};'),
              ],
              'public/assets/css/design-system/marketplace.css': [
                  ('--marketplace-shell-top: 7.5rem;', f'--marketplace-shell-top: {DESKTOP};'),
                  ('--marketplace-shell-top: 6rem;', f'--marketplace-shell-top: {COMPACT};'),
              ],
              'public/assets/css/design-system/settings.css': [
                  ('--settings-shell-top: 7.25rem;', f'--settings-shell-top: {DESKTOP};'),
                  ('--settings-shell-top: 5.75rem;', f'--settings-shell-top: {COMPACT};'),
              ],
              'public/assets/css/design-system/workflows.css': [
                  ('--workflow-shell-top: 7.25rem;', f'--workflow-shell-top: {DESKTOP};'),
                  ('--workflow-shell-top: 5.75rem;', f'--workflow-shell-top: {COMPACT};'),
              ],
              'public/assets/css/home/home-layout.css': [
                  ('padding-top: max(132px, var(--eva-page-top-space, 116px));', f'padding-top: {DESKTOP};'),
                  ('padding-top: max(112px, calc(var(--eva-page-nav-clearance, 86px) + 26px));', f'padding-top: {COMPACT};'),
              ],
              'public/assets/css/auth/auth-layout.css': [
                  ('margin: 104px auto 64px;', f'margin: {DESKTOP} auto 64px;'),
                  ('margin: 92px auto 56px;', f'margin: {COMPACT} auto 56px;'),
              ],
              'public/assets/css/onboarding-entry.css': [
                  ('margin: 104px auto 72px;', f'margin: {DESKTOP} auto 72px;'),
              ],
              'public/assets/css/pages/customer-portal.css': [
                  ('padding:118px 0 120px', f'padding:{DESKTOP} 0 120px'),
                  ('padding-top:104px', f'padding-top:{COMPACT}'),
              ],
              'public/assets/css/pages/dispatch.css': [
                  ('padding-top: 6rem;', f'padding-top: {COMPACT};'),
              ],
              'public/assets/css/pages/jobs.css': [
                  ('padding: clamp(6.5rem, 9vw, 8.5rem) 0 clamp(3.5rem, 6vw, 5rem);', f'padding: {DESKTOP} 0 clamp(3.5rem, 6vw, 5rem);'),
                  ('top: calc(env(safe-area-inset-top) + 6.5rem);', f'top: {STICKY};'),
                  ('padding-top: 5.75rem;', f'padding-top: {COMPACT};'),
              ],
              'public/assets/css/pages/notifications-center.css': [
                  ('padding:calc(var(--eva-page-nav-clearance,86px) + 22px) 0', f'padding:{DESKTOP} 0'),
              ],
              'public/assets/css/pages/qa-v2.css': [
                  ('padding: 7.25rem 0 6.875rem;', f'padding: {DESKTOP} 0 6.875rem;'),
                  ('padding-top: 6.25rem;', f'padding-top: {COMPACT};'),
              ],
              'public/assets/css/pages/schedule.css': [
                  ('top: calc(env(safe-area-inset-top) + 6.5rem);', f'top: {STICKY};'),
                  ('padding-top: 6rem;', f'padding-top: {COMPACT};'),
              ],
              'public/assets/css/pages/website-builder.css': [
                  ('padding:104px 0 118px', f'padding:{DESKTOP} 0 118px'),
                  ('padding-top:92px', f'padding-top:{COMPACT}'),
              ],
          }
          for path, pairs in replacements.items():
              for old, new in pairs:
                  replace(path, old, new)

          legacy_pages = ['audit.html', 'org.html', 'performance.html', 'sales_reps.html']
          for path in legacy_pages:
              replace(path, 'padding: 132px 0 56px;', f'padding: {DESKTOP} 0 56px;')
              replace(path, 'padding-top: 112px;', f'padding-top: {COMPACT};')

          standard_pages = [
              'public/analytics.html', 'public/company_intelligence.html', 'public/customer_bills.html',
              'public/dispatch_intelligence.html', 'public/dispatch_map.html', 'public/job_billing.html',
              'public/payment_ops.html', 'public/payroll.html', 'public/predictive_ops.html',
              'public/proximity_dispatch.html', 'public/revenue.html', 'public/territory_intelligence.html',
          ]
          for path in standard_pages:
              replace(path, 'padding:128px 0 70px', f'padding:{DESKTOP} 0 70px')
              replace(path, 'padding-top:112px', f'padding-top:{COMPACT}')

          replace('public/ledger.html', 'padding:128px 0 78px', f'padding:{DESKTOP} 0 78px')
          replace('public/ledger.html', 'padding-top:112px', f'padding-top:{COMPACT}')
          replace('public/onboarding.html', 'padding:132px 0 70px', f'padding:{DESKTOP} 0 70px')
          replace('public/onboarding.html', 'padding-top:112px', f'padding-top:{COMPACT}')
          replace('public/operations_map.html', 'padding:128px 0 78px', f'padding:{DESKTOP} 0 78px')
          replace('public/operations_map.html', 'padding-top:112px', f'padding-top:{COMPACT}')

      - name: Verify normalized shell contract
        shell: python
        run: |
          from pathlib import Path

          forbidden = [
              'padding: 132px 0 56px', 'padding:128px 0 70px', 'padding:128px 0 78px',
              'padding:132px 0 70px', 'padding:118px 0 120px', 'padding:104px 0 118px',
              'padding: clamp(6.5rem, 9vw, 8.5rem)', '--marketplace-shell-top: 7.5rem',
              '--settings-shell-top: 7.25rem', '--workflow-shell-top: 7.25rem',
              '--dashboard-top-offset: 6.5rem', 'padding: 7.25rem 0 6.875rem',
          ]
          files = list(Path('public').rglob('*.css')) + list(Path('public').rglob('*.html')) + list(Path('.').glob('*.html'))
          violations = []
          for path in files:
              text = path.read_text(encoding='utf-8', errors='ignore')
              for token in forbidden:
                  if token in text:
                      violations.append(f'{path}: {token}')
          if violations:
              raise SystemExit('Legacy top spacing remains:\n' + '\n'.join(violations))

          base = Path('public/assets/css/base.css').read_text(encoding='utf-8')
          for token in ('--eva-page-top-space:', '--eva-page-top-space-compact:', '--eva-page-sticky-top:'):
              if token not in base:
                  raise SystemExit(f'Missing shared spacing token: {token}')
          print('Top spacing contract verified across public and legacy pages.')

      - name: Commit normalized spacing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public settings '*.html' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Spacing is already normalized."
          else
            git commit -m "ui: normalize page top spacing across EvaraOS"
            git push origin HEAD:ui/top-spacing-audit-fix
          fi

      - name: Write audit summary
        shell: bash
        run: |
          {
            echo "EvaraOS top spacing normalization"
            echo "Desktop token: calc(safe-area + 84px)"
            echo "Compact token: calc(safe-area + 74px)"
            echo "Changed files:"
            git diff --name-only origin/evaraos...HEAD
          } | tee top-spacing-audit.txt

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: top-spacing-audit-${{ github.run_id }}
          path: top-spacing-audit.txt
          if-no-files-found: error
          retention-days: 3
