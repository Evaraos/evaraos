name: Evaraos Liquid Glass consolidation

on:
  workflow_dispatch:
  push:
    branches: [evaraos]
    paths:
      - "public/**/*.html"
      - "public/assets/css/**"
      - "public/assets/js/theme*.js"
      - "public/assets/js/liquid-*.js"
      - "public/assets/js/adaptive-appearance-boot.js"
      - "public/assets/js/nav.js"
      - "public/assets/js/nav/**"
      - "tools/ensure-universal-nav.js"
      - "tools/liquid-glass-audit.js"
      - "tools/theme-deep-audit.js"
      - ".github/workflows/theme-html-migration.yml"

permissions:
  contents: write

concurrency:
  group: evaraos-liquid-glass-consolidation
  cancel-in-progress: true

jobs:
  consolidate-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out evaraos
        uses: actions/checkout@v4
        with:
          ref: evaraos
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Consolidate every public HTML entry point
        run: node tools/ensure-universal-nav.js

      - name: Commit migrated pages
        run: |
          if git diff --quiet; then
            echo "No page migration changes required."
          else
            git config user.name "Evaraos Liquid Glass Audit"
            git config user.email "actions@users.noreply.github.com"
            git add public
            git commit -m "Consolidate pages on Liquid Glass runtime v7"
            git push origin HEAD:evaraos
          fi

      - name: Audit runtime architecture
        run: node tools/liquid-glass-audit.js

      - name: Deep scan all public theme code
        run: node tools/theme-deep-audit.js
