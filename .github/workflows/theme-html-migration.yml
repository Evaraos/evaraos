name: Consolidate repository history

on:
  push:
    branches: [evaraos]
    paths: [.github/workflows/theme-html-migration.yml]

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evaraos
          fetch-depth: 0
      - name: Preserve temporary history in evaraos
        run: |
          git config user.name "Evaraos Repository"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin codex/ios27-liquid-glass-unified
          git merge --strategy=ours --no-ff origin/codex/ios27-liquid-glass-unified -m "Preserve Liquid Glass development history"
          git push origin HEAD:evaraos
      - name: Remove temporary branch
        run: git push origin --delete codex/ios27-liquid-glass-unified
