name: Four-mode HTML migration

on:
  workflow_dispatch:
  push:
    branches:
      - evaraos
    paths:
      - .github/workflows/theme-html-migration.yml

permissions:
  contents: write

jobs:
  migrate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: evaraos
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply safe appearance migration
        run: node tools/repo-audit.js --fix || true

      - name: Remove generated audit reports from migration commit
        run: rm -rf tools/reports

      - name: Commit migrated HTML
        shell: bash
        run: |
          if git diff --quiet -- '*.html'; then
            echo "No HTML migration changes were needed."
            exit 0
          fi

          git config user.name "Evaraos Theme Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Migrate pages to four-mode appearance assets"
          git push origin HEAD:evaraos
