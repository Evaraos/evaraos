name: Evaraos interface audit

on:
  workflow_dispatch:
  push:
    branches: [evaraos]
    paths:
      - "public/assets/css/theme/**"
      - "public/assets/css/theme.css"
      - "public/assets/css/nav/**"
      - "public/assets/css/nav.css"
      - "public/assets/js/theme*.js"
      - "public/assets/js/nav.js"
      - "public/assets/js/nav/**"
      - "tools/interface-audit.js"
      - ".github/workflows/theme-html-migration.yml"

permissions:
  contents: read

concurrency:
  group: evaraos-interface-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out evaraos
        uses: actions/checkout@v4
        with:
          ref: evaraos

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit navigation and adaptive appearance
        run: node tools/interface-audit.js
