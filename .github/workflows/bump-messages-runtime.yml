name: Bump Messages runtime

on:
  push:
    branches: [evaraos]
    paths:
      - "tools/bump-messages-runtime.js"
      - ".github/workflows/bump-messages-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evaraos
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/bump-messages-runtime.js
      - name: Commit runtime bump
        run: |
          if git diff --quiet -- public/messages.html; then exit 0; fi
          git config user.name "Evaraos Runtime Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/messages.html
          git commit -m "Load current Messages image storage runtime"
          git push origin HEAD:evaraos
