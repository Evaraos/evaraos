name: Icon system audit

on:
  push:
    branches: [evaraos]
    paths:
      - "public/**"
      - "tools/audit-icon-system.js"
      - ".github/workflows/icon-system-audit.yml"
  pull_request:
    paths:
      - "public/**"
      - "tools/audit-icon-system.js"
      - ".github/workflows/icon-system-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/audit-icon-system.js
