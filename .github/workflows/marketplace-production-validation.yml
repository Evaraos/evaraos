name: Marketplace Production Validation

on:
  workflow_dispatch:
  push:
    branches:
      - evaraos
    paths:
      - "functions/marketplace-*.js"
      - "functions/index-stats.js"
      - "functions/package.json"
      - "public/assets/js/marketplace-*.js"
      - "public/assets/js/customer-commerce-dashboard.js"
      - "public/assets/js/customer-marketplace-operations.js"
      - "public/customer-commerce.html"
      - "public/live-operations-command.html"
      - "firebase/firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".github/workflows/marketplace-production-validation.yml"
  pull_request:
    paths:
      - "functions/marketplace-*.js"
      - "functions/index-stats.js"
      - "functions/package.json"
      - "public/assets/js/marketplace-*.js"
      - "public/assets/js/customer-commerce-dashboard.js"
      - "public/assets/js/customer-marketplace-operations.js"
      - "public/customer-commerce.html"
      - "public/live-operations-command.html"
      - "firebase/firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".github/workflows/marketplace-production-validation.yml"

permissions:
  contents: read

concurrency:
  group: marketplace-production-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-marketplace:
    name: Validate Marketplace release surface
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Functions dependencies
        run: npm install --prefix functions --ignore-scripts --no-audit --no-fund

      - name: Validate Marketplace Cloud Function syntax
        run: |
          node --check functions/index-stats.js
          node --check functions/marketplace-commerce-runtime.js
          node --check functions/marketplace-commerce-read.js
          node --check functions/marketplace-operations-core.js
          node --check functions/marketplace-order-changes.js
          node --check functions/marketplace-refunds.js
          node --check functions/marketplace-operations-read.js
          node --check functions/marketplace-lifecycle-notifications.js
          node --check functions/marketplace-exception-review.js

      - name: Validate Marketplace browser module syntax
        run: |
          node --experimental-default-type=module --check public/assets/js/customer-commerce-dashboard.js
          node --experimental-default-type=module --check public/assets/js/customer-marketplace-operations.js
          node --experimental-default-type=module --check public/assets/js/marketplace-exception-review.js
          node --experimental-default-type=module --check public/assets/js/marketplace-vendor-handoff.js
          node --experimental-default-type=module --check public/assets/js/customer-marketplace-ordering.js
          node --experimental-default-type=module --check public/assets/js/marketplace-order-engine.js

      - name: Run Marketplace policy tests
        run: npm run test:marketplace --prefix functions

      - name: Validate Firebase configuration JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'));"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json', 'utf8'));"
          node -e "JSON.parse(require('fs').readFileSync('functions/package.json', 'utf8'));"

      - name: Verify Marketplace production wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q "getMarketplaceExceptionQueue" functions/index-stats.js
          grep -q "reviewMarketplaceException" functions/index-stats.js
          grep -q "marketplaceExceptionRoot" public/live-operations-command.html
          grep -q "marketplaceExceptionRecentRoot" public/live-operations-command.html
          grep -q "marketplace-exception-review.js" public/live-operations-command.html
          grep -q "customerOrderRoot" public/customer-commerce.html
          grep -q "customerRefundRoot" public/customer-commerce.html
          grep -q "customer-marketplace-operations.js" public/customer-commerce.html

      - name: Marketplace validation summary
        run: |
          echo "Marketplace production validation passed."
          echo "Stripe Checkout, webhook, subscription, and refund execution still require configured Firebase secrets and test-mode acceptance."
