name: Runtime Shell Validation

on:
  push:
    branches:
      - evaraos
    paths:
      - "firebase.json"
      - "public/**/*.html"
      - "public/assets/js/firebase.js"
      - "public/assets/js/loader.js"
      - "public/assets/js/nav.js"
      - "public/assets/js/nav/**"
      - "public/assets/js/experience/**"
      - "public/assets/js/studio/experience-editor.js"
      - "public/assets/css/pages/studio-experience-editor.css"
      - "public/assets/js/access-control.js"
      - "public/assets/js/account-lifecycle.js"
      - "public/assets/js/account-status.js"
      - "public/assets/js/verified-profile.js"
      - "public/assets/js/auth.js"
      - "public/assets/js/route-guard.js"
      - "public/assets/js/direct-access-check.js"
      - "public/assets/js/field-ops-map-layer.js"
      - "public/assets/js/field-ops-realtime.js"
      - "public/assets/js/dashboard-live-map-card.js"
      - "public/assets/js/leads-entry.js"
      - "public/assets/js/map-view-parameters.js"
      - "tools/access-authority-audit.mjs"
      - "tools/account-lifecycle-audit.mjs"
      - "tools/experience-runtime-audit.js"
      - "tools/experience-editor-audit.js"
      - ".github/workflows/runtime-shell-validation.yml"
  pull_request:
    paths:
      - "firebase.json"
      - "public/**/*.html"
      - "public/assets/js/firebase.js"
      - "public/assets/js/loader.js"
      - "public/assets/js/nav.js"
      - "public/assets/js/nav/**"
      - "public/assets/js/experience/**"
      - "public/assets/js/studio/experience-editor.js"
      - "public/assets/css/pages/studio-experience-editor.css"
      - "public/assets/js/access-control.js"
      - "public/assets/js/account-lifecycle.js"
      - "public/assets/js/account-status.js"
      - "public/assets/js/verified-profile.js"
      - "public/assets/js/auth.js"
      - "public/assets/js/route-guard.js"
      - "public/assets/js/direct-access-check.js"
      - "public/assets/js/field-ops-map-layer.js"
      - "public/assets/js/field-ops-realtime.js"
      - "public/assets/js/dashboard-live-map-card.js"
      - "public/assets/js/leads-entry.js"
      - "public/assets/js/map-view-parameters.js"
      - "tools/access-authority-audit.mjs"
      - "tools/account-lifecycle-audit.mjs"
      - "tools/experience-runtime-audit.js"
      - "tools/experience-editor-audit.js"
      - ".github/workflows/runtime-shell-validation.yml"

permissions:
  contents: read

jobs:
  validate-runtime-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate configuration and JavaScript syntax
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'));"
          node --experimental-default-type=module --check public/assets/js/firebase.js
          node --check public/assets/js/loader.js
          node --experimental-default-type=module --check public/assets/js/nav.js
          node --experimental-default-type=module --check public/assets/js/nav/nav-main-v6.js
          node --experimental-default-type=module --check public/assets/js/experience/experience-runtime.js
          node --experimental-default-type=module --check public/assets/js/studio/experience-editor.js
          node --experimental-default-type=module --check public/assets/js/access-control.js
          node --experimental-default-type=module --check public/assets/js/account-lifecycle.js
          node --experimental-default-type=module --check public/assets/js/account-status.js
          node --experimental-default-type=module --check public/assets/js/verified-profile.js
          node --experimental-default-type=module --check public/assets/js/auth.js
          node --experimental-default-type=module --check public/assets/js/route-guard.js
          node --experimental-default-type=module --check public/assets/js/direct-access-check.js
          node --experimental-default-type=module --check public/assets/js/field-ops-map-layer.js
          node --experimental-default-type=module --check public/assets/js/field-ops-realtime.js
          node --experimental-default-type=module --check public/assets/js/dashboard-live-map-card.js
          node --experimental-default-type=module --check public/assets/js/leads-entry.js
          node --experimental-default-type=module --check public/assets/js/map-view-parameters.js
          node --check tools/access-authority-audit.mjs
          node --check tools/account-lifecycle-audit.mjs
          node --check tools/experience-runtime-audit.js
          node --check tools/experience-editor-audit.js

      - name: Validate route and session authority
        run: |
          set -euo pipefail
          node tools/access-authority-audit.mjs
          node tools/account-lifecycle-audit.mjs

      - name: Validate registered-slot Experience runtime
        run: |
          set -euo pipefail
          node tools/experience-runtime-audit.js

      - name: Validate owner Experience editor
        run: |
          set -euo pipefail
          node tools/experience-editor-audit.js

      - name: Audit shell entrypoints and cache policy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          const failures = [];
          const htmlFiles = walk('public').filter((file) => file.endsWith('.html'));

          for (const file of htmlFiles) {
            const source = fs.readFileSync(file, 'utf8');
            const loaderCount = (source.match(/\/assets\/js\/loader\.js/g) || []).length;
            const navCount = (source.match(/\/assets\/js\/nav\.js/g) || []).length;
            const hasUniversalNav = /id=["']universalNavRoot["']/.test(source);
            const hasAppLoading = /<body[^>]*class=["'][^"']*app-loading/.test(source);

            if (loaderCount > 1) failures.push(`${file}: loader.js is included ${loaderCount} times`);
            if (navCount > 1) failures.push(`${file}: nav.js is included ${navCount} times`);
            if (hasUniversalNav && navCount !== 1) failures.push(`${file}: universal navigation requires exactly one nav.js entry`);
            if (hasAppLoading && loaderCount !== 1) failures.push(`${file}: app-loading requires exactly one loader.js entry`);
          }

          const firebaseSource = fs.readFileSync('public/assets/js/firebase.js', 'utf8');
          if (!firebaseSource.includes('getApps().length ? getApp() : initializeApp(firebaseConfig)')) {
            failures.push('firebase.js: Firebase app initialization must be idempotent');
          }
          if (!firebaseSource.includes('__EVARAOS_FIREBASE_RUNTIME_V2__')) {
            failures.push('firebase.js: shared authentication runtime guard is missing');
          }

          const firebaseExports = new Set();
          for (const match of firebaseSource.matchAll(/\bexport\s+(?:async\s+)?(?:const|let|var|function|class)\s+([A-Za-z_$][\w$]*)/g)) {
            firebaseExports.add(match[1]);
          }
          for (const match of firebaseSource.matchAll(/\bexport\s*\{([^}]+)\}/gs)) {
            for (const specifier of match[1].split(',')) {
              const exportedName = specifier.trim().split(/\s+as\s+/).at(-1);
              if (exportedName) firebaseExports.add(exportedName);
            }
          }

          const navRuntimeFiles = walk('public/assets/js/nav').filter((file) => file.endsWith('.js'));
          for (const file of navRuntimeFiles) {
            const source = fs.readFileSync(file, 'utf8');
            for (const match of source.matchAll(/import\s*\{([^}]+)\}\s*from\s*["']\.\.\/firebase\.js["']/gs)) {
              for (const specifier of match[1].split(',')) {
                const importedName = specifier.trim().split(/\s+as\s+/)[0];
                if (importedName && !firebaseExports.has(importedName)) {
                  failures.push(`${file}: imports missing Firebase export ${importedName}`);
                }
              }
            }
          }

          const dashboardEntrySource = fs.readFileSync('public/assets/js/dashboard-entry.js', 'utf8');
          const leadsEntrySource = fs.readFileSync('public/assets/js/leads-entry.js', 'utf8');
          const mapPreviewSource = fs.readFileSync('public/assets/js/dashboard-live-map-card.js', 'utf8');
          const operationsMapSource = fs.readFileSync('public/operations_map.html', 'utf8');
          const dispatchMapSource = fs.readFileSync('public/dispatch_map.html', 'utf8');

          if (!dashboardEntrySource.includes('dashboard-live-map-card.js')) {
            failures.push('dashboard-entry.js: shared compact Operations Map preview is missing');
          }
          if (!leadsEntrySource.includes('dashboard-live-map-card.js')) {
            failures.push('leads-entry.js: Leads must reuse the shared compact Operations Map preview');
          }
          if (leadsEntrySource.includes('leads-map-v2.js')) {
            failures.push('leads-entry.js: obsolete Leads-only map wrapper must not be restored');
          }
          if (fs.existsSync('public/assets/js/leads-map-v2.js')) {
            failures.push('leads-map-v2.js: parallel Leads map wrapper is forbidden');
          }
          if (!mapPreviewSource.includes('/operations_map.html?embed=1&type=lead')) {
            failures.push('dashboard-live-map-card.js: lead preview must embed the canonical compact Operations Map');
          }
          if (!mapPreviewSource.includes('/operations_map.html?type=lead')) {
            failures.push('dashboard-live-map-card.js: lead preview must link to the canonical Operations Map');
          }
          if (!mapPreviewSource.includes('leadsMapWorkspace')) {
            failures.push('dashboard-live-map-card.js: Leads mount target is missing');
          }
          if (!operationsMapSource.includes('map-view-parameters.js')) {
            failures.push('operations_map.html: compact map parameter forwarding is missing');
          }
          if (!dispatchMapSource.includes('map-view-parameters.js')) {
            failures.push('dispatch_map.html: expanded map parameter forwarding is missing');
          }

          const firebase = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const headers = firebase?.hosting?.headers || [];
          const wildcardNoStore = headers.some((rule) => {
            if (rule.source !== '**') return false;
            return (rule.headers || []).some((header) =>
              String(header.key || '').toLowerCase() === 'cache-control'
              && /no-store/i.test(String(header.value || ''))
            );
          });

          if (wildcardNoStore) failures.push('firebase.json: global no-store caching is forbidden for static assets');

          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }

          console.log(`Validated ${htmlFiles.length} HTML entrypoints, Firebase boot, lifecycle authority, role-scoped field operations, one canonical compact-to-expanded map flow, registered Experience slots, owner Experience editing, and the runtime cache policy.`);
          NODE
