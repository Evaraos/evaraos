name: Runtime Shell Validation

on:
  push:
    branches:
      - evaraos
    paths:
      - "firebase.json"
      - "public/**/*.html"
      - "public/assets/js/firebase.js"
      - "public/assets/js/loader.js"
      - "public/assets/js/nav.js"
      - "public/assets/js/nav/**"
      - "public/assets/js/experience/**"
      - "public/assets/js/studio/experience-editor.js"
      - "public/assets/css/pages/studio-experience-editor.css"
      - "public/assets/js/access-control.js"
      - "public/assets/js/account-lifecycle.js"
      - "public/assets/js/account-status.js"
      - "public/assets/js/verified-profile.js"
      - "public/assets/js/auth.js"
      - "public/assets/js/route-guard.js"
      - "public/assets/js/direct-access-check.js"
      - "public/assets/js/field-ops-map-layer.js"
      - "public/assets/js/field-ops-realtime.js"
      - "public/assets/js/dashboard-live-map-card.js"
      - "public/assets/js/leads-entry.js"
      - "public/assets/js/map-view-parameters.js"
      - "tools/access-authority-audit.mjs"
      - "tools/account-lifecycle-audit.mjs"
      - "tools/experience-runtime-audit.js"
      - "tools/experience-editor-audit.js"
      - ".github/workflows/runtime-shell-validation.yml"
  pull_request:
    paths:
      - "firebase.json"
      - "public/**/*.html"
      - "public/assets/js/firebase.js"
      - "public/assets/js/loader.js"
      - "public/assets/js/nav.js"
      - "public/assets/js/nav/**"
      - "public/assets/js/experience/**"
      - "public/assets/js/studio/experience-editor.js"
      - "public/assets/css/pages/studio-experience-editor.css"
      - "public/assets/js/access-control.js"
      - "public/assets/js/account-lifecycle.js"
      - "public/assets/js/account-status.js"
      - "public/assets/js/verified-profile.js"
      - "public/assets/js/auth.js"
      - "public/assets/js/route-guard.js"
      - "public/assets/js/direct-access-check.js"
      - "public/assets/js/field-ops-map-layer.js"
      - "public/assets/js/field-ops-realtime.js"
      - "public/assets/js/dashboard-live-map-card.js"
      - "public/assets/js/leads-entry.js"
      - "public/assets/js/map-view-parameters.js"
      - "tools/access-authority-audit.mjs"
      - "tools/account-lifecycle-audit.mjs"
      - "tools/experience-runtime-audit.js"
      - "tools/experience-editor-audit.js"
      - ".github/workflows/runtime-shell-validation.yml"

permissions:
  contents: read

jobs:
  validate-runtime-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate configuration and JavaScript syntax
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'));"
          node --experimental-default-type=module --check public/assets/js/firebase.js
          node --check public/assets/js/loader.js
          node --experimental-default-type=module --check public/assets/js/nav.js
          node --experimental-default-type=module --check public/assets/js/nav/nav-main-v6.js
          node --experimental-default-type=module --check public/assets/js/nav/nav-render.js
          node --experimental-default-type=module --check public/assets/js/nav/nav-scroll.js
          node --experimental-default-type=module --check public/assets/js/nav/nav-session.js
          node --experimental-default-type=module --check public/assets/js/nav/nav-utils.js
          node --experimental-default-type=module --check public/assets/js/experience/experience-runtime.js
          node --experimental-default-type=module --check public/assets/js/studio/experience-editor.js
          node --experimental-default-type=module --check public/assets/js/access-control.js
          node --experimental-default-type=module --check public/assets/js/account-lifecycle.js
          node --experimental-default-type=module --check public/assets/js/account-status.js
          node --experimental-default-type=module --check public/assets/js/verified-profile.js
          node --experimental-default-type=module --check public/assets/js/auth.js
          node --experimental-default-type=module --check public/assets/js/route-guard.js
          node --experimental-default-type=module --check public/assets/js/direct-access-check.js
          node --experimental-default-type=module --check public/assets/js/field-ops-map-layer.js
          node --experimental-default-type=module --check public/assets/js/field-ops-realtime.js
          node --experimental-default-type=module --check public/assets/js/dashboard-live-map-card.js
          node --experimental-default-type=module --check public/assets/js/leads-entry.js
          node --experimental-default-type=module --check public/assets/js/map-view-parameters.js
          node --check tools/access-authority-audit.mjs
          node --check tools/account-lifecycle-audit.mjs
          node --check tools/experience-runtime-audit.js
          node --check tools/experience-editor-audit.js

      - name: Validate route and session authority
        run: |
          set -euo pipefail
          node tools/access-authority-audit.mjs
          node tools/account-lifecycle-audit.mjs

      - name: Validate registered-slot Experience runtime
        run: |
          set -euo pipefail
          node tools/experience-runtime-audit.js

      - name: Validate owner Experience editor
        run: |
          set -euo pipefail
          node tools/experience-editor-audit.js

      - name: Audit shell entrypoints and cache policy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          const failures = [];
          const htmlFiles = walk('public').filter((file) => file.endsWith('.html'));

          for (const file of htmlFiles) {
            const source = fs.readFileSync(file, 'utf8');
            const loaderCount = (source.match(/\/assets\/js\/loader\.js/g) || []).length;
            const navCount = (source.match(/\/assets\/js\/nav\.js/g) || []).length;
            const hasUniversalNav = /id=["']universalNavRoot["']/.test(source);
            const hasAppLoading = /<body[^>]*class=["'][^"']*app-loading/.test(source);

            if (loaderCount > 1) failures.push(`${file}: loader.js is included ${loaderCount} times`);
            if (navCount > 1) failures.push(`${file}: nav.js is included ${navCount} times`);
            if (hasUniversalNav && navCount !== 1) failures.push(`${file}: universal navigation requires exactly one nav.js entry`);
            if (hasAppLoading && loaderCount !== 1) failures.push(`${file}: app-loading requires exactly one loader.js entry`);
          }

          const firebaseSource = fs.readFileSync('public/assets/js/firebase.js', 'utf8');
          const navEntrySource = fs.readFileSync('public/assets/js/nav.js', 'utf8');
          const navMainSource = fs.readFileSync('public/assets/js/nav/nav-main-v6.js', 'utf8');
          const navRenderSource = fs.readFileSync('public/assets/js/nav/nav-render.js', 'utf8');
          const navScrollSource = fs.readFileSync('public/assets/js/nav/nav-scroll.js', 'utf8');
          const navSessionSource = fs.readFileSync('public/assets/js/nav/nav-session.js', 'utf8');
          const navUtilsSource = fs.readFileSync('public/assets/js/nav/nav-utils.js', 'utf8');
          const navBottomSource = fs.readFileSync('public/assets/js/nav/nav-bottom.js', 'utf8');
          const navBottomCssSource = fs.readFileSync('public/assets/css/nav/nav-bottom.css', 'utf8');
          const navLogoutSource = fs.readFileSync('public/assets/js/nav/nav-logout.js', 'utf8');
          const accountStatusRuntimeSource = fs.readFileSync('public/assets/js/account-status.js', 'utf8');
          const navMotionSource = fs.readFileSync('public/assets/css/nav/nav-motion.css', 'utf8');
          const baseSource = fs.readFileSync('public/assets/css/base.css', 'utf8');
          const accountStatusSource = fs.readFileSync('public/account-status.html', 'utf8');
          if (!firebaseSource.includes('getApps().length ? getApp() : initializeApp(firebaseConfig)')) {
            failures.push('firebase.js: Firebase app initialization must be idempotent');
          }
          if (!firebaseSource.includes('__EVARAOS_FIREBASE_RUNTIME_V2__')) {
            failures.push('firebase.js: shared authentication runtime guard is missing');
          }
          const globalAuthSyncBody = firebaseSource.match(/export function startGlobalAuthSync\(\)\s*\{([\s\S]*?)\n\}/)?.[1] || '';
          if (!globalAuthSyncBody.includes('const requiresAuthPresentationLock = document.body?.dataset?.routeGuard !== "public";')
            || !globalAuthSyncBody.includes('if (requiresAuthPresentationLock) {')
            || !globalAuthSyncBody.includes('document.documentElement.classList.add("auth-pending");')
            || !globalAuthSyncBody.includes('document.body?.classList.add("auth-pending", "app-loading");')
            || !globalAuthSyncBody.includes('onAuthStateChanged(auth, async (user) => {')) {
            failures.push('firebase.js: public routes must continue auth sync without a global presentation lock; protected routes must retain that lock');
          }

          const firebaseExports = new Set();
          for (const match of firebaseSource.matchAll(/\bexport\s+(?:async\s+)?(?:const|let|var|function|class)\s+([A-Za-z_$][\w$]*)/g)) {
            firebaseExports.add(match[1]);
          }
          for (const match of firebaseSource.matchAll(/\bexport\s*\{([^}]+)\}/gs)) {
            for (const specifier of match[1].split(',')) {
              const exportedName = specifier.trim().split(/\s+as\s+/).at(-1);
              if (exportedName) firebaseExports.add(exportedName);
            }
          }

          const navRuntimeFiles = walk('public/assets/js/nav').filter((file) => file.endsWith('.js'));
          for (const file of navRuntimeFiles) {
            const source = fs.readFileSync(file, 'utf8');
            for (const match of source.matchAll(/import\s*\{([^}]+)\}\s*from\s*["']\.\.\/firebase\.js["']/gs)) {
              for (const specifier of match[1].split(',')) {
                const importedName = specifier.trim().split(/\s+as\s+/)[0];
                if (importedName && !firebaseExports.has(importedName)) {
                  failures.push(`${file}: imports missing Firebase export ${importedName}`);
                }
              }
            }
          }

          const navRebindBody = navSessionSource.match(/export async function rebindNavAfterRender\(\)\s*\{([\s\S]*?)\n\}/)?.[1] || '';
          if (!navSessionSource.includes('import(`./nav-interactions.js?v=${NAV_BUILD}`)')
            || !navRebindBody.includes('binders.interactions.bindNavInteractions();')) {
            failures.push('nav-session.js: post-render refresh must restore canonical navigation interactions');
          }
          if (!navSessionSource.includes('import(`./nav-logout.js?v=${NAV_BUILD}`)')
            || !navRebindBody.includes('bindLogout();')) {
            failures.push('nav-session.js: post-render refresh must restore canonical logout binding');
          }
          if (!navSessionSource.includes('import(`./nav-menu.js?v=${NAV_BUILD}`)')
            || !navRebindBody.includes('binders.menu.bindMenu();')) {
            failures.push('nav-session.js: post-render refresh must restore canonical menu binding');
          }
          const accessControlSource = fs.readFileSync('public/assets/js/access-control.js', 'utf8');
          const publicPagesDeclaration = accessControlSource.match(/export const PUBLIC_PAGES\s*=\s*Object\.freeze\(new Set\(\[([\s\S]*?)\]\)\)/)?.[1] || '';
          const canonicalPublicPages = new Set(Array.from(publicPagesDeclaration.matchAll(/["']([^"']+)["']/g), (match) => match[1]));
          const home2GuestPublicRoutes = ['index.html', 'login.html', 'signup.html', 'reset.html', 'staff_application.html'];
          const entryUsesCanonicalPublicRouteAuthority = /canAccessPageName\(\s*pathname\s*,\s*["']guest["']\s*\)/.test(navEntrySource);
          const sessionUsesCanonicalPublicRouteAuthority = /canAccessPageName\(\s*window\.location\.pathname\s*,\s*["']guest["']\s*\)/.test(navSessionSource);
          const entryMountsPublicBottomNavImmediately = /if\s*\(isPublicBottomNavRoute\)\s*loadBottomNav\(\);/.test(navEntrySource);
          if (!home2GuestPublicRoutes.every((route) => canonicalPublicPages.has(route))
            || !entryUsesCanonicalPublicRouteAuthority
            || !sessionUsesCanonicalPublicRouteAuthority
            || !entryMountsPublicBottomNavImmediately
            || /GUEST_BOTTOM_NAV_PAGE_NAMES|GUEST_BOTTOM_NAV_PAGE/.test(`${navEntrySource}\n${navSessionSource}`)
            || !/public.*bottom|bottom.*public/i.test(navEntrySource)
            || !/public.*bottom|bottom.*public/i.test(navSessionSource)
            || !navEntrySource.includes('safeImport("./nav/nav-bottom.js?v=nav-v60-shell-recovery")')) {
            failures.push('HOME-2: canonical public routes must request the bottom navigation immediately from route authority, independently of transient session timing, without a duplicate route registry');
          }
          if (!navSessionSource.includes('import("./nav-bottom.js?v=nav-v60-shell-recovery")')
            || !navSessionSource.includes('({ mountBottomNav }) => mountBottomNav()')
            || !navRebindBody.includes('restoreBottomNavAfterRender();')
            || !navBottomSource.includes('if (force) layer.querySelector(".eva-bottom-nav")?.remove();')
            || !navBottomSource.includes('if (layer.querySelector(".eva-bottom-nav")) return false;')) {
            failures.push('HOME-2: eligible guest and verified authenticated routes must restore one canonical bottom navigation after render');
          }
          const guestDefaultItems = navBottomSource.match(/GUEST_DEFAULT_ITEMS\s*=\s*\[([^\]]*)\]/)?.[1]?.match(/["']([^"']+)["']/g)?.map((item) => item.slice(1, -1)) || [];
          const expectedGuestDefaultItems = ['home', 'signup', 'apply'];
          if (guestDefaultItems.length !== expectedGuestDefaultItems.length
            || guestDefaultItems.some((item, index) => item !== expectedGuestDefaultItems[index])
            || !/home:\s*\{[^}]*label:\s*["']Home["'][^}]*page:\s*["']index\.html["']/.test(navBottomSource)
            || !/home:\s*\{[^}]*href:\s*["']\/["']/.test(navBottomSource)
            || !/signup:\s*\{[^}]*label:\s*["']Sign Up["'][^}]*page:\s*["']signup\.html["']/.test(navBottomSource)
            || !/apply:\s*\{[^}]*label:\s*["']Apply["'][^}]*page:\s*["']staff_application\.html["']/.test(navBottomSource)
            || !navBottomSource.includes('canAccessPageName(REGISTRY[id].page, role)')
            || !/isGuestPublicNavigation\(\)[\s\S]*?canAccessPageName\(window\.location\.pathname, "guest"\)[\s\S]*?!isAuthenticated\(\)/.test(navBottomSource)
            || !navBottomSource.includes('const selected = ids.length === 5 ? ids : defaults;')) {
            failures.push('HOME-2: guest bottom navigation must be an authority-filtered, non-authenticated Home / Sign Up / Apply default');
          }
          if (!navBottomSource.includes('nav.dataset.evaItemCount = String(items.length)')
            || !/\.eva-bottom-nav\[data-eva-item-count=["']3["']\]\s*\{[^}]*grid-template-columns\s*:\s*repeat\(3,\s*minmax\(0,\s*1fr\)\)/.test(navBottomCssSource)
            || !/\.eva-bottom-nav\s*\{[^}]*grid-template-columns\s*:\s*repeat\(5,\s*minmax\(0,\s*1fr\)\)/.test(navBottomCssSource)) {
            failures.push('HOME-2: the runtime item-count hook must permit a scoped three-column guest bar while preserving the five-column default');
          }
          if (!navBottomSource.includes('let bottomScrollBound = false;')
            || (navBottomSource.match(/window\.addEventListener\("scroll", scheduleBottomNavScrollUpdate/g) || []).length !== 1) {
            failures.push('HOME-2: bottom navigation remounts must retain exactly one directional-scroll binding');
          }
          if (!/const destination = buildHref\(["']login\.html["']\);/.test(navLogoutSource)
            || !/window\.location\.replace\(['"]\/login\.html['"]\)/.test(accountStatusRuntimeSource)) {
            failures.push('HOME-2: both active explicit logout owners must redirect successful logout to Login, where the guest Home escape remains available');
          }
          if (!navRebindBody.includes('restoreBottomNavAfterRender();')) {
            failures.push('nav-session.js: post-render refresh must restore eligible bottom navigation');
          }

          const navShellSource = fs.readFileSync('public/assets/css/nav/nav-shell.css', 'utf8');
          const guestAccountBlock = navRenderSource.match(/function accountGroup\(authed\)\s*\{[\s\S]*?if\s*\(!authed\)\s*\{([\s\S]*?)\n\s*\}\n\s*const actions/)?.[1] || '';
          const guestDrawerItems = Array.from(guestAccountBlock.matchAll(/\[\s*["']([^"']+)["']\s*,\s*["']([^"']+)["']/g), (match) => ({ label: match[1], route: match[2] }));

          if (/function publicHomeMarkup\s*\(/.test(navRenderSource) || /eva-public-home-pill/.test(`${navRenderSource}\n${navShellSource}`)) {
            failures.push('nav-render.js: legacy reduced public-Home pill contract must remain removed');
          }
          if (!/const\s+publicRoute\s*=\s*isCanonicalPublicRoute\(\);[\s\S]*?const\s+guestPublic\s*=\s*publicRoute\s*&&\s*!groups\.authed/.test(navRenderSource)
            || !navRenderSource.includes('evaMenuBtn')
            || !navRenderSource.includes('evaMenuPanel')
            || !navRenderSource.includes('evaPublicAccessControl')
            || !navRenderSource.includes('function guestPublicTopControl()')
            || !navShellSource.includes('content:"Evaraos"')) {
            failures.push('nav-render.js: every canonical public guest route must render the universal menu, centered Evaraos title, and public right action');
          }
          const expectedGuestDrawerItems = [
            { label: 'Login', route: 'login.html' },
            { label: 'Sign Up', route: 'signup.html' },
            { label: 'Apply', route: 'staff_application.html' }
          ];
          if (guestDrawerItems.length !== expectedGuestDrawerItems.length
            || guestDrawerItems.some((item, index) => item.label !== expectedGuestDrawerItems[index].label || item.route !== expectedGuestDrawerItems[index].route)
            || guestDrawerItems.some(({ route }) => !canonicalPublicPages.has(route))
            || !/guestPublic\s*\?\s*accountGroup\(false\)/.test(navRenderSource)
            || !/guestPublic\s*\?\s*""\s*:\s*aiGroup\(groups\.authed\)/.test(navRenderSource)) {
            failures.push('nav-render.js: guest public drawer must expose only Login, Sign Up, and Apply with no private application group');
          }

          const guestActionBody = navRenderSource.match(/function guestPublicTopControl\(\)\s*\{([\s\S]*?)\n\}/)?.[1] || '';
          if (!guestActionBody.includes('isCurrentPage("login.html")')
            || !guestActionBody.includes('{ label: "Sign Up", page: "signup.html"')
            || !guestActionBody.includes('{ label: "Login", page: "login.html"')
            || !/const\s+topRight\s*=\s*guestPublic\s*\?\s*guestPublicTopControl\(\)\s*:\s*`<button[^`]*globalNotificationsBell/.test(navRenderSource)) {
            failures.push('PUBLIC-SHELL-1: Login must expose Sign Up; every other canonical guest route must expose Login; guest routes must not render a notification bell');
          }
          if (!/export function isCanonicalPublicRoute\(\)\s*\{\s*return canAccessPageName\(window\.location\.pathname, "guest"\);/.test(navUtilsSource)
            || !/export function isVerifiedSession\([\s\S]*?session\?\.authenticated === true[\s\S]*?verifiedSource[\s\S]*?session\?\.lifecycle === "active"[\s\S]*?session\?\.role/.test(navUtilsSource)
            || !/export function isAuthenticated\(\)\s*\{\s*if \(isCanonicalPublicRoute\(\)\) return isVerifiedSession\(\);/.test(navUtilsSource)
            || !navSessionSource.includes('firebase.onAuthStateChanged(firebase.auth, (user) => {')
            || !navSessionSource.includes('profile.readVerifiedUserProfile')
            || !navSessionSource.includes('lifecycle.resolveAccountLifecycle')
            || !navSessionSource.includes('if (!lifecycle.active)')) {
            failures.push('PUBLIC-SHELL-1: public shell authority must require an active verified session, never stored role data alone');
          }
          if (/(setDoc|addDoc|updateDoc|deleteDoc|writeBatch|httpsCallable|fetch\()/.test(`${navMainSource}\n${navRenderSource}\n${navSessionSource}\n${navUtilsSource}`)) {
            failures.push('PUBLIC-SHELL-1: navigation shell must not introduce Firebase or network writes');
          }
          if (!/function scheduleAccountSystems\(\)\s*\{\s*if\(!isVerifiedSession\?\.\(\)\)return;[\s\S]*?bindAccountSystems\(\)/.test(navMainSource)
            || !/function bindSessionLifecycle\(\)[\s\S]*?window\.addEventListener\("evara:session-ready",\(\)=>\{[\s\S]*?if\(isVerifiedSession\?\.\(\)\)scheduleAccountSystems\(\);/.test(navMainSource)
            || !navMainSource.includes('optional("../notifications-dropdown.js")')) {
            failures.push('PUBLIC-SHELL-1: notification initialization must require verified session authority on every route');
          }
          if (!/if \(!isCanonicalPublicRoute\(\) \|\| isVerifiedSession\(\)\)\s*\{[\s\S]*?binders\.events\.bindAllNavEvents\(\);[\s\S]*?binders\.interactions\.bindNavInteractions\(\);/.test(navSessionSource)
            || !/async function bindSystems\(\)\s*\{[\s\S]*?await bindCoreSystems\(\);[\s\S]*?bindMotionSystems\(\)/.test(navMainSource)) {
            failures.push('PUBLIC-SHELL-1: verified sessions must restore canonical events, interactions, and motion instead of a lean bypass');
          }
          const studioLoaderSource = fs.readFileSync('public/assets/js/studio/studio-visual-builder-loader.js', 'utf8');
          const studioProductionAuthoritySource = fs.readFileSync('public/assets/js/studio/studio-production-authority.js', 'utf8');
          const adaptiveComponentsSource = fs.readFileSync('public/assets/css/theme/adaptive-components.css', 'utf8');
          if (/owner-editor\.js|maybeLoadOwnerEditor|ownerEditorRequested|ownerRoles/.test(navEntrySource)
            || !navEntrySource.includes('if (!isPublicBottomNavRoute) idleEnhancements.push(safeImport("./nav/avatar-sync.js?v=nav-v59-responsive-core"));')
            || !studioLoaderSource.includes('studio-visual-builder.js')) {
            failures.push('SHELL-RECOVERY-1: normal navigation must not import global owner-editor chrome; Studio must retain its independent visual-builder loader');
          }
          if (!navMainSource.includes('function revealPublicHomeShell()')
            || !navMainSource.includes('document.body?.classList.remove("auth-pending","app-loading");')
            || !navMainSource.includes('window.EvaraLoader?.completeNavigationLoad?.();')) {
            failures.push('SHELL-RECOVERY-1: public Home navigation readiness must release only the public presentation shell from stale loading locks');
          }
          if (!adaptiveComponentsSource.includes('--surface-on-dark-primary')
            || !adaptiveComponentsSource.includes('--surface-on-light-primary')
            || !adaptiveComponentsSource.includes('color:var(--studio-recovery-text-primary)!important')
            || !adaptiveComponentsSource.includes('color:var(--studio-recovery-text-secondary)!important')
            || !adaptiveComponentsSource.includes('.studio-production-conflict-kicker{color:#ff9aa6!important}')
            || !adaptiveComponentsSource.includes('button:focus-visible')
            || !adaptiveComponentsSource.includes('button[aria-busy="true"]')) {
            failures.push('SURFACE-TEXT-1: the known dark Studio recovery surface must own deterministic on-dark text and control states without image-derived semantic ink');
          }
          if (!studioProductionAuthoritySource.includes("function isTrustedSyncUnavailable(state = conflictState)")
            || !studioProductionAuthoritySource.includes("state?.reason === 'app-check-unavailable'")
            || !studioProductionAuthoritySource.includes("state: syncUnavailable ? 'sync-unavailable'")
            || !studioProductionAuthoritySource.includes("text: 'Keep working locally'")
            || !studioProductionAuthoritySource.includes('await readiness.retry()')) {
            failures.push('STUDIO-RECOVERY-UX-1: App Check unavailability must present safe local-authoring and retry actions without treating it as a branch-head conflict');
          }
          if (!/export function isCompact\(\)\s*\{[\s\S]*?!atTopOfPage\(\)[\s\S]*?nav-menu-open/.test(navScrollSource)
            || !navScrollSource.includes('shell.classList.toggle("compact", nextCompact);')
            || !navScrollSource.includes('shell.classList.toggle("expanded", !nextCompact);')) {
            failures.push('nav-scroll.js: expanded-at-top and compact-on-scroll state contract is missing');
          }
          if (navScrollSource.includes('classList.toggle("is-hidden"')) {
            failures.push('nav-scroll.js: current top navigation must remain visible instead of hiding on scroll');
          }
          if (!accountStatusSource.includes('data-route-guard="account-status"')
            || !accountStatusSource.includes('id="universalNavRoot"')
            || !accountStatusSource.includes('/assets/css/nav.css')
            || !accountStatusSource.includes('/assets/js/nav.js')
            || (accountStatusSource.match(/padding:var\(--eva-page-top-space\)/g) || []).length < 2) {
            failures.push('account-status.html: canonical guard, universal navigation bootstrap, and responsive top clearance are required');
          }
          if (/body\s+#appRoot\s*\{[^}]*padding-top/i.test(navMotionSource)) {
            failures.push('nav-motion.css: generic #appRoot top clearance is forbidden');
          }
          for (const token of ['--eva-nav-clearance-expanded', '--eva-nav-clearance-compact', '--eva-nav-clearance-current', '--eva-page-sticky-top']) {
            if (!baseSource.includes(token)) failures.push(`base.css: missing canonical navigation clearance token ${token}`);
          }

          const dashboardEntrySource = fs.readFileSync('public/assets/js/dashboard-entry.js', 'utf8');
          const leadsEntrySource = fs.readFileSync('public/assets/js/leads-entry.js', 'utf8');
          const mapPreviewSource = fs.readFileSync('public/assets/js/dashboard-live-map-card.js', 'utf8');
          const operationsMapSource = fs.readFileSync('public/operations_map.html', 'utf8');
          const dispatchMapSource = fs.readFileSync('public/dispatch_map.html', 'utf8');

          if (!dashboardEntrySource.includes('dashboard-live-map-card.js')) {
            failures.push('dashboard-entry.js: shared compact Operations Map preview is missing');
          }
          if (!leadsEntrySource.includes('dashboard-live-map-card.js')) {
            failures.push('leads-entry.js: Leads must reuse the shared compact Operations Map preview');
          }
          if (leadsEntrySource.includes('leads-map-v2.js')) {
            failures.push('leads-entry.js: obsolete Leads-only map wrapper must not be restored');
          }
          if (fs.existsSync('public/assets/js/leads-map-v2.js')) {
            failures.push('leads-map-v2.js: parallel Leads map wrapper is forbidden');
          }
          if (!mapPreviewSource.includes('/operations_map.html?embed=1&type=lead')) {
            failures.push('dashboard-live-map-card.js: lead preview must embed the canonical compact Operations Map');
          }
          if (!mapPreviewSource.includes('/operations_map.html?type=lead')) {
            failures.push('dashboard-live-map-card.js: lead preview must link to the canonical Operations Map');
          }
          if (!mapPreviewSource.includes('leadsMapWorkspace')) {
            failures.push('dashboard-live-map-card.js: Leads mount target is missing');
          }
          if (!operationsMapSource.includes('map-view-parameters.js')) {
            failures.push('operations_map.html: compact map parameter forwarding is missing');
          }
          if (!dispatchMapSource.includes('map-view-parameters.js')) {
            failures.push('dispatch_map.html: expanded map parameter forwarding is missing');
          }

          const firebase = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const headers = firebase?.hosting?.headers || [];
          const wildcardNoStore = headers.some((rule) => {
            if (rule.source !== '**') return false;
            return (rule.headers || []).some((header) =>
              String(header.key || '').toLowerCase() === 'cache-control'
              && /no-store/i.test(String(header.value || ''))
            );
          });

          if (wildcardNoStore) failures.push('firebase.json: global no-store caching is forbidden for static assets');

          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }

          console.log(`Validated ${htmlFiles.length} HTML entrypoints, Firebase boot, lifecycle authority, role-scoped field operations, one canonical compact-to-expanded map flow, registered Experience slots, owner Experience editing, and the runtime cache policy.`);
