name: Owner Experience Builder hardening

on:
  pull_request:
    paths:
      - 'functions/experience-config-service.js'
      - 'public/assets/js/loader.js'
      - 'public/assets/js/nav.js'
      - 'public/assets/js/experience/**'
      - 'public/assets/js/studio/studio-experience-builder.js'
      - '.github/workflows/owner-experience-builder-hardening.yml'

permissions:
  contents: write

jobs:
  harden-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reviewed hardening edits
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected pattern missing in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          service = 'functions/experience-config-service.js'
          replace(service,
              "const { onCall, onRequest, HttpsError } = require('firebase-functions/v2/https');\n",
              "const { onCall, onRequest, HttpsError } = require('firebase-functions/v2/https');\nconst { normalizeRole, isActiveProfile, canPublishStudio } = require('./studio-journal-core');\n")
          replace(service,
              "function accountIsActive(profile = {}) {\n  const status = cleanText(profile.status || 'active', 40).toLowerCase();\n  const approval = cleanText(profile.approvalStatus || '', 40).toLowerCase();\n  return !['inactive', 'suspended', 'disabled', 'rejected'].includes(status) && approval !== 'rejected';\n}\n\n",
              "")
          replace(service,
              "  const role = cleanText(profile.role, 80).toLowerCase().replace(/[\\s-]+/g, '_');\n  const elevatedAdmin = role === 'admin' && profile.platformAccess === true;\n  if (!accountIsActive(profile) || !['owner', 'super_admin', 'platform_admin'].includes(role) && !elevatedAdmin) {\n",
              "  const role = normalizeRole(profile.role);\n  if (!isActiveProfile(profile) || !canPublishStudio(profile)) {\n")
          replace(service,
              "function cleanId(value, max = 160) {\n",
              "function configuredText(value, fallback, max) {\n  return value === undefined || value === null ? cleanText(fallback, max) : cleanText(value, max);\n}\n\nfunction cleanId(value, max = 160) {\n")
          for old, new in [
              ("alt: cleanText(raw?.brand?.alt || fallback.brand.alt, 120)", "alt: configuredText(raw?.brand?.alt, fallback.brand.alt, 120)"),
              ("eyebrow: cleanText(raw?.loaders?.welcome?.eyebrow || fallback.loaders.welcome.eyebrow, 80)", "eyebrow: configuredText(raw?.loaders?.welcome?.eyebrow, fallback.loaders.welcome.eyebrow, 80)"),
              ("title: cleanText(raw?.loaders?.welcome?.title || fallback.loaders.welcome.title, 180)", "title: configuredText(raw?.loaders?.welcome?.title, fallback.loaders.welcome.title, 180)"),
              ("subtitle: cleanText(raw?.loaders?.welcome?.subtitle || fallback.loaders.welcome.subtitle, 320)", "subtitle: configuredText(raw?.loaders?.welcome?.subtitle, fallback.loaders.welcome.subtitle, 320)"),
              ("label: cleanText(raw?.loaders?.page?.label || fallback.loaders.page.label, 160)", "label: configuredText(raw?.loaders?.page?.label, fallback.loaders.page.label, 160)"),
              ("title: cleanText(raw?.loaders?.resume?.title || fallback.loaders.resume.title, 180)", "title: configuredText(raw?.loaders?.resume?.title, fallback.loaders.resume.title, 180)"),
              ("subtitle: cleanText(raw?.loaders?.resume?.subtitle || fallback.loaders.resume.subtitle, 320)", "subtitle: configuredText(raw?.loaders?.resume?.subtitle, fallback.loaders.resume.subtitle, 320)"),
              ("kicker: cleanText(raw?.home?.kicker || fallback.home.kicker, 180)", "kicker: configuredText(raw?.home?.kicker, fallback.home.kicker, 180)"),
              ("title: cleanText(raw?.home?.title || fallback.home.title, 260)", "title: configuredText(raw?.home?.title, fallback.home.title, 260)"),
              ("subtitle: cleanText(raw?.home?.subtitle || fallback.home.subtitle, 1200)", "subtitle: configuredText(raw?.home?.subtitle, fallback.home.subtitle, 1200)"),
              ("primaryAction: cleanText(raw?.home?.primaryAction || fallback.home.primaryAction, 100)", "primaryAction: configuredText(raw?.home?.primaryAction, fallback.home.primaryAction, 100)"),
              ("secondaryAction: cleanText(raw?.home?.secondaryAction || fallback.home.secondaryAction, 100)", "secondaryAction: configuredText(raw?.home?.secondaryAction, fallback.home.secondaryAction, 100)")
          ]:
              replace(service, old, new)

          runtime = 'public/assets/js/experience/experience-runtime.js'
          replace(runtime,
              "const hex = (value, fallback) => /^#[0-9a-f]{6}$/i.test(String(value || '')) ? String(value).toLowerCase() : fallback;\n",
              "const hex = (value, fallback) => /^#[0-9a-f]{6}$/i.test(String(value || '')) ? String(value).toLowerCase() : fallback;\nconst configuredText = (value, fallback, max) => value === undefined || value === null ? text(fallback, max) : text(value, max);\n")
          for old, new in [
              ("alt: text(raw?.brand?.alt || fallback.brand.alt, 120)", "alt: configuredText(raw?.brand?.alt, fallback.brand.alt, 120)"),
              ("eyebrow: text(raw?.loaders?.welcome?.eyebrow || fallback.loaders.welcome.eyebrow, 80)", "eyebrow: configuredText(raw?.loaders?.welcome?.eyebrow, fallback.loaders.welcome.eyebrow, 80)"),
              ("title: text(raw?.loaders?.welcome?.title || fallback.loaders.welcome.title, 180)", "title: configuredText(raw?.loaders?.welcome?.title, fallback.loaders.welcome.title, 180)"),
              ("subtitle: text(raw?.loaders?.welcome?.subtitle || fallback.loaders.welcome.subtitle, 320)", "subtitle: configuredText(raw?.loaders?.welcome?.subtitle, fallback.loaders.welcome.subtitle, 320)"),
              ("label: text(raw?.loaders?.page?.label || fallback.loaders.page.label, 160)", "label: configuredText(raw?.loaders?.page?.label, fallback.loaders.page.label, 160)"),
              ("title: text(raw?.loaders?.resume?.title || fallback.loaders.resume.title, 180)", "title: configuredText(raw?.loaders?.resume?.title, fallback.loaders.resume.title, 180)"),
              ("subtitle: text(raw?.loaders?.resume?.subtitle || fallback.loaders.resume.subtitle, 320)", "subtitle: configuredText(raw?.loaders?.resume?.subtitle, fallback.loaders.resume.subtitle, 320)"),
              ("kicker: text(raw?.home?.kicker || fallback.home.kicker, 180)", "kicker: configuredText(raw?.home?.kicker, fallback.home.kicker, 180)"),
              ("title: text(raw?.home?.title || fallback.home.title, 260)", "title: configuredText(raw?.home?.title, fallback.home.title, 260)"),
              ("subtitle: text(raw?.home?.subtitle || fallback.home.subtitle, 1200)", "subtitle: configuredText(raw?.home?.subtitle, fallback.home.subtitle, 1200)"),
              ("primaryAction: text(raw?.home?.primaryAction || fallback.home.primaryAction, 100)", "primaryAction: configuredText(raw?.home?.primaryAction, fallback.home.primaryAction, 100)"),
              ("secondaryAction: text(raw?.home?.secondaryAction || fallback.home.secondaryAction, 100)", "secondaryAction: configuredText(raw?.home?.secondaryAction, fallback.home.secondaryAction, 100)")
          ]:
              replace(runtime, old, new)
          replace(runtime,
              "function applyLoaderConfig(config) {\n  const welcome = config.loaders.welcome;\n  const page = config.loaders.page;\n",
              "function applyLoaderConfig(config) {\n  const welcome = config.loaders.welcome;\n  const page = config.loaders.page;\n  const markUrl = safeAssetUrl(config.brand.markUrl, DEFAULT_CONFIG.brand.markUrl);\n  const appIconUrl = safeAssetUrl(config.brand.appIconUrl, DEFAULT_CONFIG.brand.appIconUrl);\n  document.documentElement.style.setProperty('--evaraos-brand-icon', `url(\"${markUrl.replaceAll('\\\"', '%22')}\")`);\n  document.querySelectorAll('[data-evaraos-brand-icon]').forEach((node) => {\n    node.style.backgroundImage = `url(\"${markUrl.replaceAll('\\\"', '%22')}\")`;\n    node.style.backgroundSize = 'contain';\n    node.style.backgroundPosition = 'center';\n    node.style.backgroundRepeat = 'no-repeat';\n  });\n  document.querySelectorAll('link[rel=\"icon\"],link[rel=\"shortcut icon\"],link[rel=\"apple-touch-icon\"]').forEach((link) => { link.href = appIconUrl; });\n  window.EvaraLoader?.applyExperienceConfig?.(config);\n")
          replace(runtime,
              "  refreshExperienceConfig().catch((error) => console.warn('Published experience refresh skipped:', error));\n",
              "  const refresh = () => refreshExperienceConfig().catch((error) => console.warn('Published experience refresh skipped:', error));\n  if ('requestIdleCallback' in window) requestIdleCallback(refresh, { timeout: 1600 });\n  else setTimeout(refresh, 180);\n")

          builder = 'public/assets/js/studio/studio-experience-builder.js'
          replace(builder,
              "    setPath(draft, path, value);\n    draft = normalizeExperienceConfig(draft);\n    window.EvaraExperience?.applyConfig?.(draft);\n    render();\n",
              "    setPath(draft, path, value);\n    draft = normalizeExperienceConfig(draft);\n    const normalized = getPath(draft, path);\n    shell.querySelectorAll('[data-experience-field]').forEach((peer) => {\n      if (peer === control || peer.dataset.experienceField !== path) return;\n      if (peer.type === 'checkbox') peer.checked = Boolean(normalized);\n      else peer.value = control.dataset.transform === 'seconds' ? String(Math.round(Number(normalized || 45000) / 1000)) : String(normalized ?? '');\n    });\n    window.EvaraExperience?.applyConfig?.(draft);\n    const preview = shell.querySelector('.experience-builder-preview');\n    if (preview) preview.replaceWith(renderPreview());\n")

          nav = 'public/assets/js/nav.js'
          replace(nav,
              "window.addEventListener(\"evara:nav-ready\", onNavReady, { once: true });\n",
              "loadExperienceRuntime();\nwindow.addEventListener(\"evara:nav-ready\", onNavReady, { once: true });\n")

          loader = 'public/assets/js/loader.js'
          replace(loader, "  const LONG_RESUME_MS=45000;", "  let LONG_RESUME_MS=45000;")
          replace(loader, "  const WELCOME_MIN_MS=1200;", "  let WELCOME_MIN_MS=1200;")
          replace(loader, "  const BRAND_MARK_SRC='/assets/brand/evaraos-mark.png?v=brand-png-3';", "  let BRAND_MARK_SRC='/assets/brand/evaraos-mark.png?v=brand-png-3';")
          replace(loader, "  const APP_ICON_SRC='/assets/brand/evaraos-app-icon.png?v=brand-png-1';", "  let APP_ICON_SRC='/assets/brand/evaraos-app-icon.png?v=brand-png-1';")
          replace(loader,
              "  let launchMode=document.documentElement.dataset.evaraLaunchMode||\"\";\n",
              "  let launchMode=document.documentElement.dataset.evaraLaunchMode||\"\";\n  let welcomeEnabled=true,pageEnabled=true,resumeEnabled=true;\n  let welcomeEyebrow='EVARAOS',welcomeTitle='Welcome to Evaraos',welcomeSubtitle='Preparing your operating system.';\n  let pageLabel='Loading EvaraOS',resumeTitle='Welcome back to Evaraos',resumeSubtitle='Refreshing your workspace.';\n\n  function safeAsset(value,fallback){\n    const candidate=String(value||'').trim();\n    if(candidate.startsWith('/assets/'))return candidate;\n    try{const url=new URL(candidate,location.origin);return url.protocol==='https:'||url.origin===location.origin?url.href:fallback}catch{return fallback}\n  }\n\n  function cachedExperience(){\n    try{const stored=JSON.parse(localStorage.getItem('evaraos-experience-config-v1')||'null');return stored?.config||stored||null}catch{return null}\n  }\n\n  function applyExperienceConfig(config={}){\n    const brand=config.brand||{},theme=config.loaderTheme||{},loaders=config.loaders||{};\n    const welcome=loaders.welcome||{},page=loaders.page||{},resume=loaders.resume||{};\n    BRAND_MARK_SRC=safeAsset(brand.markUrl,BRAND_MARK_SRC);\n    APP_ICON_SRC=safeAsset(brand.appIconUrl,APP_ICON_SRC);\n    welcomeEnabled=welcome.enabled!==false;pageEnabled=page.enabled!==false;resumeEnabled=resume.enabled!==false;\n    welcomeEyebrow=welcome.eyebrow===undefined?welcomeEyebrow:String(welcome.eyebrow);\n    welcomeTitle=welcome.title===undefined?welcomeTitle:String(welcome.title);\n    welcomeSubtitle=welcome.subtitle===undefined?welcomeSubtitle:String(welcome.subtitle);\n    pageLabel=page.label===undefined?pageLabel:String(page.label);\n    resumeTitle=resume.title===undefined?resumeTitle:String(resume.title);\n    resumeSubtitle=resume.subtitle===undefined?resumeSubtitle:String(resume.subtitle);\n    WELCOME_MIN_MS=Math.min(5000,Math.max(400,Number(welcome.minimumMs)||WELCOME_MIN_MS));\n    LONG_RESUME_MS=Math.min(600000,Math.max(10000,Number(resume.minimumAwayMs)||LONG_RESUME_MS));\n    document.documentElement.style.setProperty('--evara-loader-background',/^#[0-9a-f]{6}$/i.test(theme.background||'')?theme.background:'#eef5fb');\n    document.documentElement.style.setProperty('--evara-loader-radius',`${Math.min(52,Math.max(16,Number(theme.radius)||34))}px`);\n    document.documentElement.style.setProperty('--evara-loader-mark-size',`${Math.min(96,Math.max(24,Number(theme.markSize)||42))}px`);\n    const welcomeNode=document.getElementById(WELCOME_ID);\n    const eyebrow=welcomeNode?.querySelector('.evara-welcome-eyebrow');\n    const title=welcomeNode?.querySelector('[data-evara-welcome-title]');\n    const subtitle=welcomeNode?.querySelector('[data-evara-welcome-subtitle]');\n    const progress=welcomeNode?.querySelector('.evara-welcome-progress');\n    if(eyebrow)eyebrow.textContent=welcomeEyebrow;if(title)title.textContent=welcomeTitle;if(subtitle)subtitle.textContent=welcomeSubtitle;\n    if(progress)progress.hidden=theme.showProgress===false;\n    document.querySelectorAll('#evaraFastLoader [role=\"status\"]').forEach(node=>node.setAttribute('aria-label',pageLabel));\n    applyBrand();\n    if(window.EvaraBrand){window.EvaraBrand.mark=BRAND_MARK_SRC;window.EvaraBrand.appIcon=APP_ICON_SRC}\n    if(!welcomeEnabled)deactivate(welcomeNode,true);\n    if(!pageEnabled)deactivate(document.getElementById(FAST_ID),true);\n  }\n")
          replace(loader, "  function showFastLoader(){\n    ensure();", "  function showFastLoader(){\n    if(!pageEnabled)return;\n    ensure();")
          replace(loader, "  function showWelcomeLoader(options={}){\n    ensure();", "  function showWelcomeLoader(options={}){\n    if(!welcomeEnabled)return;\n    ensure();")
          replace(loader, "    if(title)title.textContent=options.title||'Welcome to Evaraos';\n    if(subtitle)subtitle.textContent=options.subtitle||'Preparing your operating system.';", "    if(title)title.textContent=options.title??welcomeTitle;\n    if(subtitle)subtitle.textContent=options.subtitle??welcomeSubtitle;")
          replace(loader, "      '  <span class=\"evara-welcome-eyebrow\">EVARAOS</span>',\n      '  <strong data-evara-welcome-title>Welcome to Evaraos</strong>',\n      '  <span data-evara-welcome-subtitle>Preparing your operating system.</span>',", "      '  <span class=\"evara-welcome-eyebrow\">'+welcomeEyebrow+'</span>',\n      '  <strong data-evara-welcome-title>'+welcomeTitle+'</strong>',\n      '  <span data-evara-welcome-subtitle>'+welcomeSubtitle+'</span>',")
          replace(loader, "    if(!hiddenAt||Date.now()-hiddenAt<LONG_RESUME_MS||isTransitioning)return;", "    if(!resumeEnabled||!hiddenAt||Date.now()-hiddenAt<LONG_RESUME_MS||isTransitioning)return;")
          replace(loader, "    showWelcomeLoader({title:'Welcome back to Evaraos',subtitle:'Refreshing your workspace.'});", "    showWelcomeLoader({title:resumeTitle,subtitle:resumeSubtitle});")
          replace(loader, "  function init(){\n    ensureCriticalStyles();", "  function init(){\n    applyExperienceConfig(cachedExperience()||{});\n    ensureCriticalStyles();")
          replace(loader, "      health\n    };", "      health,\n      applyExperienceConfig\n    };")
          replace(loader, "    addEventListener('evara:session-ready',markSessionReady);", "    addEventListener('evara:session-ready',markSessionReady);\n    addEventListener('evara:experience-config',event=>applyExperienceConfig(event.detail?.config||{}));")

          PY

          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add functions/experience-config-service.js public/assets/js/loader.js public/assets/js/nav.js public/assets/js/experience/experience-runtime.js public/assets/js/studio/studio-experience-builder.js
            git commit -m 'Studio: harden Experience Builder runtime and authority'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Verify syntax and contracts
        run: |
          node --check functions/experience-config-service.js
          node --check public/assets/js/loader.js
          node --check public/assets/js/nav.js
          node --check public/assets/js/experience/experience-runtime.js
          node --check public/assets/js/experience/experience-config-client.js
          node --check public/assets/js/experience/owner-experience-publisher.js
          node --check public/assets/js/studio/studio-experience-builder.js
          node - <<'NODE'
          const fs=require('fs');
          const service=fs.readFileSync('functions/experience-config-service.js','utf8');
          const loader=fs.readFileSync('public/assets/js/loader.js','utf8');
          const builder=fs.readFileSync('public/assets/js/studio/studio-experience-builder.js','utf8');
          const runtime=fs.readFileSync('public/assets/js/experience/experience-runtime.js','utf8');
          const checks=[
            [service.includes('canPublishStudio(profile)'), 'trusted Studio publisher authority'],
            [service.includes("source: 'trusted_experience_config_service'"), 'audited server writes'],
            [loader.includes('applyExperienceConfig'), 'loader consumes published config'],
            [loader.includes('cachedExperience()'), 'loader uses cached config at boot'],
            [builder.includes("preview.replaceWith(renderPreview())"), 'typing does not rerender form controls'],
            [runtime.includes("--evaraos-brand-icon"), 'global brand mark propagation'],
            [runtime.includes("requestIdleCallback(refresh"), 'public refresh stays off critical path']
          ];
          const failed=checks.filter(([ok])=>!ok);
          checks.forEach(([ok,label])=>console.log(`${ok?'PASS':'FAIL'}: ${label}`));
          if(failed.length)process.exit(1);
          NODE
          node tools/design-system-audit.js
          node tools/visual-qa-audit.js
          node tools/studio-component-catalog-audit.js
          node tools/studio-action-icon-audit.js
          node tools/studio-app-check-audit.js
          node tools/studio-production-authority-audit.js
