name: Prepare Manual Trusted Studio Deployment Fix

on:
  pull_request:
    branches:
      - evaraos
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-manual-trusted-studio-deploy-fix.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ci/manual-only-trusted-studio-deploy
          fetch-depth: 0

      - name: Prepare production deployment workflow repair
        shell: python
        run: |
          import re
          from pathlib import Path

          source = Path('.github/workflows/deploy-trusted-studio-functions-once.yml')
          output_dir = Path('ci-output')
          output_dir.mkdir(exist_ok=True)
          text = source.read_text(encoding='utf-8')

          trigger_pattern = re.compile(
              r"(?m)^  push:\n"
              r"    branches: \[evaraos\]\n"
              r"    paths:\n"
              r"      - '\.github/workflows/deploy-trusted-studio-functions-once\.yml'\n"
          )
          conditional = "    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'deploy: run trusted Studio Functions production release'\n"

          text, trigger_count = trigger_pattern.subn('', text, count=1)
          if trigger_count != 1:
              raise SystemExit(f'Expected one automatic push trigger, found {trigger_count}.')
          if conditional not in text:
              raise SystemExit('Expected push-only job condition was not found.')

          text = text.replace(conditional, '', 1)
          repaired = output_dir / 'deploy-trusted-studio-functions-once.yml'
          repaired.write_text(text, encoding='utf-8')

          updated = repaired.read_text(encoding='utf-8')
          assert 'workflow_dispatch:' in updated
          assert '\n  push:\n' not in updated
          assert 'github.event.head_commit.message' not in updated
          assert 'DEPLOY TRUSTED STUDIO FUNCTIONS' in updated

      - name: Capture complete branch inventory
        shell: bash
        run: |
          set -euo pipefail
          git for-each-ref --format='%(refname:short)' refs/remotes/origin \
            | sed 's#^origin/##' \
            | grep -v '^HEAD$' \
            | sort -u \
            > ci-output/branch-inventory.txt
          cat ci-output/branch-inventory.txt

      - name: Upload reviewed repair and branch inventory
        uses: actions/upload-artifact@v4
        with:
          name: trusted-studio-manual-only-repair-${{ github.run_id }}
          path: ci-output
          if-no-files-found: error
          retention-days: 2
