name: Operations appearance migration

on:
  push:
    branches: [evaraos]
    paths: [.github/workflows/operations-appearance-migration.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evaraos
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/operations-page-migration.js
      - shell: bash
        run: |
          if git diff --quiet -- '*.html'; then exit 0; fi
          git config user.name "Evaraos Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Migrate operations pages to four-mode appearance"
          git push origin HEAD:evaraos
