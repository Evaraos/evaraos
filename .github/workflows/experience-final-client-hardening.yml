name: Apply final Experience client hardening

on:
  push:
    branches:
      - studio/owner-experience-builder

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/owner-experience-builder
          fetch-depth: 0

      - name: Apply exact reviewed client policy changes
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              value = file.read_text()
              if new in value:
                  print(f'SKIP already applied: {label}')
                  return
              if old not in value:
                  raise SystemExit(f'Missing source contract: {label}')
              file.write_text(value.replace(old, new, 1))
              print(f'APPLY: {label}')

          replace_once(
              'public/assets/js/studio/studio-experience-builder.js',
              "import { getSavedUserProfile, getSavedUserRole, normalizeRole } from '../firebase.js';\n\nconst OWNER_ROLES = new Set(['owner', 'super_admin', 'platform_admin', 'admin']);\n",
              "import { canPublishExperience } from '../experience/experience-authority.js';\n",
              'Studio client authority import'
          )
          replace_once(
              'public/assets/js/studio/studio-experience-builder.js',
              "function role() {\n  const profile = getSavedUserProfile?.() || {};\n  return normalizeRole?.(profile.role || getSavedUserRole?.() || '') || '';\n}\n\nfunction allowed() {\n  const current = role();\n  if (current === 'admin') return Boolean((getSavedUserProfile?.() || {}).platformAccess);\n  return OWNER_ROLES.has(current);\n}\n",
              "function allowed() {\n  return canPublishExperience();\n}\n",
              'Studio client authority check'
          )

          replace_once(
              'public/assets/js/experience/owner-experience-publisher.js',
              "import { getSavedUserProfile, getSavedUserRole, normalizeRole } from '../firebase.js';\n\nconst OWNER_ROLES = new Set(['owner', 'super_admin', 'platform_admin', 'admin']);\n",
              "import { canPublishExperience } from './experience-authority.js';\n",
              'Live Edit authority import'
          )
          replace_once(
              'public/assets/js/experience/owner-experience-publisher.js',
              "function currentRole() {\n  const profile = getSavedUserProfile?.() || {};\n  return normalizeRole?.(profile.role || getSavedUserRole?.() || '') || '';\n}\n\nfunction allowed() {\n  const role = currentRole();\n  if (role === 'admin') return Boolean((getSavedUserProfile?.() || {}).platformAccess);\n  return OWNER_ROLES.has(role);\n}\n",
              "function allowed() {\n  return canPublishExperience();\n}\n",
              'Live Edit authority check'
          )

          runtime_old = """function safeAssetUrl(value, fallback = '') {
            const candidate = text(value, 2200).trim();
            if (!candidate) return fallback;
            if (candidate.startsWith('/assets/')) return candidate;
            try {
              const url = new URL(candidate, location.origin);
              return url.protocol === 'https:' || url.origin === location.origin ? url.href : fallback;
            } catch {
              return fallback;
            }
          }
          """.replace('          ', '')
          runtime_new = """function safeAssetUrl(value, fallback = '') {
            const candidate = text(value, 2200).trim();
            if (!candidate) return fallback;
            if (candidate.startsWith('/assets/')) return candidate;
            try {
              const url = new URL(candidate, location.origin);
              const expectedPrefix = '/v0/b/evaraos-web.firebasestorage.app/o/';
              if (url.protocol !== 'https:' || url.hostname !== 'firebasestorage.googleapis.com') return fallback;
              if (!url.pathname.startsWith(expectedPrefix) || url.searchParams.get('alt') !== 'media') return fallback;
              return url.href;
            } catch {
              return fallback;
            }
          }
          """.replace('          ', '')
          replace_once('public/assets/js/experience/experience-runtime.js', runtime_old, runtime_new, 'runtime asset origin policy')

          replace_once(
              'public/assets/js/loader.js',
              "  function safeAssetUrl(value,fallback){\n    const candidate=String(value||'').trim().slice(0,2200);\n    if(candidate.startsWith('/assets/'))return candidate;\n    try{const url=new URL(candidate,location.origin);return url.protocol==='https:'||url.origin===location.origin?url.href:fallback}catch{return fallback}\n  }\n",
              "  function safeAssetUrl(value,fallback){\n    const candidate=String(value||'').trim().slice(0,2200);\n    if(candidate.startsWith('/assets/'))return candidate;\n    try{\n      const url=new URL(candidate,location.origin);\n      const expectedPrefix='/v0/b/evaraos-web.firebasestorage.app/o/';\n      if(url.protocol!=='https:'||url.hostname!=='firebasestorage.googleapis.com')return fallback;\n      if(!url.pathname.startsWith(expectedPrefix)||url.searchParams.get('alt')!=='media')return fallback;\n      return url.href;\n    }catch{return fallback}\n  }\n",
              'loader cache asset origin policy'
          )

          replace_once(
              'public/index.html',
              "      let config=null;\n      try{\n",
              "      let config=null;\n      const safeAsset=(value,fallback)=>{\n        const candidate=String(value||'').trim().slice(0,2200);\n        if(candidate.startsWith('/assets/'))return candidate;\n        try{\n          const url=new URL(candidate,location.origin);\n          const prefix='/v0/b/evaraos-web.firebasestorage.app/o/';\n          return url.protocol==='https:'&&url.hostname==='firebasestorage.googleapis.com'&&url.pathname.startsWith(prefix)&&url.searchParams.get('alt')==='media'?url.href:fallback;\n        }catch{return fallback}\n      };\n      try{\n",
              'first-paint safe asset helper'
          )
          replace_once(
              'public/index.html',
              "        document.documentElement.style.setProperty('--evara-loader-background',theme.background||'#eef5fb');\n        document.documentElement.style.setProperty('--evara-loader-radius',`${Number(theme.radius)||34}px`);\n        document.documentElement.style.setProperty('--evara-loader-mark-size',`${Number(theme.markSize)||42}px`);\n        const image=node.querySelector('.evara-loader-mark');\n        if(image&&config.brand?.markUrl)image.src=config.brand.markUrl;\n",
              "        const background=/^#[0-9a-f]{6}$/i.test(String(theme.background||''))?theme.background:'#eef5fb';\n        const radius=Math.min(52,Math.max(16,Number(theme.radius)||34));\n        const markSize=Math.min(96,Math.max(24,Number(theme.markSize)||42));\n        document.documentElement.style.setProperty('--evara-loader-background',background);\n        document.documentElement.style.setProperty('--evara-loader-radius',`${radius}px`);\n        document.documentElement.style.setProperty('--evara-loader-mark-size',`${markSize}px`);\n        const image=node.querySelector('.evara-loader-mark');\n        if(image)image.src=safeAsset(config.brand?.markUrl,image.getAttribute('src')||'/assets/brand/evaraos-mark.png');\n",
              'first-paint cache validation'
          )

          replace_once(
              'tools/owner-experience-builder-audit.js',
              "const runtime = read('public/assets/js/experience/experience-runtime.js');\n",
              "const runtime = read('public/assets/js/experience/experience-runtime.js');\nconst clientAuthority = read('public/assets/js/experience/experience-authority.js');\n",
              'audit client authority source'
          )
          replace_once(
              'tools/owner-experience-builder-audit.js',
              "check(runtime.includes('MutationObserver'), 'late-rendered application surfaces receive published configuration');\n\ncheck(client.includes(\"'getExperienceEditorState'\"), 'owner client loads draft and live versions');\n",
              "check(runtime.includes('MutationObserver'), 'late-rendered application surfaces receive published configuration');\ncheck(runtime.includes(\"url.hostname !== 'firebasestorage.googleapis.com'\"), 'runtime rejects unapproved cached asset origins');\ncheck(clientAuthority.includes('canPublishExperience'), 'owner surfaces share one client publisher authority');\ncheck(clientAuthority.includes(\"permissions.has('studio.publish')\"), 'client authority mirrors Studio publisher permissions');\n\ncheck(client.includes(\"'getExperienceEditorState'\"), 'owner client loads draft and live versions');\n",
              'audit cached asset and client authority policy'
          )
          replace_once(
              'tools/owner-experience-builder-audit.js',
              "check(loader.includes('experience.loaders.resume.minimumAwayMs'), 'resume timing is enforced by the loader authority');\n",
              "check(loader.includes('experience.loaders.resume.minimumAwayMs'), 'resume timing is enforced by the loader authority');\ncheck(loader.includes(\"url.hostname!=='firebasestorage.googleapis.com'\"), 'loader rejects unapproved cached asset origins');\n",
              'audit loader asset policy'
          )
          PY

      - name: Verify hardened source
        run: |
          set -euo pipefail
          node --check public/assets/js/loader.js
          node --experimental-default-type=module --check public/assets/js/experience/experience-authority.js
          node --experimental-default-type=module --check public/assets/js/experience/experience-runtime.js
          node --experimental-default-type=module --check public/assets/js/experience/owner-experience-publisher.js
          node --experimental-default-type=module --check public/assets/js/studio/studio-experience-builder.js
          node tools/owner-experience-builder-audit.js

      - name: Commit hardened product source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/js/experience/experience-authority.js public/assets/js/experience/experience-runtime.js public/assets/js/experience/owner-experience-publisher.js public/assets/js/studio/studio-experience-builder.js public/assets/js/loader.js public/index.html tools/owner-experience-builder-audit.js
          if ! git diff --cached --quiet; then
            git commit -m 'Security: align Experience client authority and cached asset policy'
            git push origin HEAD:studio/owner-experience-builder
          fi
