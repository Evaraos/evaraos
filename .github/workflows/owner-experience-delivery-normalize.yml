name: Normalize Owner Experience delivery

on:
  push:
    branches:
      - studio/owner-experience-builder
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/owner-experience-builder
          fetch-depth: 0

      - name: Normalize HTML and migration delivery versions
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          html_files = set(Path('.').glob('*.html'))
          html_files.update(Path('public').rglob('*.html'))
          html_files.update(Path('settings').rglob('*.html'))
          changed = []
          for file in sorted(html_files):
              before = file.read_text()
              after = re.sub(r'(/assets/js/nav\.js\?v=)[^"\'<>\s]+', r'\1nav-v59-experience-builder', before)
              after = re.sub(r'(/assets/js/loader\.js\?v=)[^"\'<>\s]+', r'\g<1>44', after)
              if after != before:
                  file.write_text(after)
                  changed.append(str(file))
          if len(changed) < 20:
              raise SystemExit(f'Expected broad HTML delivery normalization, changed only {len(changed)} files')
          print(f'Normalized {len(changed)} HTML entries')

          replacements = {
              'tools/ensure-universal-nav-v8.js': [
                  ('const NAV="nav-v28-stable-avatar";', 'const NAV="nav-v59-experience-builder";')
              ],
              'tools/operations-page-migration.js': [
                  ('src="/assets/js/nav.js?v=50"', 'src="/assets/js/nav.js?v=nav-v59-experience-builder"')
              ],
              'tools/activate-dashboard-leads-entry.js': [
                  ('/assets/js/nav.js?v=52', '/assets/js/nav.js?v=nav-v59-experience-builder')
              ],
              'public/assets/js/studio/studio-visual-builder.js': [
                  ("{ id: 'evara-brand-mark', name: 'EvaraOS Brand Mark', url: '/assets/brand/evaraos-app-icon.png' }", "{ id: 'evara-brand-mark', name: 'EvaraOS Brand Mark', url: '/assets/brand/evaraos-mark.png' }")
              ]
          }
          for path, pairs in replacements.items():
              file = Path(path)
              value = file.read_text()
              for old, new in pairs:
                  if old not in value and new not in value:
                      raise SystemExit(f'Missing delivery contract in {path}: {old}')
                  value = value.replace(old, new)
              file.write_text(value)
          PY

      - name: Verify normalized production source
        run: |
          set -euo pipefail
          node --experimental-default-type=module --check public/assets/js/studio/studio-visual-builder.js
          ! grep -R --include='*.html' -E '/assets/js/nav\.js\?v=(50|52|nav-v5[0-8])' public settings ./*.html
          ! grep -R --include='*.html' -E '/assets/js/loader\.js\?v=(4[0-3])' public settings ./*.html

      - name: Commit normalized production source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public settings ./*.html tools/ensure-universal-nav-v8.js tools/operations-page-migration.js tools/activate-dashboard-leads-entry.js public/assets/js/studio/studio-visual-builder.js
          if git diff --cached --quiet; then
            echo 'No delivery normalization changes were required.'
          else
            git commit -m 'Studio: normalize Experience Builder delivery versions'
            git push origin HEAD:studio/owner-experience-builder
          fi
