name: Universal UI Validation

on:
  pull_request:
    branches: [evaraos]
    paths:
      - 'public/**'
      - 'tools/**'
      - 'tests/visual/**'
      - '.github/workflows/universal-ui-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal-ui:
    name: Universal UI Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared theme and interface ownership
        run: |
          node tools/theme-deep-audit.js
          node tools/interface-audit.js
          node tools/design-system-audit.js
      - name: Verify state transitions and negative asset contracts
        run: |
          node --experimental-vm-modules --test tools/ui-contract-regression.test.cjs tools/theme-state-regression.test.cjs tools/nav-render-regression.test.cjs tools/firebase-emulator-isolation.test.mjs
      - name: Preserve navigation, authorization and visual QA contracts
        run: |
          node tools/nav-refresh-audit.mjs
          node tools/home-shell-authority-audit.mjs
          node tools/access-authority-audit.mjs
          node tools/account-lifecycle-audit.mjs
          node tools/visual-qa-audit.js

  local-emulator-role-matrix:
    name: Local Firebase Emulator Role Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install visual QA dependencies
        run: npm install --no-audit --no-fund --prefix tests/visual
      - name: Install Firebase CLI and browser runtimes
        run: |
          npm install --global firebase-tools@15.33.0
          tests/visual/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Run nine-role matrix against demo Firebase emulators
        env:
          EVARA_QA_FIREBASE_CLI: firebase
          EVARA_QA_FAILURE_SUMMARY: ${{ runner.temp }}/universal-ui-role-matrix-summary.md
        run: |
          printf '# Local Firebase role matrix\n\nResult: no detailed summary was produced.\n' > "$EVARA_QA_FAILURE_SUMMARY"
          node tests/visual/run-local-emulator-matrix.mjs
      - name: Upload local role matrix summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-ui-role-matrix-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/universal-ui-role-matrix-summary.md
          if-no-files-found: error
          retention-days: 3
