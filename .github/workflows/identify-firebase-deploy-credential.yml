name: Identify Firebase Deploy Credential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identify:
    name: Report client email only
    runs-on: ubuntu-latest

    steps:
      - name: Parse and report client_email only
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EVARAOS_WEB }}
        run: |
          set -euo pipefail

          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_EVARAOS_WEB is not configured"
            exit 1
          fi

          client_email="$(
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" |
              jq -er '.client_email | select(type == "string" and length > 0)'
          )"

          printf 'client_email=%s\n' "$client_email"
