name: Patch message image storage

on:
  push:
    branches: [evaraos]
    paths:
      - "tools/patch-message-image-storage.js"
      - ".github/workflows/patch-message-image-storage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evaraos
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/patch-message-image-storage.js
      - name: Commit patched messaging runtime
        run: |
          if git diff --quiet -- public/assets/js/messages-v2.js; then exit 0; fi
          git config user.name "Evaraos Storage Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/assets/js/messages-v2.js
          git commit -m "Use authorized company storage for message images"
          git push origin HEAD:evaraos
