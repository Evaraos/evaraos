name: Studio Component Audit Diagnostic

on:
  pull_request:
    paths:
      - 'public/assets/js/studio/**'
      - 'public/assets/js/design-system/**'
      - 'public/assets/css/pages/studio-*.css'
      - 'public/website-builder.html'
      - 'tools/studio-component-catalog-audit.js'
      - '.github/workflows/studio-component-audit-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Studio component catalog audit
        shell: bash
        run: |
          set -o pipefail
          node tools/studio-component-catalog-audit.js 2>&1 | tee studio-component-catalog-audit.log

      - name: Upload Studio audit diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-component-catalog-audit-${{ github.run_id }}
          path: studio-component-catalog-audit.log
          if-no-files-found: error
          retention-days: 2
