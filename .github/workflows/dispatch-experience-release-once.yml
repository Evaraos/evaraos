name: Dispatch Experience Production Release Once

on:
  push:
    branches:
      - evaraos
    paths:
      - .github/workflows/dispatch-experience-release-once.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-experience-production-release-once
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch canonical Experience release
    if: "${{ github.event.head_commit.message == 'ops: dispatch Experience production release once' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify validated Experience candidate
        uses: actions/github-script@v7
        env:
          RELEASE_REF: 5e9973d380133890c434a4f39fbf4631190cd373
        with:
          script: |
            const releaseRef = process.env.RELEASE_REF;
            const comparison = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: releaseRef,
              head: 'evaraos'
            });
            if (!['ahead', 'identical'].includes(comparison.data.status)) {
              core.setFailed(`Validated release ${releaseRef} is not an ancestor of evaraos.`);
              return;
            }

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'experience-production-preflight.yml',
              head_sha: releaseRef,
              per_page: 10
            });
            const passed = runs.data.workflow_runs.some((run) =>
              run.status === 'completed' && run.conclusion === 'success'
            );
            if (!passed) {
              core.setFailed(`No successful Experience Production Preflight exists for ${releaseRef}.`);
            }

      - name: Dispatch canonical Firebase production workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'firebase-production-release.yml',
              ref: 'evaraos',
              inputs: {
                release_scope: 'experience',
                release_ref: '5e9973d380133890c434a4f39fbf4631190cd373',
                confirmation: 'DEPLOY EVARAOS PRODUCTION'
              },
              headers: {
                'X-GitHub-Api-Version': '2022-11-28'
              }
            });
            core.notice('Canonical Experience production release dispatched.');
