name: Publish settings pages (frozen)

# Stage 1 containment: the legacy copier can overwrite hand-maintained Settings
# pages and the Workspace compatibility redirect. Keep the script/content intact
# until ownership migration. GitHub requires an event and a job, so exclude every
# push ref and keep only an always-skipped, inert placeholder. No manual entrypoint.
"on":
  push:
    branches-ignore: ['**']
    tags-ignore: ['**']

permissions: {}

jobs:
  frozen:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: ':'
