name: Publish settings pages

on:
  push:
    branches: [evaraos]
    paths: [.github/workflows/publish-settings-pages.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evaraos
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/publish-settings-pages.js
      - shell: bash
        run: |
          if git diff --quiet -- public/settings; then exit 0; fi
          git config user.name "Evaraos Migration"
          git config user.email "actions@users.noreply.github.com"
          git add public/settings
          git commit -m "Publish settings pages to Firebase public root"
          git push origin HEAD:evaraos
