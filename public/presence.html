<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Workforce Presence • Evaraos Inc</title>
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <link rel="stylesheet" href="/assets/css/nav.css" />
  <link rel="stylesheet" href="/assets/css/app-system.css" />
  <style>
    body{margin:0;background:#f4f7f6}.wrap{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:128px 0 70px}.panel{border-radius:32px;padding:24px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);margin-bottom:18px}h1{font-size:clamp(2rem,5vw,5rem);line-height:.9;letter-spacing:-.08em;margin:0}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.stat{border-radius:24px;padding:18px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07)}.stat strong{display:block;font-size:30px}.list{display:grid;gap:12px}.item{border-radius:22px;padding:16px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07)}.muted{color:rgba(255,255,255,.68);line-height:1.6}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{border-radius:999px;padding:7px 10px;border:1px solid rgba(255,255,255,.18);font-size:12px;font-weight:900;color:rgba(255,255,255,.74)}.online{color:#70ffbd}.idle{color:#ffd27a}.offline{color:#ff9b8f}@media(max-width:900px){.wrap{padding-top:112px}.stats{grid-template-columns:1fr}}
  </style>
</head>
<body class="auth-pending app-loading" data-route-guard="private">
  <div id="universalNavRoot"></div><div id="appRoot"><main class="wrap"><section class="panel glass-card aurora-card"><p class="muted">WORKFORCE PRESENCE</p><h1>See who is active right now.</h1><p class="muted">Track online staff, recent activity, and workforce availability for dispatch and operations.</p></section><section class="stats"><div class="stat"><strong id="presenceOnline">0</strong><span class="muted">Online</span></div><div class="stat"><strong id="presenceIdle">0</strong><span class="muted">Recently active</span></div><div class="stat"><strong id="presenceTotal">0</strong><span class="muted">Tracked staff</span></div></section><section class="panel glass-card aurora-card" style="margin-top:18px"><h2>Team Presence</h2><div id="presenceList" class="list"><div class="item muted">Loading presence...</div></div></section></main></div>
  <script src="/assets/js/loader.js"></script>
  <script type="module" src="/assets/js/firebase.js"></script>
  <script type="module" src="/assets/js/route-guard.js"></script>
  <script type="module" src="/assets/js/nav.js"></script>
  <script type="module" src="/assets/js/presence.js"></script>
</body>
</html>
