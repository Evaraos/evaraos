<!DOCTYPE html>
<html lang="en" data-theme="adaptive" data-theme-mode="image">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Transaction Ledger • Evaraos Inc</title>
  <script src="/assets/js/adaptive-appearance-boot.js?v=1"></script>
  <link rel="stylesheet" href="/assets/css/base.css?v=53" />
  <link rel="stylesheet" href="/assets/css/theme.css?v=adaptive-liquid-v1" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=nav-v5" />
  <link rel="stylesheet" href="/assets/css/dashboard.css?v=50" />
  <link rel="stylesheet" href="/assets/css/app-system.css?v=50" />
  <style>
    body.ledger-page{margin:0;min-height:100vh;background:transparent}.ledger-wrap{width:min(1320px,calc(100% - 28px));margin:0 auto;padding:128px 0 78px;position:relative;z-index:2}.ledger-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-bottom:18px}.ledger-card{border-radius:34px!important;padding:clamp(18px,3vw,32px)!important}.ledger-kicker{margin:0 0 10px;color:var(--accent-red);font-size:12px;font-weight:950;letter-spacing:.2em;text-transform:uppercase}.ledger-title{margin:0;font-size:clamp(2.25rem,5.8vw,5.15rem);line-height:.9;letter-spacing:-.075em}.ledger-copy,.muted{color:var(--text-secondary);line-height:1.65}.ledger-stats{display:grid;gap:10px}.ledger-stat{border-radius:22px;padding:16px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom))}.ledger-stat strong{display:block;font-size:30px;letter-spacing:-.055em}.ledger-toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.ledger-toolbar input,.ledger-toolbar select{min-height:46px;border-radius:999px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));color:var(--text-primary);padding:0 16px;outline:none;font:inherit;font-weight:800}.ledger-toolbar select option{color:#111}.ledger-list{display:grid;gap:12px}.ledger-item{border-radius:24px;padding:16px;border:1px solid var(--liquid-border);background:rgba(255,255,255,.075)}.ledger-item h3{margin:0;font-size:20px;letter-spacing:-.04em}.ledger-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ledger-pill{border-radius:999px;padding:7px 10px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));font-size:12px;font-weight:950;color:var(--text-secondary)}.ledger-pill.ok{color:#70ffbd;border-color:rgba(112,255,189,.26);background:rgba(112,255,189,.1)}.ledger-pill.warn{color:#ffd27a;border-color:rgba(255,210,122,.28);background:rgba(255,210,122,.1)}.ledger-pill.bad{color:#ff9b8f;border-color:rgba(255,155,143,.26);background:rgba(255,155,143,.1)}@media(max-width:980px){.ledger-hero{grid-template-columns:1fr}.ledger-wrap{width:min(100% - 20px,1320px);padding-top:112px}.ledger-toolbar input,.ledger-toolbar select,.ledger-toolbar button{width:100%}}
  </style>
</head>
<body class="ledger-page auth-pending app-loading" data-route-guard="private">
  <div id="universalNavRoot"></div>
  <div id="appRoot"><main class="ledger-wrap">
    <section class="ledger-hero">
      <article class="glass-card aurora-card active-glow beam-target ledger-card">
        <p class="ledger-kicker">TRANSACTION LEDGER</p>
        <h1 class="ledger-title">Audit every financial movement.</h1>
        <p class="ledger-copy">Track transactions, invoice activity, payout readiness, and operational financial events across companies.</p>
      </article>
      <aside class="glass-card aurora-card active-glow beam-target ledger-card ledger-stats">
        <div class="ledger-stat"><strong id="ledgerTotal">$0.00</strong><span class="muted">Total volume</span></div>
        <div class="ledger-stat"><strong id="ledgerCount">0</strong><span class="muted">Ledger records</span></div>
        <div class="ledger-stat"><strong id="ledgerPending">0</strong><span class="muted">Pending items</span></div>
      </aside>
    </section>
    <section class="glass-card aurora-card active-glow beam-target ledger-card ledger-toolbar">
      <input id="ledgerSearch" type="search" placeholder="Search customer, service, company, status..." />
      <select id="ledgerTypeFilter"><option value="all">All types</option><option value="transaction">Transactions</option><option value="invoice">Invoices</option><option value="payout">Payouts</option></select>
      <button id="ledgerRefresh" class="btn btn-theme-secondary beam-target" type="button">Refresh</button>
    </section>
    <section class="glass-card aurora-card active-glow beam-target ledger-card">
      <div id="ledgerList" class="ledger-list"><div class="ledger-item muted">Loading ledger...</div></div>
    </section>
  </main></div>
  <script src="/assets/js/loader.js"></script>
  <script type="module" src="/assets/js/firebase.js"></script>
  <script type="module" src="/assets/js/theme.js?v=adaptive-liquid-v1"></script>
  <script type="module" src="/assets/js/route-guard.js"></script>
  <script type="module" src="/assets/js/nav.js?v=51"></script>
  <script type="module" src="/assets/js/ledger.js"></script>
</body>
</html>
