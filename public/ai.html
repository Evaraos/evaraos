<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fa" />
  <title>Evaraos AI | Evaraos Inc</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <link rel="stylesheet" href="./assets/css/pages/ai.css" />
</head>
<body class="app-loading ai-page">
  <div id="universalNavRoot"></div>

  <main id="appRoot" class="eva-ai-page-shell">
    <section class="eva-ai-hero">
      <div class="eva-ai-mark">AI</div>
      <p class="eva-ai-kicker">EVARAOS AI</p>
      <h1>How can I help you run the system?</h1>
      <p class="eva-ai-subtitle">Ask about customers, leads, jobs, settings, services, staff workflows, or what page you need next.</p>
    </section>

    <section class="eva-ai-thread" id="evaAiThread" aria-live="polite">
      <article class="eva-ai-message-card assistant">
        <div class="eva-ai-avatar">AI</div>
        <div class="eva-ai-bubble">
          <p>I’m Evaraos AI. I can help navigate the app, summarize operations, and guide you through building the platform.</p>
        </div>
      </article>
    </section>

    <section class="eva-ai-suggestions" aria-label="Suggested prompts">
      <button type="button" data-ai-prompt="Open my customer portal">Open my customer portal</button>
      <button type="button" data-ai-prompt="Show me jobs and leads">Show jobs and leads</button>
      <button type="button" data-ai-prompt="Help me configure settings">Configure settings</button>
      <button type="button" data-ai-prompt="What should we build next?">What should we build next?</button>
    </section>

    <form class="eva-ai-composer" id="evaAiPageForm" autocomplete="off">
      <button class="eva-ai-plus" type="button" aria-label="More tools">✦</button>
      <textarea id="evaAiPageInput" rows="1" placeholder="Message Evaraos AI..." enterkeyhint="send"></textarea>
      <button class="eva-ai-submit" type="submit" aria-label="Send message">↑</button>
    </form>
  </main>

  <script type="module" src="./assets/js/theme.js"></script>
  <script type="module" src="./assets/js/nav/nav-main.js"></script>
  <script type="module" src="./assets/js/pages/ai.js"></script>
</body>
</html>
