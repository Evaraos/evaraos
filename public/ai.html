<body class="ai-page app-loading">
  <div id="universalNavRoot"></div>
  <main id="appRoot" class="eva-ai-app-root">
    <section class="eva-ai-page-shell" aria-label="Evaraos AI assistant">
      <header class="eva-ai-chat-header" aria-label="Evaraos AI header">
        <div class="eva-ai-title-block"><span class="eva-ai-icon-wrap"><img src="/assets/img/evaraos_logo.png" alt="Evaraos" class="eva-ai-app-icon" /><span class="eva-ai-intel-star">✦</span><span class="eva-ai-intel-star two">✧</span></span><div><p>Evaraos AI</p><h1>Assistant</h1></div></div>

      </header>
      <section class="eva-ai-thread" id="evaAiThread" aria-live="polite"><article class="eva-ai-message-card assistant"><div class="eva-ai-avatar">AI</div><div class="eva-ai-bubble"><p>I am Evaraos AI. Ask me to help build, fix, open, or organize anything inside the system.</p></div></article></section>
