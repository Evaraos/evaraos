<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
  />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/icon-192.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />

  <meta name="theme-color" content="#f4f7f6" />
  <meta name="msapplication-TileColor" content="#f4f7f6" />
  <meta name="msapplication-TileImage" content="/assets/img/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Evaraos" />
  <meta name="application-name" content="Evaraos" />

  <link rel="preload" as="image" href="/assets/img/evaraos_logo.png" />
  <title>Evaraos AI | Evaraos Inc</title>

  <script src="/assets/js/theme-boot.js?v=1"></script>

  <style>
    html,
    body { background: #f4f7f6; }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #020307; }
    html.boot-pending body { margin: 0; overflow: hidden; touch-action: none; }
    body.ai-page { margin: 0; min-height: 100vh; background: transparent; }
    body.app-loading #appRoot { visibility: hidden; }
    body.app-ready #appRoot { visibility: visible; }
  </style>

  <link rel="stylesheet" href="/assets/css/base.css?v=34" />
  <link rel="stylesheet" href="/assets/css/theme.css?v=36" />
  <link rel="stylesheet" href="/assets/css/loader.css?v=1" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=nav-v1" />
  <link rel="stylesheet" href="/assets/css/pages/ai.css?v=6" />
</head>
<body class="ai-page app-loading">
  <div id="universalNavRoot"></div>

  <main id="appRoot" class="eva-ai-page-shell">
    <header class="eva-ai-chat-header" aria-label="Evaraos AI header">
      <div class="eva-ai-title-block">
        <span class="eva-ai-dot">&#10022;</span>
        <div>
          <p>Evaraos AI</p>
          <h1>Assistant</h1>
        </div>
      </div>
      <button class="eva-ai-new-chat" type="button" id="evaAiNewChat">New</button>
    </header>

    <section class="eva-ai-thread" id="evaAiThread" aria-live="polite">
      <article class="eva-ai-message-card assistant">
        <div class="eva-ai-avatar">AI</div>
        <div class="eva-ai-bubble">
          <p>I am Evaraos AI. Ask me to help build, fix, open, or organize anything inside the system.</p>
        </div>
      </article>
    </section>

    <section class="eva-ai-quick-row" aria-label="Suggested prompts">
      <button type="button" data-ai-prompt="What should we build next?">Build next</button>
      <button type="button" data-ai-prompt="Help me fix the UI">Fix UI</button>
      <button type="button" data-ai-prompt="Open the customer portal">Customer portal</button>
      <button type="button" data-ai-prompt="Plan the dashboard hierarchy">Dashboards</button>
    </section>

    <form class="eva-ai-composer" id="evaAiPageForm" autocomplete="off">
      <button class="eva-ai-plus" type="button" aria-label="More tools">+</button>
      <textarea id="evaAiPageInput" rows="1" placeholder="Message Evaraos AI..." enterkeyhint="send"></textarea>
      <button class="eva-ai-submit" type="submit" aria-label="Send message">&#8593;</button>
    </form>
  </main>

  <script src="/assets/js/loader.js?v=1"></script>
  <script type="module" src="/assets/js/theme.js?v=1"></script>
  <script type="module" src="/assets/js/nav/nav-main.js?v=nav-v1"></script>
  <script type="module" src="/assets/js/pages/ai.js?v=2"></script>
</body>
</html>
