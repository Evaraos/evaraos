<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dispatch Map • Evaraos Inc</title>
  <script src="/assets/js/theme-boot.js?v=50"></script>
  <link rel="stylesheet" href="/assets/css/base.css?v=50" />
  <link rel="stylesheet" href="/assets/css/theme.css?v=50" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=nav-v5" />
  <link rel="stylesheet" href="/assets/css/app-system.css?v=50" />
  <style>
    body{margin:0;background:transparent}.wrap{width:min(1320px,calc(100% - 28px));margin:0 auto;padding:128px 0 70px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{border-radius:32px;padding:24px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));margin-bottom:18px}h1{font-size:clamp(2rem,5vw,5rem);line-height:.9;letter-spacing:-.08em;margin:0}.muted{color:var(--text-secondary);line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.stat{border-radius:24px;padding:18px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom))}.stat strong{display:block;font-size:30px}.map{height:640px;border-radius:32px;overflow:hidden;border:1px solid var(--liquid-border);background:#101418}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{border-radius:999px;padding:7px 10px;border:1px solid var(--liquid-border);font-size:12px;font-weight:900;color:var(--text-secondary)}@media(max-width:980px){.hero,.stats{grid-template-columns:1fr}.wrap{padding-top:112px}.map{height:520px}}
  </style>
</head>
<body class="auth-pending app-loading" data-route-guard="private">
  <div id="universalNavRoot"></div>
  <div id="appRoot"><main class="wrap"><section class="hero"><article class="panel glass-card aurora-card"><p class="muted">DISPATCH MAP</p><h1>Live field operations map.</h1><p class="muted">View active workforce locations and job markers for field dispatch visibility.</p><div class="row"><button id="startLocation" class="btn btn-theme-primary beam-target" type="button">Start Location</button><button id="stopLocation" class="btn btn-theme-secondary beam-target" type="button">Stop Location</button></div></article><article class="panel glass-card aurora-card"><h2 id="mapStatus">Map loading...</h2><p class="muted">Location tracking only runs while this page is open and permission is granted.</p></article></section><section class="stats"><div class="stat"><strong id="mapJobs">0</strong><span class="muted">Job markers</span></div><div class="stat"><strong id="mapStaff">0</strong><span class="muted">Staff markers</span></div><div class="stat"><strong id="mapOnline">0</strong><span class="muted">Online staff</span></div></section><section class="panel glass-card aurora-card"><div id="dispatchMap" class="map"></div></section></main></div>
  <script src="/assets/js/loader.js"></script>
  <script src="/assets/js/maps-config.js"></script>
  <script type="module" src="/assets/js/firebase.js"></script>
  <script type="module" src="/assets/js/theme.js?v=50"></script>
  <script type="module" src="/assets/js/route-guard.js"></script>
  <script type="module" src="/assets/js/nav.js?v=51"></script>
  <script type="module" src="/assets/js/dispatch-map.js"></script>
</body>
</html>
