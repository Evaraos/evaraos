<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
  <meta name="theme-color" content="#f4f7f6" />
  <title>Customer Portal • Evaraos Inc</title>
  <script src="/assets/js/theme-boot.js?v=50"></script>
  <style>
    html.boot-pending body{margin:0;overflow-x:hidden}html.auth-pending body,body.auth-pending{opacity:0;pointer-events:none}body.customer-portal-page{margin:0;min-height:100vh;background:transparent}body.app-loading #appRoot{visibility:hidden}body.app-ready #appRoot{visibility:visible}.customer-wrap{width:min(1260px,calc(100% - 28px));margin:0 auto;padding:128px 0 78px;position:relative;z-index:2}.customer-hero{display:grid;grid-template-columns:1.12fr .88fr;gap:18px;margin-bottom:18px}.customer-hero .glass-card,.customer-panel{border-radius:34px!important;padding:clamp(18px,3vw,32px)!important}.customer-kicker{margin:0 0 10px;color:var(--accent-red);font-size:12px;font-weight:950;letter-spacing:.2em;text-transform:uppercase}.customer-title{margin:0;font-size:clamp(2.25rem,5.8vw,5.15rem);line-height:.9;letter-spacing:-.075em}.customer-copy,.muted{color:var(--text-secondary);line-height:1.65}.customer-copy{max-width:760px;margin:16px 0 0}.customer-stats{display:grid;gap:10px}.customer-stat{border-radius:22px;padding:16px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}.customer-stat strong{display:block;font-size:30px;letter-spacing:-.055em}.customer-stat span{color:var(--text-secondary);font-weight:850}.portal-grid{display:grid;grid-template-columns:.86fr 1.14fr;gap:18px}.request-form{display:grid;gap:14px}.field label{display:block;margin-bottom:8px;color:var(--text-secondary);font-size:11px;font-weight:950;letter-spacing:.075em;text-transform:uppercase}.field input,.field select,.field textarea{width:100%;min-height:52px;border-radius:18px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.10);color:var(--text-primary);padding:14px 15px;outline:none;font:inherit;font-weight:800;box-sizing:border-box}.field select option{color:#111}.field textarea{min-height:128px;resize:vertical}.job-list{display:grid;gap:12px}.customer-job{border-radius:24px;padding:16px;border:1px solid var(--liquid-border);background:rgba(255,255,255,.075);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}.customer-job h3{margin:0;font-size:20px;letter-spacing:-.04em}.customer-job p{margin:8px 0 0;color:var(--text-secondary);line-height:1.5;font-weight:760}.job-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.job-pill{border-radius:999px;padding:7px 10px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));font-size:12px;font-weight:950;color:var(--text-secondary)}.job-pill.hot{color:#ffd27a;border-color:rgba(255,210,122,.28);background:rgba(255,210,122,.10)}.job-pill.go{color:#70ffbd;border-color:rgba(112,255,189,.26);background:rgba(112,255,189,.10)}.job-pill.done{color:#70a7ff;border-color:rgba(112,167,255,.26);background:rgba(112,167,255,.10)}.empty-card{border-radius:22px;padding:20px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));font-weight:850;color:var(--text-secondary);line-height:1.6}@media(max-width:980px){.customer-hero,.portal-grid{grid-template-columns:1fr}.customer-wrap{width:min(100% - 20px,1260px);padding-top:112px}}
  </style>
  <link rel="stylesheet" href="/assets/css/base.css?v=50" />
  <link rel="stylesheet" href="/assets/css/theme.css?v=50" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=nav-v5" />
  <link rel="stylesheet" href="/assets/css/dashboard.css?v=50" />
  <link rel="stylesheet" href="/assets/css/app-system.css?v=50" />
</head>
<body class="customer-portal-page auth-pending app-loading" data-route-guard="private">
  <div id="universalNavRoot"></div><div id="evaPageTransition" class="eva-page-transition" aria-hidden="true"></div>
  <div id="appRoot"><div class="page-grid-overlay"></div><main class="customer-wrap">
    <section class="customer-hero"><article class="glass-card aurora-card active-glow beam-target"><p class="customer-kicker">CUSTOMER PORTAL</p><h1 class="customer-title">Book service and track your work.</h1><p class="customer-copy">Customers can request service, watch status updates, and see job history while operations routes the work through Evaraos.</p></article><aside class="glass-card aurora-card active-glow beam-target customer-stats"><div class="customer-stat"><strong id="customerTotal">—</strong><span>Total requests</span></div><div class="customer-stat"><strong id="customerOpen">—</strong><span>Open requests</span></div><div class="customer-stat"><strong id="customerDone">—</strong><span>Completed</span></div></aside></section>
    <section class="portal-grid"><article class="glass-card aurora-card active-glow beam-target customer-panel"><h2>Request Service</h2><form id="customerRequestForm" class="request-form"><div class="field"><label for="customerService">Service</label><select id="customerService" required><option value="">Select service</option><option value="trash_bin_cleaning">Trash Bin Cleaning</option><option value="pressure_washing">Pressure Washing</option><option value="house_washing">House Washing</option><option value="interior_cleaning">Interior Cleaning</option><option value="custom_service">Custom Service</option></select></div><div class="field"><label for="customerAddress">Service Address</label><input id="customerAddress" type="text" required placeholder="Street, city, state" /></div><div class="field"><label for="customerNotes">Notes</label><textarea id="customerNotes" placeholder="Tell us what you need cleaned, preferred dates, gate codes, bin count, square footage..."></textarea></div><button class="btn btn-theme-primary beam-target" type="submit">Submit Request</button></form></article><article class="glass-card aurora-card active-glow beam-target customer-panel"><h2>My Requests</h2><div id="customerJobs" class="job-list"><div class="empty-card">Loading your requests...</div></div></article></section>
  </main></div>
  <script src="/assets/js/loader.js"></script>
  <script type="module" src="/assets/js/firebase.js"></script>
  <script type="module" src="/assets/js/theme.js?v=50"></script>
  <script type="module" src="/assets/js/route-guard.js"></script>
  <script type="module" src="/assets/js/nav.js?v=51"></script>
  <script type="module" src="/assets/js/customer-portal.js"></script>
</body>
</html>
