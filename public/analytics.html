<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Analytics • Evaraos Inc</title>
  <script src="/assets/js/theme-boot.js?v=50"></script>
  <link rel="stylesheet" href="/assets/css/base.css?v=50" />
  <link rel="stylesheet" href="/assets/css/theme.css?v=50" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=nav-v4" />
  <link rel="stylesheet" href="/assets/css/app-system.css?v=50" />
  <style>
    body{margin:0;background:transparent}.wrap{width:min(1280px,calc(100% - 28px));margin:0 auto;padding:128px 0 70px}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-bottom:18px}.panel{border-radius:32px;padding:24px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));margin-bottom:18px}h1{font-size:clamp(2rem,5vw,5rem);line-height:.9;letter-spacing:-.08em;margin:0}.muted{color:var(--text-secondary);line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{border-radius:24px;padding:18px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom))}.stat strong{display:block;font-size:30px;letter-spacing:-.05em}.list{display:grid;gap:12px}.item{border-radius:22px;padding:16px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom))}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{border-radius:999px;padding:7px 10px;border:1px solid var(--liquid-border);font-size:12px;font-weight:900;color:var(--text-secondary)}@media(max-width:1000px){.hero,.stats{grid-template-columns:1fr}.wrap{padding-top:112px}}
  </style>
</head>
<body class="auth-pending app-loading" data-route-guard="private">
  <div id="universalNavRoot"></div>
  <div id="appRoot"><main class="wrap"><section class="hero"><article class="panel glass-card aurora-card"><p class="muted">EXECUTIVE ANALYTICS</p><h1>Measure the whole operating system.</h1><p class="muted">Track jobs, revenue, invoices, payments, payouts, and payroll readiness from one command view.</p></article><article class="panel glass-card aurora-card"><h2 id="analyticsRevenue">$0.00</h2><p class="muted">Total tracked revenue</p></article></section><section class="stats"><div class="stat"><strong id="analyticsJobs">0</strong><span class="muted">Jobs</span></div><div class="stat"><strong id="analyticsInvoices">0</strong><span class="muted">Invoices</span></div><div class="stat"><strong id="analyticsPaid">0</strong><span class="muted">Paid invoices</span></div><div class="stat"><strong id="analyticsPayouts">0</strong><span class="muted">Payout queue</span></div></section><section class="panel glass-card aurora-card" style="margin-top:18px"><h2>Executive Snapshot</h2><div id="analyticsList" class="list"><div class="item muted">Loading analytics...</div></div></section></main></div>
  <script src="/assets/js/loader.js"></script>
  <script type="module" src="/assets/js/firebase.js"></script>
  <script type="module" src="/assets/js/theme.js?v=50"></script>
  <script type="module" src="/assets/js/route-guard.js"></script>
  <script type="module" src="/assets/js/nav.js?v=50"></script>
  <script type="module" src="/assets/js/analytics.js"></script>
</body>
</html>
