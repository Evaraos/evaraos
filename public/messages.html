<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
  <meta name="theme-color" content="#f4f7f6" />
  <title>Messages • Evaraos Inc</title>
  <script src="/assets/js/theme-boot.js?v=53"></script>
  <style>html.boot-pending body{margin:0;overflow:hidden}html.auth-pending body,body.auth-pending{opacity:0;pointer-events:none}body.messages-page{margin:0;min-height:100vh;background:transparent}body.app-loading #appRoot{visibility:hidden}body.app-ready #appRoot{visibility:visible}</style>
  <link rel="stylesheet" href="/assets/css/base.css?v=53" />
  <link rel="stylesheet" href="/assets/css/theme.css?v=53" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=nav-v16" />
  <link rel="stylesheet" href="/assets/css/pages/messages-imessage.css?v=1" />
</head>
<body class="messages-page auth-pending app-loading" data-route-guard="private">
  <div id="universalNavRoot"></div>
  <div id="evaPageTransition" class="eva-page-transition" aria-hidden="true"></div>
  <div id="appRoot">
    <main class="messages-app">
      <aside class="messages-sidebar glass-card">
        <div class="messages-sidebar-head"><h1>Messages</h1><button id="newGroupBtn" class="messages-compose btn btn-theme-secondary" type="button" aria-label="New group chat">＋</button></div>
        <label class="messages-search"><span>⌕</span><input id="conversationSearch" type="search" placeholder="Search conversations" /></label>
        <div id="conversationList" class="conversation-list"><div class="messages-empty">Loading conversations…</div></div>
      </aside>
      <section class="messages-chat glass-card">
        <header class="messages-chat-head">
          <button id="showConversationList" class="messages-icon-button btn btn-theme-secondary" type="button" aria-label="Show conversations">‹</button>
          <div id="chatAvatar" class="conversation-avatar"><span>E</span></div>
          <div><h2 id="chatTitle">Messages</h2><p id="chatSubtitle">Select a conversation</p></div>
          <div class="messages-head-actions"><button id="editGroupBtn" class="messages-icon-button btn btn-theme-secondary" type="button" aria-label="Edit group" hidden>•••</button></div>
        </header>
        <div id="chatFeed" class="messages-feed"><div class="messages-empty">Select a conversation to begin.</div></div>
        <form id="messageForm" class="messages-composer"><div class="messages-composer-shell"><textarea id="messageInput" rows="1" placeholder="iMessage" required></textarea></div><button class="messages-send" type="submit" aria-label="Send message">↑</button></form>
      </section>
    </main>
  </div>

  <section id="groupSheet" class="group-sheet" hidden>
    <form id="groupForm" class="group-card glass-card">
      <div class="group-card-head"><h2 id="groupSheetTitle">New group</h2><button id="closeGroupSheet" class="messages-icon-button btn btn-theme-secondary" type="button" aria-label="Close">×</button></div>
      <input id="groupConversationId" type="hidden" />
      <div class="group-image-editor"><div id="groupImagePreview" class="group-image-preview"><span>G</span></div><div style="flex:1"><label for="groupImageUrl">Group image URL</label><input id="groupImageUrl" type="url" placeholder="https://…" /></div></div>
      <div class="group-form">
        <label>Group name<input id="groupName" type="text" required maxlength="80" /></label>
        <label>Members<div id="groupMembers" class="member-picker"></div></label>
        <div class="group-actions"><button id="cancelGroupBtn" class="btn btn-theme-secondary" type="button" onclick="document.getElementById('groupSheet').hidden=true">Cancel</button><button class="btn btn-theme-primary" type="submit">Save group</button></div>
      </div>
    </form>
  </section>

  <script src="/assets/js/loader.js?v=38"></script>
  <script type="module" src="/assets/js/firebase.js?v=36"></script>
  <script type="module" src="/assets/js/theme.js?v=53"></script>
  <script type="module" src="/assets/js/route-guard.js?v=35"></script>
  <script type="module" src="/assets/js/nav.js?v=53"></script>
  <script type="module" src="/assets/js/messages-v2.js?v=1"></script>
</body>
</html>
