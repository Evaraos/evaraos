<!DOCTYPE html>
<html lang="en" data-theme="adaptive" data-environment="light" data-theme-mode="system" data-appearance="adaptive-system">
<head>
  <meta charset="UTF-8">
  <script src="/assets/js/adaptive-appearance-boot.js?v=2"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <meta name="theme-color" content="#eef5fb" />
  <title>Messages • Evaraos Inc</title><link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/theme.css?v=adaptive-liquid-v7">
  <link rel="stylesheet" href="/assets/css/nav.css?v=nav-v25-x-drawer">
  <link rel="stylesheet" href="/assets/css/pages/messages.css">
</head>
<body class="messages-page auth-pending app-loading" data-route-guard="private">
  <div id="universalNavRoot"></div>
  <div id="appRoot">
    <main class="messages-app show-list">
      <aside class="messages-sidebar">
        <div class="messages-sidebar-head">
          <div>
            <h1>Messages</h1>
            <p><span id="messagesCount">0</span> messages</p>
          </div>
          <span id="messageRoleLabel" class="conversation-meta">Staff</span>
        </div>
        <div class="messages-toolbar">
          <div class="messages-search">
            <span>⌕</span>
            <input type="search" placeholder="Search conversations" aria-label="Search conversations">
          </div>
        </div>
        <div id="channelList" class="conversation-list"></div>
      </aside>

      <section class="messages-chat">
        <header class="messages-chat-head">
          <button id="showConversationList" class="messages-icon-button btn btn-theme-secondary" type="button" aria-label="Show conversations">‹</button>
          <div class="conversation-avatar"><span>E</span></div>
          <div>
            <h2 id="chatTitle">Messages</h2>
            <p id="chatSubtitle">Select a conversation</p>
          </div>
          <span id="activeChannelLabel" class="conversation-meta"></span>
        </header>

        <div id="chatFeed" class="messages-feed">
          <div class="messages-empty">Select a conversation to begin.</div>
        </div>

        <form id="chatForm" class="messages-composer">
          <div class="messages-composer-shell">
            <textarea id="chatInput" rows="1" placeholder="Message" required></textarea>
          </div>
          <button class="messages-send" type="submit" aria-label="Send message">↑</button>
        </form>
      </section>
    </main>
  </div>

  <script src="/assets/js/loader.js"></script>
  <script type="module" src="/assets/js/route-guard.js"></script>
  <script type="module" src="/assets/js/messages.js"></script>  <script type="module" src="/assets/js/theme.js?v=adaptive-liquid-v7"></script>
  <script type="module" src="/assets/js/nav.js?v=nav-v25-x-drawer"></script>
</body>
</html>
