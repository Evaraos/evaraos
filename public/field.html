  <style>
    html.boot-pending body{margin:0;overflow-x:hidden}html.auth-pending body,body.auth-pending{opacity:0;pointer-events:none}body.field-page{margin:0;min-height:100vh;background:transparent}body.app-loading #appRoot{visibility:hidden}body.app-ready #appRoot{visibility:visible}.field-wrap{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:128px 0 78px;position:relative;z-index:2}.field-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-bottom:18px}.field-hero .glass-card,.field-toolbar,.field-section{border-radius:34px!important;padding:clamp(18px,3vw,32px)!important}.field-kicker{margin:0 0 10px;color:var(--accent-red);font-size:12px;font-weight:950;letter-spacing:.2em;text-transform:uppercase}.field-title{margin:0;font-size:clamp(2.25rem,5.8vw,5.15rem);line-height:.9;letter-spacing:-.075em}.field-copy,.muted{color:var(--text-secondary);line-height:1.65}.field-copy{max-width:740px;margin:16px 0 0}.field-stats{display:grid;gap:10px}.field-stat{border-radius:22px;padding:16px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}.field-stat strong{display:block;font-size:30px;letter-spacing:-.055em}.field-stat span{color:var(--text-secondary);font-weight:850}.field-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.field-toolbar input,.field-toolbar select{min-height:46px;border-radius:999px;border:1px solid var(--liquid-border);background:rgba(255,255,255,.10);color:var(--text-primary);padding:0 16px;outline:none;font:inherit;font-weight:800}.field-toolbar select option{color:#111}.field-list{display:grid;gap:14px}.field-card{border-radius:26px;padding:18px;border:1px solid var(--liquid-border);background:rgba(255,255,255,.075);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 14px 32px rgba(0,0,0,.08)}.field-card-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.field-card h3{margin:0;font-size:21px;letter-spacing:-.04em}.field-card p{margin:8px 0 0;color:var(--text-secondary);line-height:1.5;font-weight:760}.field-meta,.field-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.field-pill{border-radius:999px;padding:7px 10px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));font-size:12px;font-weight:950;color:var(--text-secondary)}.field-pill.hot{color:#ffd27a;border-color:rgba(255,210,122,.28);background:rgba(255,210,122,.10)}.field-pill.go{color:#70ffbd;border-color:rgba(112,255,189,.26);background:rgba(112,255,189,.10)}.field-pill.stop{color:#ff9b8f;border-color:rgba(255,155,143,.26);background:rgba(255,155,143,.10)}.field-actions button,.field-actions a{min-height:40px;border-radius:999px;padding:0 14px;font-size:13px;display:inline-flex;align-items:center;text-decoration:none}.field-photo-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.field-upload{border-radius:20px;padding:12px;border:1px dashed rgba(255,255,255,.24);background:rgba(255,255,255,.055)}.field-upload strong{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted,rgba(255,255,255,.65));margin-bottom:8px}.field-upload input{width:100%;font-size:12px}.empty-card{border-radius:22px;padding:20px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));font-weight:850;color:var(--text-secondary);line-height:1.6}@media(max-width:900px){.field-hero{grid-template-columns:1fr}.field-wrap{width:min(100% - 20px,1180px);padding-top:112px}.field-photo-box{grid-template-columns:1fr}.field-toolbar{align-items:stretch}.field-toolbar input,.field-toolbar select,.field-toolbar button{width:100%}}
  </style>

<body class="field-page auth-pending app-loading" data-route-guard="private">
  <div id="universalNavRoot"></div><div id="evaPageTransition" class="eva-page-transition" aria-hidden="true"></div>
  <div id="appRoot"><div class="page-grid-overlay"></div><main class="field-wrap">
    <section class="field-hero"><article class="glass-card aurora-card active-glow beam-target"><p class="field-kicker">FIELD DASHBOARD</p><h1 class="field-title">Your assigned work, ready for action.</h1><p class="field-copy">Cleaner and technician view for assigned jobs, route status, field notes, and before/after proof collection.</p></article><aside class="glass-card aurora-card active-glow beam-target field-stats"><div class="field-stat"><strong id="fieldTotal">—</strong><span>Assigned jobs</span></div><div class="field-stat"><strong id="fieldActive">—</strong><span>Active today</span></div><div class="field-stat"><strong id="fieldDone">—</strong><span>Completed</span></div></aside></section>
    <section class="glass-card aurora-card active-glow beam-target field-toolbar"><input id="fieldSearch" type="search" placeholder="Search customer, address, service..." /><select id="fieldStatusFilter"><option value="all">All assigned</option><option value="claimed">Claimed</option><option value="scheduled">Scheduled</option><option value="in_progress">In progress</option><option value="completed">Completed</option></select><button id="fieldRefresh" type="button" class="btn btn-theme-secondary beam-target">Refresh</button></section>
    <section class="glass-card aurora-card active-glow beam-target field-section"><div id="fieldList" class="field-list"><div class="empty-card">Loading assigned work...</div></div></section>
  </main></div>
