    html.boot-pending body{margin:0;overflow-x:hidden}html.auth-pending body,body.auth-pending{opacity:0;pointer-events:none}body.map-page{margin:0;min-height:100vh;background:transparent}body.app-loading #appRoot{visibility:hidden}body.app-ready #appRoot{visibility:visible}.map-wrap{width:min(1320px,calc(100% - 28px));margin:0 auto;padding:128px 0 78px;position:relative;z-index:2}.map-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-bottom:18px}.map-hero .glass-card,.map-shell{border-radius:34px!important;padding:clamp(18px,3vw,32px)!important}.map-kicker{margin:0 0 10px;color:var(--accent-red);font-size:12px;font-weight:950;letter-spacing:.2em;text-transform:uppercase}.map-title{margin:0;font-size:clamp(2.25rem,5.8vw,5.15rem);line-height:.9;letter-spacing:-.075em}.map-copy,.muted{color:var(--text-secondary);line-height:1.65}.map-copy{max-width:760px;margin:16px 0 0}.map-stats{display:grid;gap:10px}.map-stat{border-radius:22px;padding:16px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}.map-stat strong{display:block;font-size:30px;letter-spacing:-.055em}.map-stat span{color:var(--text-secondary);font-weight:850}.map-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.map-toolbar input,.map-toolbar select{min-height:46px;border-radius:999px;border:1px solid var(--liquid-border);background:rgba(255,255,255,.10);color:var(--text-primary);padding:0 16px;outline:none;font:inherit;font-weight:800}.map-toolbar select option{color:#111}.map-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.map-canvas{min-height:620px;border-radius:30px;border:1px solid var(--liquid-border);background:radial-gradient(circle at 20% 20%,rgba(255,47,87,.18),transparent 26%),radial-gradient(circle at 80% 35%,rgba(80,170,255,.18),transparent 28%),rgba(255,255,255,.06);position:relative;overflow:hidden}.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:44px 44px;opacity:.5}.map-pin{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--accent-red);box-shadow:0 0 0 8px rgba(255,47,87,.14),0 14px 30px rgba(0,0,0,.22);transform:translate(-50%,-50%)}.map-pin.claimed{background:#ffd27a;box-shadow:0 0 0 8px rgba(255,210,122,.14),0 14px 30px rgba(0,0,0,.22)}.map-pin.active{background:#70ffbd;box-shadow:0 0 0 8px rgba(112,255,189,.14),0 14px 30px rgba(0,0,0,.22)}.map-pin.done{background:#70a7ff;box-shadow:0 0 0 8px rgba(112,167,255,.14),0 14px 30px rgba(0,0,0,.22)}.map-side{display:grid;gap:12px;align-content:start}.map-card{border-radius:24px;padding:16px;border:1px solid var(--liquid-border);background:rgba(255,255,255,.075);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}.map-card h3{margin:0;font-size:18px;letter-spacing:-.035em}.map-card p{margin:8px 0 0;color:var(--text-secondary);line-height:1.5;font-weight:760}.map-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.map-pill{border-radius:999px;padding:7px 10px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));font-size:12px;font-weight:950;color:var(--text-secondary)}.map-pill.hot{color:#ffd27a;border-color:rgba(255,210,122,.28);background:rgba(255,210,122,.10)}.map-pill.go{color:#70ffbd;border-color:rgba(112,255,189,.26);background:rgba(112,255,189,.10)}.map-pill.done{color:#70a7ff;border-color:rgba(112,167,255,.26);background:rgba(112,167,255,.10)}.empty-card{border-radius:22px;padding:20px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));font-weight:850;color:var(--text-secondary);line-height:1.6}@media(max-width:980px){.map-hero,.map-layout{grid-template-columns:1fr}.map-wrap{width:min(100% - 20px,1320px);padding-top:112px}.map-canvas{min-height:420px}}
