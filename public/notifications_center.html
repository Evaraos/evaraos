<!doctype html>
<html lang="en" data-theme="adaptive" data-environment="light" data-theme-mode="system" data-appearance="adaptive-system" class="auth-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
  <title>Notifications • Evaraos Inc</title>
  <script src="/assets/js/adaptive-appearance-boot.js?v=2"></script>
  <link rel="stylesheet" href="/assets/css/base.css?v=53">
  <link rel="stylesheet" href="/assets/css/theme.css?v=adaptive-liquid-v9">
  <link rel="stylesheet" href="/assets/css/nav.css?v=nav-v31-phone-push">
  <link rel="stylesheet" href="/assets/css/pages/notifications-center.css?v=1">
</head>
<body class="notifications-page auth-pending app-loading" data-route-guard="private">
  <div id="universalNavRoot"></div>
  <div id="evaPageTransition" class="eva-page-transition" aria-hidden="true"></div>

  <div id="appRoot">
    <main class="notifications-shell">
      <section class="notifications-hero glass-card">
        <p class="notifications-kicker">Notification Center</p>
        <h1 class="notifications-title">Everything that needs your attention.</h1>
        <p class="notifications-subtitle">Messages, assignments, operations, payments, and system alerts—all organized in one live feed.</p>
        <p class="notifications-subtitle"><span id="noticeCount" class="notifications-count">0</span> unread notifications.</p>
        <p id="noticeStatus" class="notifications-subtitle" aria-live="polite"></p>
      </section>

      <nav class="notifications-toolbar" aria-label="Notification filters">
        <button class="notifications-filter is-active" type="button" data-notification-filter="all">All</button>
        <button class="notifications-filter" type="button" data-notification-filter="unread">Unread</button>
        <button class="notifications-filter" type="button" data-notification-filter="people">Messages</button>
        <button class="notifications-filter" type="button" data-notification-filter="operations">Operations</button>
        <button class="notifications-filter" type="button" data-notification-filter="system">System</button>
        <button id="notificationsMarkAllRead" class="notifications-mark-all" type="button">Mark All Read</button>
      </nav>

      <section id="noticeList" class="notifications-feed" aria-live="polite">
        <div class="notification-empty">Loading notifications…</div>
      </section>
    </main>
  </div>

  <script src="/assets/js/loader.js?v=36"></script>
  <script type="module" src="/assets/js/route-guard.js?v=35"></script>
  <script type="module" src="/assets/js/notifications-center.js?v=3"></script>
  <script type="module" src="/assets/js/theme.js?v=adaptive-liquid-v9"></script>
  <script type="module" src="/assets/js/nav.js?v=nav-v31-phone-push"></script>
</body>
</html>
