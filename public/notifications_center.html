<!doctype html>
<html lang="en" data-theme="adaptive" data-environment="light" data-theme-mode="system" data-appearance="adaptive-system" class="auth-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
  <title>Notifications • Evaraos Inc</title>
  <script src="/assets/js/adaptive-appearance-boot.js?v=10"></script>
  <link rel="stylesheet" href="/assets/css/base.css?v=53">
  <link rel="stylesheet" href="/assets/css/theme.css?v=adaptive-liquid-v10">
  <link rel="stylesheet" href="/assets/css/nav.css?v=nav-v33-theme-notifications">
  <link rel="stylesheet" href="/assets/css/pages/notifications-center.css?v=2">
</head>
<body class="notifications-page auth-pending app-loading" data-route-guard="private">
  <div id="universalNavRoot"></div>
  <div id="evaPageTransition" class="eva-page-transition" aria-hidden="true"></div>
  <div id="appRoot">
    <main class="notifications-shell">
      <section class="notifications-hero glass-card">
        <p class="notifications-kicker">Notification Center</p>
        <h1 class="notifications-title">Everything that needs your attention.</h1>
        <p class="notifications-subtitle">Messages, assignments, operations, payments, and system alerts—all organized in one live feed.</p>
        <p class="notifications-subtitle"><span id="noticeCount" class="notifications-count">0</span> unread notifications.</p>
        <p id="noticeStatus" class="notifications-subtitle" aria-live="polite"></p>
      </section>
      <div class="notifications-toolbar eva-segmented" data-eva-sticky="true" role="group" aria-label="Notification filters">
        <button class="notifications-filter eva-segmented__control is-active" type="button" data-notification-filter="all" aria-pressed="true">All</button>
        <button class="notifications-filter eva-segmented__control" type="button" data-notification-filter="unread" aria-pressed="false">Unread</button>
        <button class="notifications-filter eva-segmented__control" type="button" data-notification-filter="people" aria-pressed="false">Messages</button>
        <button class="notifications-filter eva-segmented__control" type="button" data-notification-filter="operations" aria-pressed="false">Operations</button>
        <button class="notifications-filter eva-segmented__control" type="button" data-notification-filter="system" aria-pressed="false">System</button>
        <button id="notificationsMarkAllRead" class="notifications-mark-all" type="button">Mark All Read</button>
      </div>
      <section id="noticeList" class="notifications-feed" aria-live="polite"><div class="notification-empty">Loading notifications…</div></section>
    </main>
  </div>
  <script src="/assets/js/loader.js?v=36"></script>
  <script type="module" src="/assets/js/route-guard.js?v=35"></script>
  <script type="module" src="/assets/js/notifications-center-v3.js?v=1"></script>
  <script type="module" src="/assets/js/theme.js?v=adaptive-liquid-v19-workspace-glass"></script>
  <script type="module" src="/assets/js/nav.js?v=nav-v33-theme-notifications"></script>
</body>
</html>
