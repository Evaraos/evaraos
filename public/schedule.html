g:-.02em}.calendar-pill{border-radius:18px;padding:9px 10px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));font-size:11px;font-weight:950;color:var(--text-secondary);line-height:1.35}.calendar-pill.hot{border-color:rgba(255,210,122,.28);background:rgba(255,210,122,.12);color:#ffd27a}.calendar-pill.go{border-color:rgba(112,255,189,.26);background:rgba(112,255,189,.10);color:#70ffbd}.calendar-pill.stop{border-color:rgba(255,155,143,.26);background:rgba(255,155,143,.10);color:#ff9b8f}@media(max-width:980px){.schedule-hero,.calendar-grid{grid-template-columns:1fr}.schedule-wrap{width:min(100% - 20px,1320px);padding-top:112px}.calendar-day{min-height:auto}}
