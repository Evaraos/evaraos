<!DOCTYPE html>
<html lang="en" data-theme="adaptive" data-environment="light" data-theme-mode="image" data-appearance="adaptive-system">
<head>
  <meta charset="UTF-8" />
  <script src="/assets/js/adaptive-appearance-boot.js?v=1"></script><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
  <meta name="theme-color" content="#eef5fb" />
  <title>Reset Password • Evaraos Inc</title>
  <style>html.boot-pending body{margin:0;overflow:hidden}body.reset-page{margin:0;min-height:100vh;background:transparent}body.app-loading #appRoot{visibility:hidden}body.app-ready #appRoot{visibility:visible}</style>
  <link rel="stylesheet" href="/assets/css/base.css?v=53" />
  <link rel="stylesheet" href="/assets/css/theme.css?v=adaptive-liquid-v1" />
  <link rel="stylesheet" href="/assets/css/auth.css?v=50" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=nav-v25-x-drawer" />
</head>
<body class="reset-page app-loading" data-route-guard="public">
  <div id="universalNavRoot"></div>
  <div id="evaPageTransition" class="eva-page-transition" aria-hidden="true"></div>
  <div id="appRoot">
    <main class="reset-shell">
      <section class="login-panel glass-card auth-panel auth-panel-reset">
        <div class="login-badge-wrap"><img src="/assets/img/evaraos_logo.png" alt="Evaraos logo" class="login-badge auth-badge auth-badge-large" loading="eager" decoding="async" /></div>
        <h1 class="login-title">Recover Your Account</h1>
        <p class="login-subtitle">Enter the exact email address connected to your Evaraos account. Firebase will send a secure password-reset link.</p>
        <form id="resetForm" class="login-form" novalidate>
          <div class="form-group"><label class="field-label" for="resetEmail">Account Email</label><div class="input-shell"><input id="resetEmail" name="email" type="email" class="input" placeholder="name@example.com" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required /></div></div>
          <div class="login-actions-row"><button type="submit" class="btn btn-theme-primary">Send Reset Link</button><a href="/login.html" class="btn btn-theme-secondary">Back to Login</a></div>
          <p id="resetMessage" class="login-message" aria-live="polite"></p>
        </form>
        <div class="auth-footer-links"><span>Check spam and promotions if the email does not appear.</span></div>
      </section>
    </main>
  </div>
  <script src="/assets/js/loader.js?v=39"></script>
  <script type="module" src="/assets/js/firebase.js?v=38"></script>
  <script type="module" src="/assets/js/reset-password-v2.js?v=3"></script>  <script type="module" src="/assets/js/theme.js?v=adaptive-liquid-v1"></script>
  <script type="module" src="/assets/js/nav.js?v=nav-v25-x-drawer"></script>
</body>
</html>
