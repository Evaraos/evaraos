<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
  <meta name="theme-color" content="#f4f7f6" />
  <title>Employee Onboarding • Evaraos Inc</title>
  <script src="/assets/js/theme-boot.js?v=50"></script>
  <style>
    html.boot-pending body{margin:0;overflow-x:hidden}html.auth-pending body,body.auth-pending{opacity:0;pointer-events:none}body.onboarding-page{margin:0;min-height:100vh;background:transparent}body.app-loading #appRoot{visibility:hidden}body.app-ready #appRoot{visibility:visible}.onboarding-wrap{width:min(1220px,calc(100% - 32px));margin:0 auto;padding:132px 0 70px;position:relative;z-index:2}.onboarding-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-bottom:18px}.onboarding-hero .glass-card,.onboarding-panel{border-radius:34px!important;padding:clamp(20px,3vw,34px)!important}.onboarding-kicker{margin:0 0 10px;color:var(--accent-red);font-size:12px;font-weight:950;letter-spacing:.2em;text-transform:uppercase}.onboarding-title{margin:0;font-size:clamp(2.25rem,5.8vw,5.1rem);line-height:.9;letter-spacing:-.075em}.onboarding-copy,.muted{color:var(--text-secondary);line-height:1.65}.onboarding-copy{max-width:760px;margin:16px 0 0}.onboarding-status-grid{display:grid;gap:10px}.status-mini{border-radius:22px;padding:16px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}.status-mini strong{display:block;font-size:30px;letter-spacing:-.055em}.status-mini span{color:var(--text-secondary);font-weight:850}.onboarding-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.profile-card,.task-card{border-radius:24px;padding:18px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}.profile-row{display:grid;grid-template-columns:140px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12)}.profile-row:last-child{border-bottom:0}.profile-row strong{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted,rgba(255,255,255,.62))}.profile-row span{font-weight:850;overflow-wrap:anywhere}.task-list{display:grid;gap:12px}.task-card{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.task-card h3{margin:0 0 5px;font-size:17px;letter-spacing:-.035em}.task-card p{margin:0;color:var(--text-muted,rgba(255,255,255,.66));line-height:1.5;font-weight:750}.task-toggle{min-width:48px;height:30px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);position:relative;cursor:pointer}.task-toggle::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 8px 18px rgba(0,0,0,.18);transition:transform .18s ease}.task-toggle[aria-checked="true"]{background:rgba(40,217,135,.35);border-color:rgba(40,217,135,.45)}.task-toggle[aria-checked="true"]::after{transform:translateX(18px)}.onboarding-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.empty-card{border-radius:24px;padding:22px;border:1px solid var(--liquid-border);background:linear-gradient(180deg,var(--liquid-bg-top),var(--liquid-bg-bottom));font-weight:850;color:var(--text-secondary);line-height:1.6}@media(max-width:900px){.onboarding-hero,.onboarding-grid{grid-template-columns:1fr}.onboarding-wrap{width:min(100% - 20px,1220px);padding-top:112px}.profile-row{grid-template-columns:1fr}}
  </style>
  <link rel="stylesheet" href="/assets/css/base.css?v=50" />
  <link rel="stylesheet" href="/assets/css/theme.css?v=50" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=nav-v4" />
  <link rel="stylesheet" href="/assets/css/dashboard.css?v=50" />
  <link rel="stylesheet" href="/assets/css/app-system.css?v=50" />
</head>
<body class="onboarding-page auth-pending app-loading" data-route-guard="private">
  <div id="universalNavRoot"></div><div id="evaPageTransition" class="eva-page-transition" aria-hidden="true"></div>
  <div id="appRoot"><div class="page-grid-overlay"></div><main class="onboarding-wrap">
    <section class="onboarding-hero"><article class="glass-card aurora-card active-glow beam-target"><p class="onboarding-kicker">EMPLOYEE ONBOARDING</p><h1 class="onboarding-title">Activate your staff profile.</h1><p class="onboarding-copy">Track the steps required after approval: policies, tax docs, training, assignment readiness, and payout activation.</p></article><aside class="glass-card aurora-card active-glow beam-target onboarding-status-grid"><div class="status-mini"><strong id="onboardingPercent">—</strong><span>Completion</span></div><div class="status-mini"><strong id="onboardingRole">—</strong><span>Approved role</span></div><div class="status-mini"><strong id="onboardingCompany">—</strong><span>Company</span></div></aside></section>
    <section class="glass-card aurora-card active-glow beam-target onboarding-panel"><div id="onboardingRoot" class="empty-card">Loading onboarding profile...</div></section>
  </main></div>
  <script src="/assets/js/loader.js"></script>
  <script type="module" src="/assets/js/firebase.js"></script>
  <script type="module" src="/assets/js/theme.js?v=50"></script>
  <script type="module" src="/assets/js/route-guard.js"></script>
  <script type="module" src="/assets/js/nav.js?v=50"></script>
  <script type="module" src="/assets/js/onboarding.js"></script>
</body>
</html>
