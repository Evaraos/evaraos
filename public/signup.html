  <title>Sign Up • Evaraos Inc</title>

  <script src="/assets/js/theme-boot.js?v=1"></script>

  <style>
    html, body { background: #f4f7f6; }
    html[data-theme="light"], html[data-theme="light"] body { background: #f4f7f6; }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #050311; }
    html.boot-pending body { margin: 0; overflow: hidden; touch-action: none; }
    html.auth-pending body, body.auth-pending { opacity: 0; pointer-events: none; }
    body.signup-page { margin: 0; min-height: 100vh; background: transparent; }
    body.app-loading #appRoot { visibility: hidden; }
    body.app-ready #appRoot { visibility: visible; }
  </style>

  <link rel="stylesheet" href="/assets/css/base.css?v=34" />
  <link rel="stylesheet" href="/assets/css/theme.css?v=36" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=nav-v4" />
  <link rel="stylesheet" href="/assets/css/auth.css?v=34" />
  <link rel="stylesheet" href="/assets/css/dashboard.css?v=34" />
  <link rel="stylesheet" href="/assets/css/app-system.css?v=simple-glass" />
</head>
<body class="signup-page auth-pending app-loading" data-route-guard="auth">
  <div id="universalNavRoot"></div>

  <div id="appRoot">
    <div class="page-grid-overlay"></div>

    <main class="signup-shell">
      <section class="login-panel glass-card aurora-card auth-panel auth-panel-signup active-glow beam-target">
        <div class="login-badge-wrap">
          <img src="/assets/img/evaraos_logo.png" alt="Evaraos logo" class="login-badge auth-badge auth-badge-large" loading="eager" decoding="async" fetchpriority="high" />
        </div>

        <h1 class="login-title">Create Account</h1>
        <p class="login-subtitle">Create your secure Evaraos account and choose a username for platform access.</p>

        <form id="signupForm" class="login-form" novalidate>
          <div class="form-grid-2">
            <div class="form-group"><label class="field-label" for="signupName">Full Name</label><div class="input-shell aurora-card beam-target"><input id="signupName" name="name" type="text" class="input" placeholder="Enter your full name" autocomplete="name" required /></div></div>
            <div class="form-group"><label class="field-label" for="signupUsername">Username</label><div class="input-shell aurora-card beam-target"><input id="signupUsername" name="username" type="text" class="input" placeholder="Choose a username" autocomplete="username" required /></div></div>
          </div>

          <div class="form-grid-2">
            <div class="form-group"><label class="field-label" for="signupEmail">Email</label><div class="input-shell aurora-card beam-target"><input id="signupEmail" name="email" type="email" class="input" placeholder="Enter your email" autocomplete="email" required /></div></div>
            <div class="form-group"><label class="field-label" for="signupPassword">Create Password</label><div class="password-wrap aurora-card beam-target"><input id="signupPassword" name="password" type="password" class="input" placeholder="Create your password" autocomplete="new-password" required /><button type="button" class="password-toggle" id="signupPasswordToggle" aria-label="Show password">👁</button></div></div>
          </div>

          <div class="form-grid-2">
            <div class="form-group"><label class="field-label" for="signupPasswordConfirm">Confirm Password</label><div class="password-wrap aurora-card beam-target"><input id="signupPasswordConfirm" name="passwordConfirm" type="password" class="input" placeholder="Confirm your password" autocomplete="new-password" required /><button type="button" class="password-toggle" id="signupPasswordConfirmToggle" aria-label="Show password confirmation">👁</button></div></div>
            <div class="form-group"><label class="field-label" for="signupRememberDevice">Session</label><div class="remember-row aurora-card beam-target"><label class="remember-check" for="signupRememberDevice"><input id="signupRememberDevice" name="rememberDevice" type="checkbox" checked /><span>Keep me signed in on this device</span></label></div></div>
          </div>

          <div class="login-actions-row"><button type="submit" class="btn btn-theme-primary premium-red-btn">Create Account</button><a href="/login.html" class="btn btn-theme-secondary">Already Have Login</a></div>
          <p id="signupMessage" class="login-message" aria-live="polite"></p>
        </form>

        <div class="auth-footer-links"><span>Already registered?</span><a href="/login.html">Sign in</a></div>
      </section>
    </main>
  </div>

  <script src="/assets/js/loader.js?v=3"></script>
  <script type="module" src="/assets/js/firebase.js?v=36"></script>
  <script type="module" src="/assets/js/theme.js?v=37"></script>
  <script src="/assets/js/theme-css-loader.js?v=2"></script>
  <script type="module" src="/assets/js/route-guard.js?v=36"></script>
  <script type="module" src="/assets/js/auth.js?v=38"></script>
  <script type="module" src="/assets/js/nav.js?v=nav-v4"></script>
</body>
</html>
