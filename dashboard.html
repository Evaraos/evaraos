<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Evaraos Inc</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="app-shell">
  <header class="app-topbar" id="topbar"></header>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-panel">
      <section class="glass-card">
        <h1 style="margin-top:0;">Internal Operations Overview</h1>
        <div class="stats-grid">
          <div class="stat"><h3 id="statLeads">0</h3><p>Leads</p></div>
          <div class="stat"><h3 id="statSalesReps">0</h3><p>Sales Reps</p></div>
          <div class="stat"><h3 id="statJobs">0</h3><p>Jobs</p></div>
          <div class="stat"><h3 id="statInvoices">0</h3><p>Invoices</p></div>
        </div>
      </section>

      <section class="glass-card">
        <h2 style="margin-top:0;">Account Summary</h2>
        <div id="dashboardContent" class="muted">Loading...</div>
      </section>

      <section class="glass-card">
        <h2 style="margin-top:0;">Role Access Preview</h2>
        <div id="rolePreview" class="muted">Loading...</div>
      </section>
    </main>
  </div>

  <script type="module">
    import {
      bindTopbar,
      requireAuth,
      fetchCompanyCollection,
      renderSidebar,
      renderRoleSummary
    } from "./assets/app.js";

    requireAuth(async (user) => {
      if (user.role === "customer") {
        window.location.href = "customer_dashboard.html";
        return;
      }

      await bindTopbar(user);
      document.getElementById("sidebar").innerHTML = renderSidebar(user.role, "overview");

      const [leads, salesReps, jobs, invoices] = await Promise.all([
        fetchCompanyCollection("leads"),
        fetchCompanyCollection("sales_reps"),
        fetchCompanyCollection("jobs"),
        fetchCompanyCollection("invoices")
      ]);

      document.getElementById("statLeads").textContent = leads.length;
      document.getElementById("statSalesReps").textContent = salesReps.length;
      document.getElementById("statJobs").textContent = jobs.length;
      document.getElementById("statInvoices").textContent = invoices.length;

      document.getElementById("dashboardContent").innerHTML = renderRoleSummary(user);

      document.getElementById("rolePreview").innerHTML = `
        Sales reps can now be managed dynamically by authorized roles.
      `;
    });
  </script>
</body>
</html>
