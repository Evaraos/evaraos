<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Evaraos Inc</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .hero-grid-dash{
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:20px;
    }
    .stats-grid-4{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
    }
    .info-list{
      display:grid;
      gap:12px;
    }
    .info-item{
      padding:16px;
      border-radius:20px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
    }
    .dash-title{
      margin:0 0 10px;
      font-size:clamp(28px,4vw,44px);
    }
    .dash-sub{
      color:#b8c0d0;
      line-height:1.6;
    }
    .analytics-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
    }
    .analytics-card{
      padding:18px;
      border-radius:22px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
    }
    .analytics-card h3{
      margin:0 0 10px;
    }
    .analytics-list{
      color:#b8c0d0;
      line-height:1.7;
      font-size:14px;
    }
    @media (max-width: 1024px){
      .hero-grid-dash,.stats-grid-4,.analytics-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body class="app-shell">
  <header class="app-topbar" id="topbar"></header>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-panel" id="dashboardRoot">
      <section class="glass-card">
        <div class="hero-grid-dash">
          <div>
            <h1 class="dash-title" id="dashHeading">Loading dashboard...</h1>
            <p class="dash-sub" id="dashSubtext">Loading company-aware analytics...</p>
          </div>
          <div class="glass-card" style="padding:18px;">
            <h3 style="margin-top:0;">Current Access</h3>
            <div id="permissionBadges"></div>
          </div>
        </div>
      </section>

      <section class="glass-card">
        <div class="stats-grid-4" id="statsGrid"></div>
      </section>

      <section class="glass-card">
        <h2 style="margin-top:0;">Operational Analytics</h2>
        <div class="analytics-grid" id="analyticsGrid"></div>
      </section>

      <section class="glass-card">
        <h2 style="margin-top:0;">Account Summary</h2>
        <div id="accountSummary" class="muted">Loading...</div>
      </section>

      <section class="glass-card">
        <h2 style="margin-top:0;">Role-Specific Workspace</h2>
        <div id="roleWorkspace" class="info-list"></div>
      </section>
    </main>
  </div>

  <script type="module">
    import {
      bindTopbar,
      requireAuth,
      loadCompany,
      fetchCompanyCollection,
      fetchAllCollection,
      fetchUsersByCompany,
      fetchActiveSalesReps,
      fetchActiveTechnicians,
      renderSidebar,
      renderRoleSummary,
      renderPermissionBadges,
      hasPermission
    } from "./assets/app.js";

    function statCard(label, value) {
      return `
        <div class="stat">
          <h3>${value}</h3>
          <p>${label}</p>
        </div>
      `;
    }

    function infoCard(title, body) {
      return `
        <div class="info-item">
          <strong>${title}</strong><br>
          <span class="muted">${body}</span>
        </div>
      `;
    }

    function analyticsCard(title, lines) {
      return `
        <div class="analytics-card">
          <h3>${title}</h3>
          <div class="analytics-list">${lines.join("<br>")}</div>
        </div>
      `;
    }

    function countByStatus(items, key = "status") {
      const counts = {};
      items.forEach((item) => {
        const value = item[key] || "unknown";
        counts[value] = (counts[value] || 0) + 1;
      });
      return counts;
    }

    requireAuth(async (user) => {
      if (user.role === "customer") {
        window.location.href = "customer_dashboard.html";
        return;
      }

      await bindTopbar(user);
      document.getElementById("sidebar").innerHTML = renderSidebar(user.role, "overview");

      const company = await loadCompany(user.companyId);

      const [leads, jobs, users, reps, technicians, companies, services, invoices] = await Promise.all([
        fetchCompanyCollection("leads", user.companyId).catch(() => []),
        fetchCompanyCollection("jobs", user.companyId).catch(() => []),
        fetchUsersByCompany(user.companyId).catch(() => []),
        fetchActiveSalesReps(user.companyId).catch(() => []),
        fetchActiveTechnicians(user.companyId).catch(() => []),
        user.role === "super_admin" ? fetchAllCollection("companies").catch(() => []) : Promise.resolve(company ? [company] : []),
        fetchAllCollection("services").catch(() => []),
        fetchCompanyCollection("invoices", user.companyId).catch(() => [])
      ]);

      const leadCounts = countByStatus(leads);
      const jobCounts = countByStatus(jobs);

      document.getElementById("permissionBadges").innerHTML = renderPermissionBadges(user);
      document.getElementById("accountSummary").innerHTML = renderRoleSummary(user);

      const heading = document.getElementById("dashHeading");
      const subtext = document.getElementById("dashSubtext");
      const statsGrid = document.getElementById("statsGrid");
      const analyticsGrid = document.getElementById("analyticsGrid");
      const roleWorkspace = document.getElementById("roleWorkspace");

      const analyticsCards = [
        analyticsCard("Lead Funnel", [
          `New: ${leadCounts.new || 0}`,
          `Contacted: ${leadCounts.contacted || 0}`,
          `Quoted: ${leadCounts.quoted || 0}`,
          `Scheduled: ${leadCounts.scheduled || 0}`,
          `Won: ${leadCounts.won || 0}`,
          `Lost: ${leadCounts.lost || 0}`
        ]),
        analyticsCard("Job Pipeline", [
          `Scheduled: ${jobCounts.scheduled || 0}`,
          `In Progress: ${jobCounts.in_progress || 0}`,
          `Completed: ${jobCounts.completed || 0}`,
          `Cancelled: ${jobCounts.cancelled || 0}`
        ]),
        analyticsCard("Team Snapshot", [
          `Users: ${users.length}`,
          `Sales Reps: ${reps.length}`,
          `Technicians: ${technicians.length}`,
          `Services: ${services.length}`,
          `Invoices: ${invoices.length}`
        ])
      ];

      analyticsGrid.innerHTML = analyticsCards.join("");

      if (user.role === "super_admin") {
        heading.textContent = "Evaraos Parent Control";
        subtext.textContent = `You are operating as parent owner over the platform while your current working company is ${company?.name || user.companyId}.`;

        statsGrid.innerHTML = [
          statCard("Companies", companies.length),
          statCard("Leads", leads.length),
          statCard("Jobs", jobs.length),
          statCard("Users In Current LLC", users.length)
        ].join("");

        roleWorkspace.innerHTML = [
          infoCard("Platform Authority", "You can oversee subsidiaries, users, job flow, staffing structure, and future expansion."),
          infoCard("Current Company Context", company?.name || user.companyId),
          infoCard("Lead to Job Engine", "Sales can now push qualified opportunities into scheduled jobs for operations."),
          infoCard("Permissions Snapshot", hasPermission(user, "all") ? "Full platform control is active." : "Limited.")
        ].join("");
      } else if (user.role === "admin") {
        heading.textContent = `${company?.name || "Company"} Admin Dashboard`;
        subtext.textContent = "This is the LLC control center for approvals, staffing, leads, jobs, and operational performance.";

        statsGrid.innerHTML = [
          statCard("Users", users.length),
          statCard("Leads", leads.length),
          statCard("Jobs", jobs.length),
          statCard("Technicians", technicians.length)
        ].join("");

        roleWorkspace.innerHTML = [
          infoCard("Company Management", "Manage staffing, pending approvals, lead conversion, and day-to-day execution."),
          infoCard("Job Oversight", "Use the Jobs page to monitor scheduled, in-progress, and completed work."),
          infoCard("Owner Link", company?.ownerName ? `${company.ownerName} | ${company.ownerEmail}` : "Owner information not found."),
          infoCard("Internal Growth", "Use this structure to grow teams regionally and nationally under the same LLC.")
        ].join("");
      } else if (user.role === "sales_rep") {
        heading.textContent = `${company?.name || "Company"} Sales Workspace`;
        subtext.textContent = "This dashboard is focused on lead movement, conversion, and clean handoff into scheduled jobs.";

        statsGrid.innerHTML = [
          statCard("Leads", leads.length),
          statCard("Scheduled Jobs", jobCounts.scheduled || 0),
          statCard("Won Leads", leadCounts.won || 0),
          statCard("Quoted Leads", leadCounts.quoted || 0)
        ].join("");

        roleWorkspace.innerHTML = [
          infoCard("Pipeline Mission", "Convert leads into quoted, won, and scheduled work."),
          infoCard("Lead → Job Flow", "Qualified opportunities should be converted into jobs for field execution."),
          infoCard("Company", company?.name || user.companyId),
          infoCard("Reporting Chain", `You report into ${user.reportsTo || "not set"}.`)
        ].join("");
      } else if (user.role === "technician") {
        heading.textContent = `${company?.name || "Company"} Technician Dashboard`;
        subtext.textContent = "This dashboard is designed for job execution, field updates, and service quality.";

        statsGrid.innerHTML = [
          statCard("Jobs", jobs.length),
          statCard("Scheduled", jobCounts.scheduled || 0),
          statCard("In Progress", jobCounts.in_progress || 0),
          statCard("Completed", jobCounts.completed || 0)
        ].join("");

        roleWorkspace.innerHTML = [
          infoCard("Field Focus", "Stay focused on scheduled work, completion updates, and quality delivery."),
          infoCard("Operations Visibility", "You should only see what supports execution and status updates."),
          infoCard("Company", company?.name || user.companyId),
          infoCard("Growth Path", "Technicians can later promote into operations leadership or management.")
        ].join("");
      } else {
        heading.textContent = `${company?.name || "Company"} Internal Dashboard`;
        subtext.textContent = "This is your internal company view based on your role and access level.";

        statsGrid.innerHTML = [
          statCard("Users", users.length),
          statCard("Leads", leads.length),
          statCard("Jobs", jobs.length),
          statCard("Services", services.length)
        ].join("");

        roleWorkspace.innerHTML = [
          infoCard("Company", company?.name || user.companyId),
          infoCard("Access", "Your role determines which modules and actions you can see."),
          infoCard("Hierarchy", `Organization Level ${user.organizationLevel || "—"}`),
          infoCard("Execution", "The business now supports both lead conversion and job fulfillment.")
        ].join("");
      }
    });
  </script>
</body>
</html>
