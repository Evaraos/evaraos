<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Evaraos Inc</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="app-shell">
  <header class="app-topbar" id="topbar"></header>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-panel">
      <section class="glass-card">
        <h1 style="margin-top:0;">Internal Operations Overview</h1>
        <div class="stats-grid">
          <div class="stat"><h3 id="statLeads">0</h3><p>Leads</p></div>
          <div class="stat"><h3 id="statUsers">0</h3><p>Users</p></div>
          <div class="stat"><h3 id="statCompanies">0</h3><p>Companies</p></div>
          <div class="stat"><h3 id="statInvoices">0</h3><p>Invoices</p></div>
        </div>
      </section>

      <section class="glass-card">
        <h2 style="margin-top:0;">Account Summary</h2>
        <div id="dashboardContent" class="muted">Loading...</div>
      </section>

      <section class="glass-card">
        <h2 style="margin-top:0;">Platform Scope</h2>
        <div id="rolePreview" class="muted">Loading...</div>
      </section>
    </main>
  </div>

  <script type="module">
    import {
      bindTopbar,
      requireAuth,
      fetchCompanyCollection,
      fetchAllCollection,
      fetchUsersByCompany,
      renderSidebar,
      renderRoleSummary
    } from "./assets/app.js";

    requireAuth(async (user) => {
      if (user.role === "customer") {
        window.location.href = "customer_dashboard.html";
        return;
      }

      await bindTopbar(user);
      document.getElementById("sidebar").innerHTML = renderSidebar(user.role, "overview");

      const [leads, users, companies, invoices] = await Promise.all([
        fetchCompanyCollection("leads", user.companyId),
        fetchUsersByCompany(user.companyId),
        user.role === "super_admin" ? fetchAllCollection("companies") : fetchCompanyCollection("companies", user.companyId),
        fetchCompanyCollection("invoices", user.companyId)
      ]);

      document.getElementById("statLeads").textContent = leads.length;
      document.getElementById("statUsers").textContent = users.length;
      document.getElementById("statCompanies").textContent = companies.length;
      document.getElementById("statInvoices").textContent = invoices.length;

      document.getElementById("dashboardContent").innerHTML = renderRoleSummary(user);

      document.getElementById("rolePreview").innerHTML = user.role === "super_admin"
        ? "You are viewing Evaraos parent-level controls and can oversee multiple LLCs."
        : "You are operating inside your assigned company scope only.";
    });
  </script>
</body>
</html>
