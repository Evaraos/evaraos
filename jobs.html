<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jobs - Evaraos Inc</title>
  <link rel="stylesheet" href="/evaraos/assets/css/styles.css" />
</head>
<body class="app-shell app-theme">
  <div class="app-bg">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-grid"></div>
  </div>

  <header class="app-topbar" id="topbar"></header>

  <div class="page-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <section class="glass-card aurora-card shine-border">
        <div class="section-title-row">
          <div>
            <h1 style="margin:0;">Jobs</h1>
            <p class="muted" style="margin:8px 0 0;">
              Track scheduled work, field execution, customer details, and job status.
            </p>
          </div>
          <div class="top-actions">
            <button class="btn" id="openJobModalBtn" type="button">Add Job</button>
          </div>
        </div>
      </section>

      <main id="jobsRoot" class="content-root">
        <section class="glass-card aurora-card shine-border">
          <div class="muted">Loading jobs...</div>
        </section>
      </main>
    </main>
  </div>

  <div class="modal-backdrop" id="jobModal">
    <div class="modal-card aurora-card shine-border">
      <div class="modal-head">
        <h2 id="jobModalTitle" style="margin:0;">Edit Job</h2>
        <button class="btn secondary" id="closeJobModalBtn" type="button">Close</button>
      </div>

      <form id="jobForm">
        <section class="form-section">
          <h3 class="form-section-title">Customer</h3>
          <div class="form-grid">
            <div class="field">
              <label for="jobCustomerName">Customer Name</label>
              <input id="jobCustomerName" placeholder="Customer Name" />
            </div>

            <div class="field">
              <label for="jobCustomerPhone">Customer Phone</label>
              <input id="jobCustomerPhone" placeholder="Customer Phone" />
            </div>

            <div class="field full">
              <label for="jobCustomerEmail">Customer Email</label>
              <input id="jobCustomerEmail" placeholder="Customer Email" type="email" />
            </div>
          </div>
        </section>

        <section class="form-section">
          <h3 class="form-section-title">Location</h3>
          <div class="form-grid">
            <div class="field full">
              <label for="jobAddress">Address</label>
              <input id="jobAddress" placeholder="Address" />
            </div>

            <div class="field">
              <label for="jobCity">City</label>
              <input id="jobCity" placeholder="City" />
            </div>

            <div class="field">
              <label for="jobState">State</label>
              <select id="jobState">
                <option value="">State</option>
                <option value="AL">Alabama</option>
                <option value="AK">Alaska</option>
                <option value="AZ">Arizona</option>
                <option value="AR">Arkansas</option>
                <option value="CA">California</option>
                <option value="CO">Colorado</option>
                <option value="CT">Connecticut</option>
                <option value="DE">Delaware</option>
                <option value="FL">Florida</option>
                <option value="GA">Georgia</option>
                <option value="HI">Hawaii</option>
                <option value="ID">Idaho</option>
                <option value="IL">Illinois</option>
                <option value="IN">Indiana</option>
                <option value="IA">Iowa</option>
                <option value="KS">Kansas</option>
                <option value="KY">Kentucky</option>
                <option value="LA">Louisiana</option>
                <option value="ME">Maine</option>
                <option value="MD">Maryland</option>
                <option value="MA">Massachusetts</option>
                <option value="MI">Michigan</option>
                <option value="MN">Minnesota</option>
                <option value="MS">Mississippi</option>
                <option value="MO">Missouri</option>
                <option value="MT">Montana</option>
                <option value="NE">Nebraska</option>
                <option value="NV">Nevada</option>
                <option value="NH">New Hampshire</option>
                <option value="NJ">New Jersey</option>
                <option value="NM">New Mexico</option>
                <option value="NY">New York</option>
                <option value="NC">North Carolina</option>
                <option value="ND">North Dakota</option>
                <option value="OH">Ohio</option>
                <option value="OK">Oklahoma</option>
                <option value="OR">Oregon</option>
                <option value="PA">Pennsylvania</option>
                <option value="RI">Rhode Island</option>
                <option value="SC">South Carolina</option>
                <option value="SD">South Dakota</option>
                <option value="TN">Tennessee</option>
                <option value="TX">Texas</option>
                <option value="UT">Utah</option>
                <option value="VT">Vermont</option>
                <option value="VA">Virginia</option>
                <option value="WA">Washington</option>
                <option value="WV">West Virginia</option>
                <option value="WI">Wisconsin</option>
                <option value="WY">Wyoming</option>
              </select>
            </div>

            <div class="field">
              <label for="jobZip">Zip</label>
              <input id="jobZip" placeholder="Zip" />
            </div>
          </div>
        </section>

        <section class="form-section">
          <h3 class="form-section-title">Service & Schedule</h3>
          <div class="form-grid">
            <div class="field">
              <label for="jobServiceType">Service Type</label>
              <input id="jobServiceType" placeholder="Service Type" />
            </div>

            <div class="field">
              <label for="jobAssignedTechnician">Assigned Technician</label>
              <select id="jobAssignedTechnician">
                <option value="">Assigned Technician</option>
              </select>
            </div>

            <div class="field">
              <label for="jobScheduledDate">Scheduled Date</label>
              <input id="jobScheduledDate" type="date" />
            </div>

            <div class="field">
              <label for="jobScheduledTimeWindow">Time Window</label>
              <select id="jobScheduledTimeWindow">
                <option value="">Time Window</option>
                <option value="8am-10am">8am - 10am</option>
                <option value="10am-12pm">10am - 12pm</option>
                <option value="12pm-2pm">12pm - 2pm</option>
                <option value="2pm-4pm">2pm - 4pm</option>
                <option value="4pm-6pm">4pm - 6pm</option>
              </select>
            </div>

            <div class="field">
              <label for="jobEstimatedSqFt">Estimated Sq Ft</label>
              <input id="jobEstimatedSqFt" type="number" placeholder="Estimated Sq Ft" />
            </div>

            <div class="field">
              <label for="jobEstimatedPrice">Estimated Price</label>
              <input id="jobEstimatedPrice" type="number" placeholder="Estimated Price" />
            </div>

            <div class="field">
              <label for="jobStatus">Status</label>
              <select id="jobStatus">
                <option value="scheduled">Scheduled</option>
                <option value="in_progress">In Progress</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
          </div>
        </section>

        <section class="form-section">
          <div class="field">
            <label for="jobNotes">Notes</label>
            <textarea id="jobNotes" class="notes-field" placeholder="Notes"></textarea>
          </div>
        </section>

        <div class="top-actions">
          <button class="btn" id="saveJobBtn" type="submit">Save Job</button>
          <button class="btn secondary" id="cancelJobModalBtn" type="button">Cancel</button>
        </div>

        <p id="jobMsg" class="status-text"></p>
      </form>
    </div>
  </div>

  <script type="module" src="/evaraos/assets/js/jobs.js"></script>
</body>
</html>
