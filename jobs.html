<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs - Evaraos Inc</title>
  <link rel="stylesheet" href="/evaraos/assets/css/styles.css" />
  <style>
    .job-meta-line{
      color:#b8c0d0;
      font-size:13px;
      line-height:1.65;
      margin-top:8px;
    }
    .identity-chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      font-size:12px;
      color:#fff;
      margin-top:8px;
    }
  </style>
</head>
<body class="app-shell">
  <header class="app-topbar" id="topbar"></header>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-panel">
      <section class="glass-card">
        <div class="action-row" style="justify-content:space-between;align-items:center;">
          <div>
            <h1 style="margin:0;">Jobs</h1>
            <p class="muted" style="margin:8px 0 0;">Track scheduled work, field execution, and pipeline ownership.</p>
          </div>
        </div>
      </section>

      <section class="glass-card">
        <h2 style="margin-top:0;">Job List</h2>
        <div id="jobsList" class="table"></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="jobModal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 style="margin:0;">Edit Job</h2>
        <button class="modal-close" id="closeJobModalBtn">Close</button>
      </div>

      <div class="form-grid">
        <input id="jobCustomerName" placeholder="Customer Name">
        <input id="jobCustomerPhone" placeholder="Customer Phone">
        <input id="jobCustomerEmail" placeholder="Customer Email">
        <input id="jobAddress" placeholder="Address">
        <input id="jobCity" placeholder="City">

        <select id="jobState">
          <option value="">State</option>
          <option value="AL">Alabama</option>
          <option value="AK">Alaska</option>
          <option value="AZ">Arizona</option>
          <option value="AR">Arkansas</option>
          <option value="CA">California</option>
          <option value="CO">Colorado</option>
          <option value="CT">Connecticut</option>
          <option value="DE">Delaware</option>
          <option value="FL">Florida</option>
          <option value="GA">Georgia</option>
          <option value="HI">Hawaii</option>
          <option value="ID">Idaho</option>
          <option value="IL">Illinois</option>
          <option value="IN">Indiana</option>
          <option value="IA">Iowa</option>
          <option value="KS">Kansas</option>
          <option value="KY">Kentucky</option>
          <option value="LA">Louisiana</option>
          <option value="ME">Maine</option>
          <option value="MD">Maryland</option>
          <option value="MA">Massachusetts</option>
          <option value="MI">Michigan</option>
          <option value="MN">Minnesota</option>
          <option value="MS">Mississippi</option>
          <option value="MO">Missouri</option>
          <option value="MT">Montana</option>
          <option value="NE">Nebraska</option>
          <option value="NV">Nevada</option>
          <option value="NH">New Hampshire</option>
          <option value="NJ">New Jersey</option>
          <option value="NM">New Mexico</option>
          <option value="NY">New York</option>
          <option value="NC">North Carolina</option>
          <option value="ND">North Dakota</option>
          <option value="OH">Ohio</option>
          <option value="OK">Oklahoma</option>
          <option value="OR">Oregon</option>
          <option value="PA">Pennsylvania</option>
          <option value="RI">Rhode Island</option>
          <option value="SC">South Carolina</option>
          <option value="SD">South Dakota</option>
          <option value="TN">Tennessee</option>
          <option value="TX">Texas</option>
          <option value="UT">Utah</option>
          <option value="VT">Vermont</option>
          <option value="VA">Virginia</option>
          <option value="WA">Washington</option>
          <option value="WV">West Virginia</option>
          <option value="WI">Wisconsin</option>
          <option value="WY">Wyoming</option>
        </select>

        <input id="jobZip" placeholder="Zip">
        <input id="jobServiceType" placeholder="Service Type">

        <select id="jobAssignedTechnician">
          <option value="">Assigned Technician</option>
        </select>

        <input id="jobScheduledDate" type="date">

        <select id="jobScheduledTimeWindow">
          <option value="">Time Window</option>
          <option value="8am-10am">8am - 10am</option>
          <option value="10am-12pm">10am - 12pm</option>
          <option value="12pm-2pm">12pm - 2pm</option>
          <option value="2pm-4pm">2pm - 4pm</option>
          <option value="4pm-6pm">4pm - 6pm</option>
        </select>

        <input id="jobEstimatedSqFt" type="number" placeholder="Estimated Sq Ft">
        <input id="jobEstimatedPrice" type="number" placeholder="Estimated Price">

        <select id="jobStatus">
          <option value="scheduled">Scheduled</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <textarea id="jobNotes" class="notes-field" placeholder="Notes"></textarea>

      <div class="stack">
        <button class="btn" id="saveJobBtn">Save Job</button>
      </div>

      <p id="jobMsg" class="status-text"></p>
    </div>
  </div>

  <script type="module" src="/evaraos/assets/js/users.js"></script>
</body>
</html>
