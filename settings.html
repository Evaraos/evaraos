<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Settings • Evaraos Inc</title>

  <link rel="stylesheet" href="/evaraos/assets/css/styles.css" />
</head>
<body class="dashboard-body">

  <div class="page-grid-overlay"></div>
  <div id="universalNav"></div>

  <div class="dashboard-shell">

    <main class="dashboard-main">

      <section class="dashboard-hero glass-card aurora-card">
        <div class="dashboard-hero-copy">
          <h1>System Settings</h1>
          <p>Manage theme, preferences, and system-level configurations.</p>
        </div>
      </section>

      <!-- THEME SETTINGS -->
      <section class="dashboard-panel glass-card aurora-card">
        <h2>Theme</h2>

        <div class="settings-grid">

          <button class="btn btn-theme-primary" data-theme-select="light">
            Light Mode
          </button>

          <button class="btn btn-theme-primary" data-theme-select="dark">
            Dark Mode
          </button>

          <button class="btn btn-theme-secondary" data-theme-select="system">
            System Default
          </button>

        </div>
      </section>

      <!-- ACCOUNT -->
      <section class="dashboard-panel glass-card aurora-card">
        <h2>Account</h2>

        <div class="settings-grid">
          <a href="/evaraos/profile.html" class="btn btn-theme-secondary">Edit Profile</a>
          <a href="/evaraos/security.html" class="btn btn-theme-secondary">Security</a>
        </div>
      </section>

    </main>

  </div>

  <script type="module" src="/evaraos/assets/js/settings.js"></script>
  <script type="module" src="/evaraos/assets/js/theme.js"></script>
  <script type="module" src="/evaraos/assets/js/nav.js"></script>
  <script type="module" src="/evaraos/assets/js/firebase.js"></script>

</body>
</html>
