  <title>Performance • Evaraos Inc</title>

  <script src="/assets/js/adaptive-appearance-boot.js?v=1"></script>
  <script>document.documentElement.classList.add("auth-pending");</script>

  <style>

    html[data-theme="galaxy"],
    html[data-theme="galaxy"] body { background: #050311; }

    html.boot-pending body {
      margin: 0;
      overflow: hidden;
      touch-action: none;
    }

    html.auth-pending body,
    body.auth-pending {
      opacity: 0;
      pointer-events: none;
    }

    body.dashboard-body {
      margin: 0;
      min-height: 100vh;
      background: transparent;
    }

    body.app-loading #appRoot { visibility: hidden; }
    body.app-ready #appRoot { visibility: visible; }

    .legacy-page-wrap {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: var(--eva-page-top-space) 0 56px;
      position: relative;
      z-index: 2;
    }

    .legacy-title-row,
    .section-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      flex-wrap: wrap;
    }

    .legacy-kicker {
      margin: 0 0 8px;
      color: var(--theme-primary, #ff2f57);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .legacy-title {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.5rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    .legacy-copy,
    .muted {
      color: var(--text-muted, rgba(255,255,255,0.68));
      line-height: 1.65;
    }

    .legacy-copy {
      margin: 14px 0 0;
      max-width: 760px;
    }

    .content-root {
      display: grid;
      gap: 18px;
      margin-top: 18px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted, rgba(255,255,255,0.68));
      font-size: 13px;
      font-weight: 800;
    }

    .field input,
    .field select {
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
      color: var(--text-primary, #fff);
      padding: 13px 14px;
      outline: none;
    }

    .field input::placeholder {
      color: rgba(255,255,255,0.42);
    }

    .field select option {
      color: #111;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .quick-links-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .quick-link-card,
    .card {
      border-radius: 22px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
      color: var(--text-primary, #fff);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    @media (max-width: 960px) {
      .grid-3,
      .quick-links-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .legacy-page-wrap {
        width: min(100% - 20px, 1220px);
        padding-top: var(--eva-page-top-space-compact);
      }

      .form-grid,
      .grid-3,
      .quick-links-grid {
        grid-template-columns: 1fr;
      }

      .top-actions {
        justify-content: flex-start;
      }
    }
  </style>

  <link rel="stylesheet" href="/assets/css/base.css?v=53" />

    <div class="page-aurora"></div>

    <main class="legacy-page-wrap">
      <section class="glass-card aurora-card active-glow beam-target">
        <div class="legacy-title-row">
          <div>
            <p class="legacy-kicker">PERFORMANCE CENTER</p>
            <h1 class="legacy-title">Performance</h1>
            <p class="legacy-copy">
              Review team performance, productivity visibility, role-based output,
              lead conversion, job completion, and tracked revenue.
            </p>
          </div>

          <a href="/sales_reps.html" class="btn btn-theme-secondary beam-target">Open Sales Reps</a>
        </div>
      </section>

      <main id="performanceRoot" class="content-root">
        <section class="glass-card aurora-card active-glow beam-target">
          Loading performance...
        </section>
      </main>
    </main>
  </div>
