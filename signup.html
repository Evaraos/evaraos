<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign Up • Evaraos Inc</title>
  <link rel="stylesheet" href="/evaraos/assets/css/styles.css" />
</head>
<body class="signup-page">
  <div class="page-grid-overlay"></div>
  <div id="universalNav"></div>

  <main class="login-shell">
    <section class="login-panel glass-card aurora-card">
      <div class="login-badge-wrap">
        <img
          src="/evaraos/assets/img/evaraos_logo.png"
          alt="Evaraos logo"
          class="login-badge"
        />
      </div>

      <h1 class="login-title">Create Account</h1>
      <p class="login-subtitle">
        Create your secure Evaraos account and start building inside the platform.
      </p>

      <form id="signupForm" class="login-form" novalidate>
        <div class="form-grid-2">
          <div class="form-group">
            <label class="field-label" for="signupName">Full Name</label>
            <div class="input-shell aurora-card">
              <input
                id="signupName"
                name="name"
                type="text"
                class="input"
                placeholder="Enter your full name"
                autocomplete="name"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="field-label" for="signupEmail">Email</label>
            <div class="input-shell aurora-card">
              <input
                id="signupEmail"
                name="email"
                type="email"
                class="input"
                placeholder="Enter your email"
                autocomplete="email"
                required
              />
            </div>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label class="field-label" for="signupPassword">Create Password</label>
            <div class="password-wrap input-shell aurora-card">
              <input
                id="signupPassword"
                name="password"
                type="password"
                class="input"
                placeholder="Create your password"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                id="signupPasswordToggle"
                aria-label="Show password"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5c5.5 0 9.5 5.1 10.7 6.9.2.3.2.8 0 1.1C21.5 14.9 17.5 20 12 20S2.5 14.9 1.3 13.1a1 1 0 0 1 0-1.1C2.5 10.1 6.5 5 12 5Zm0 2C8 7 4.8 10.3 3.4 12 4.8 13.7 8 17 12 17s7.2-3.3 8.6-5C19.2 10.3 16 7 12 7Zm0 1.8A3.2 3.2 0 1 1 8.8 12 3.2 3.2 0 0 1 12 8.8Zm0 2A1.2 1.2 0 1 0 13.2 12 1.2 1.2 0 0 0 12 10.8Z"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="field-label" for="signupPasswordConfirm">Confirm Password</label>
            <div class="password-wrap input-shell aurora-card">
              <input
                id="signupPasswordConfirm"
                name="passwordConfirm"
                type="password"
                class="input"
                placeholder="Re-enter your password"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                id="signupPasswordConfirmToggle"
                aria-label="Show password confirmation"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5c5.5 0 9.5 5.1 10.7 6.9.2.3.2.8 0 1.1C21.5 14.9 17.5 20 12 20S2.5 14.9 1.3 13.1a1 1 0 0 1 0-1.1C2.5 10.1 6.5 5 12 5Zm0 2C8 7 4.8 10.3 3.4 12 4.8 13.7 8 17 12 17s7.2-3.3 8.6-5C19.2 10.3 16 7 12 7Zm0 1.8A3.2 3.2 0 1 1 8.8 12 3.2 3.2 0 0 1 12 8.8Zm0 2A1.2 1.2 0 1 0 13.2 12 1.2 1.2 0 0 0 12 10.8Z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="remember-row aurora-card">
          <label class="remember-check" for="signupRememberDevice">
            <input id="signupRememberDevice" name="rememberDevice" type="checkbox" checked />
            <span>Remember this device</span>
          </label>
        </div>

        <div class="login-actions-row">
          <button type="submit" class="btn btn-theme-primary">Create Account</button>
          <a href="/evaraos/login.html" class="btn btn-theme-secondary">Already Have Login</a>
        </div>

        <p id="signupMessage" class="login-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script type="module">
    import {
      auth,
      createUserWithEmailAndPassword,
      updateProfile,
      setAuthPersistence,
      saveUserRole,
      syncUserSession,
      protectRoute
    } from "/evaraos/assets/js/firebase.js";

    protectRoute({
      requireAuth: false,
      redirectAuthedTo: "/evaraos/dashboard.html"
    });

    const form = document.getElementById("signupForm");
    const nameInput = document.getElementById("signupName");
    const emailInput = document.getElementById("signupEmail");
    const passwordInput = document.getElementById("signupPassword");
    const passwordConfirmInput = document.getElementById("signupPasswordConfirm");
    const rememberDeviceInput = document.getElementById("signupRememberDevice");
    const messageEl = document.getElementById("signupMessage");

    const passwordToggle = document.getElementById("signupPasswordToggle");
    const passwordConfirmToggle = document.getElementById("signupPasswordConfirmToggle");

    function setMessage(message = "") {
      if (messageEl) messageEl.textContent = message;
    }

    function togglePasswordVisibility(input, button, showLabel, hideLabel) {
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";
      button.setAttribute("aria-label", isPassword ? hideLabel : showLabel);
      button.classList.add("active-glow");
      setTimeout(() => button.classList.remove("active-glow"), 220);
    }

    passwordToggle?.addEventListener("click", () => {
      togglePasswordVisibility(
        passwordInput,
        passwordToggle,
        "Show password",
        "Hide password"
      );
    });

    passwordConfirmToggle?.addEventListener("click", () => {
      togglePasswordVisibility(
        passwordConfirmInput,
        passwordConfirmToggle,
        "Show password confirmation",
        "Hide password confirmation"
      );
    });

    form?.addEventListener("submit", async (event) => {
      event.preventDefault();
      setMessage("");

      const fullName = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = passwordConfirmInput.value;
      const rememberDevice = Boolean(rememberDeviceInput?.checked);

      if (!fullName || !email || !password || !confirmPassword) {
        setMessage("Please complete every field.");
        return;
      }

      if (password.length < 6) {
        setMessage("Password must be at least 6 characters.");
        return;
      }

      if (password !== confirmPassword) {
        setMessage("Passwords do not match.");
        return;
      }

      try {
        await setAuthPersistence(rememberDevice);

        const credential = await createUserWithEmailAndPassword(auth, email, password);

        await updateProfile(credential.user, {
          displayName: fullName
        });

        saveUserRole("owner");
        syncUserSession(
          {
            ...credential.user,
            displayName: fullName
          },
          "owner"
        );

        window.location.href = "/evaraos/dashboard.html";
      } catch (error) {
        console.error("Signup failed:", error);

        switch (error.code) {
          case "auth/email-already-in-use":
            setMessage("That email is already in use.");
            break;
          case "auth/invalid-email":
            setMessage("That email format is invalid.");
            break;
          case "auth/weak-password":
            setMessage("Use a stronger password.");
            break;
          default:
            setMessage("Unable to create account right now. Please try again.");
            break;
        }
      }
    });
  </script>

  <script type="module" src="/evaraos/assets/js/theme.js"></script>
  <script type="module" src="/evaraos/assets/js/nav.js"></script>
  <script type="module" src="/evaraos/assets/js/firebase.js"></script>
</body>
</html>
