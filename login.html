  <script>
    (function () {
      try {
        var raw = localStorage.getItem("evaraos-appearance");
        var theme = "light";

        if (raw) {
          var appearance = JSON.parse(raw);

          if (appearance.mode === "light") theme = "light";
          else if (appearance.mode === "galaxy") theme = "galaxy";
          else if (appearance.mode === "custom") {
            if (appearance.baseFamily === "light") theme = "light";
            else if (appearance.baseFamily === "galaxy") theme = "galaxy";
            else theme = "dark";
          }
        }

        document.documentElement.setAttribute("data-theme", theme);
      } catch {
        document.documentElement.setAttribute("data-theme", "light");
      }

      document.documentElement.classList.add("boot-pending", "auth-pending");
    })();
  </script>

<style id="evaDotHitPadAutoCloseTune">
  :root {
    /* dot hair smaller + hair right from last tune */
    --eva-hard-dot-size-final: 36px !important;
    --eva-hard-dot-logo-final: 28px !important;
    --eva-hard-dot-left-final: calc(50% - 82px) !important;
  }

  /* Kill default button/card look on the tap pad */
  #evaHardDotTapPad {
    appearance: none !important;
    -webkit-appearance: none !important;

    border: 0 !important;
    outline: 0 !important;
    box-shadow: none !important;

    color: transparent !important;
    font-size: 0 !important;
    line-height: 0 !important;

    /*
      This is the invisible vertical pill hit area:
      same width as the dot, taller length so the PWA can tap it
      below the Dynamic Island blocked zone.
    */
    width: var(--eva-hard-dot-size-final) !important;
    height: 92px !important;

    left: var(--eva-hard-dot-left-final) !important;
    top: var(--eva-hard-dot-top-final) !important;

    transform: translate(-50%, -6px) !important;
    border-radius: 999px !important;

    background: rgba(0, 0, 0, 0.001) !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;

    opacity: 1 !important;
    overflow: hidden !important;

    touch-action: manipulation !important;
    -webkit-tap-highlight-color: transparent !important;
  }

  #evaHardDotTapPad::before,
  #evaHardDotTapPad::after {
    display: none !important;
    content: none !important;
  }

  body.eva-hard-compact #evaHardDotTapPad {
    display: block !important;
    pointer-events: auto !important;
  }

  body.eva-hard-expanded #evaHardDotTapPad,
  body.eva-hard-menu-open #evaHardDotTapPad {
    display: none !important;
    pointer-events: none !important;
  }

  /* PWA standalone gets a little more touch length, still invisible */
  @media (display-mode: standalone) {
    #evaHardDotTapPad {
      height: 104px !important;
      transform: translate(-50%, -4px) !important;
      background: rgba(0, 0, 0, 0.001) !important;
    }
  }

  @media (max-width: 430px) {
    :root {
      --eva-hard-dot-size-final: 36px !important;
      --eva-hard-dot-logo-final: 28px !important;
      --eva-hard-dot-left-final: calc(50% - 82px) !important;
    }
  }

  @media (max-width: 390px) {
    :root {
      --eva-hard-dot-size-final: 35px !important;
      --eva-hard-dot-logo-final: 27px !important;
      --eva-hard-dot-left-final: calc(50% - 77px) !important;
    }
  }
</style>

<script id="evaDotHitPadAutoCloseTuneScript">
(function () {
  var evaHardAutoCloseTimer = null;
  var evaHardLastScrollY = window.scrollY || 0;

  function isExpandedOnly() {
    return document.body.classList.contains("eva-hard-expanded") &&
      !document.body.classList.contains("eva-hard-menu-open");
  }

  function hardCompact() {
    clearTimeout(evaHardAutoCloseTimer);
    evaHardAutoCloseTimer = null;

    document.body.classList.remove("eva-hard-expanded", "eva-hard-menu-open");
    document.body.classList.add("eva-hard-compact");
  }

  function hardExpand() {
    document.body.classList.remove("eva-hard-compact", "eva-hard-menu-open");
    document.body.classList.add("eva-hard-expanded");
    startAutoCloseTimer();
  }

  function hardMenuOpen() {
    clearTimeout(evaHardAutoCloseTimer);
    evaHardAutoCloseTimer = null;

    document.body.classList.remove("eva-hard-compact");
    document.body.classList.add("eva-hard-expanded", "eva-hard-menu-open");
  }

  function startAutoCloseTimer() {
    clearTimeout(evaHardAutoCloseTimer);

    if (!isExpandedOnly()) return;

    evaHardAutoCloseTimer = setTimeout(function () {
      if (isExpandedOnly()) hardCompact();
    }, 4000);
  }

  function resetAutoCloseTimer() {
    if (isExpandedOnly()) startAutoCloseTimer();
  }

  function installFinalBehavior() {
    var nav = document.getElementById("evaHardNav");
    var menuBtn = document.querySelector(".eva-hard-menu-btn");
    var backdrop = document.querySelector(".eva-hard-backdrop");
    var tapPad = document.getElementById("evaHardDotTapPad");

    if (!nav) return;

    /* Replace previous click behavior with stronger final behavior */
    if (nav.dataset.autoCloseFinalBound !== "true") {
      nav.dataset.autoCloseFinalBound = "true";

      nav.addEventListener("click", function (event) {
        if (event.target.closest(".eva-hard-menu-btn, .eva-hard-theme")) return;

        event.preventDefault();
        event.stopPropagation();

        if (document.body.classList.contains("eva-hard-compact")) {
          hardExpand();
        } else {
          hardCompact();
        }
      }, true);

      nav.addEventListener("pointerdown", resetAutoCloseTimer, true);
      nav.addEventListener("touchstart", resetAutoCloseTimer, { passive: true, capture: true });
      nav.addEventListener("mousemove", resetAutoCloseTimer, true);
    }

    if (tapPad && tapPad.dataset.autoCloseTapPadBound !== "true") {
      tapPad.dataset.autoCloseTapPadBound = "true";

      tapPad.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        hardExpand();
      }, true);

      tapPad.addEventListener("touchstart", function (event) {
        event.stopPropagation();
      }, { passive: true, capture: true });
    }

    if (menuBtn && menuBtn.dataset.autoCloseMenuFinalBound !== "true") {
      menuBtn.dataset.autoCloseMenuFinalBound = "true";

      menuBtn.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();

        if (document.body.classList.contains("eva-hard-menu-open")) {
          hardCompact();
        } else {
          hardMenuOpen();
        }
      }, true);
    }

    if (backdrop && backdrop.dataset.autoCloseBackdropFinalBound !== "true") {
      backdrop.dataset.autoCloseBackdropFinalBound = "true";

      backdrop.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        hardCompact();
      }, true);
    }
  }

  function bindScrollClose() {
    if (window.evaHardScrollCloseBound === true) return;
    window.evaHardScrollCloseBound = true;

    window.addEventListener("scroll", function () {
      var y = window.scrollY || 0;
      var delta = Math.abs(y - evaHardLastScrollY);
      evaHardLastScrollY = y;

      if (delta < 2) return;

      if (
        document.body.classList.contains("eva-hard-expanded") ||
        document.body.classList.contains("eva-hard-menu-open")
      ) {
        hardCompact();
      }
    }, { passive: true });

    window.addEventListener("wheel", function () {
      if (
        document.body.classList.contains("eva-hard-expanded") ||
        document.body.classList.contains("eva-hard-menu-open")
      ) {
        hardCompact();
      }
    }, { passive: true });

    window.addEventListener("touchmove", function () {
      if (
        document.body.classList.contains("eva-hard-expanded") ||
        document.body.classList.contains("eva-hard-menu-open")
      ) {
        hardCompact();
      }
    }, { passive: true });
  }

  function boot() {
    installFinalBehavior();
    bindScrollClose();

    setTimeout(installFinalBehavior, 300);
    setTimeout(installFinalBehavior, 1000);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})();
</script>

  body.eva-hard-menu-open .eva-hard-nav {
    top: auto !important;
    bottom: var(--eva-bottom-pill-bottom) !important;
    left: 50% !important;

    width: min(calc(100vw - 18px), 1080px) !important;
    height: var(--eva-bottom-pill-height) !important;
    min-height: var(--eva-bottom-pill-height) !important;
    max-height: var(--eva-bottom-pill-height) !important;

    transform: translateX(-50%) scale(1) !important;
    border-radius: 999px !important;

    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.98), transparent 35%),
      radial-gradient(circle at 82% 105%, rgba(216,0,32,.10), transparent 35%),
      linear-gradient(180deg, rgba(255,255,255,.92), rgba(244,247,249,.76)) !important;

    border: 1px solid rgba(255,255,255,.96) !important;

    box-shadow:
      0 18px 42px rgba(0,0,0,.20),
      0 7px 18px rgba(0,0,0,.12),
      inset 0 1px 0 rgba(255,255,255,1),
      inset 0 -1px 0 rgba(0,0,0,.06) !important;

    overflow: hidden !important;

    backdrop-filter: blur(28px) saturate(190%) !important;
    -webkit-backdrop-filter: blur(28px) saturate(190%) !important;

    animation: evaBottomPillSnapOpen .46s cubic-bezier(.2,.95,.2,1) both !important;
  }

  @keyframes evaBottomPillSnapOpen {
    0% {
      transform: translateX(-50%) translateY(12px) scale(.90);
      border-radius: 999px;
    }
    68% {
      transform: translateX(-50%) translateY(-2px) scale(1.012);
    }
    100% {
      transform: translateX(-50%) translateY(0) scale(1);
    }
  }

  body.eva-hard-expanded .eva-hard-nav::before,
  body.eva-hard-menu-open .eva-hard-nav::before {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: inherit;
    pointer-events: none;
    z-index: 1;

    background:
      linear-gradient(135deg, rgba(255,255,255,.74), transparent 34%, rgba(255,255,255,.18)),
      radial-gradient(circle at 78% 92%, rgba(0,0,0,.07), transparent 40%) !important;
  }

  body.eva-hard-expanded .eva-hard-nav::after,
  body.eva-hard-menu-open .eva-hard-nav::after {
    content: "";
    position: absolute;
    left: -30%;
    top: 4px;
    width: 35%;
    height: 18px;
    border-radius: 999px;
    pointer-events: none;
    z-index: 2;

    background:
      linear-gradient(90deg, transparent, rgba(255,255,255,.52), transparent);

    transform: rotate(-12deg);
    animation: evaSafariBarSheen 5s ease-in-out infinite;
  }

  @keyframes evaSafariBarSheen {
    0%, 30% { left: -35%; opacity: 0; }
    42% { opacity: .62; }
    62% { left: 96%; opacity: .14; }
    100% { left: 96%; opacity: 0; }
  }

  body.eva-hard-expanded .eva-hard-brand,
  body.eva-hard-menu-open .eva-hard-brand {
    z-index: 5 !important;
  }

  body.eva-hard-expanded .eva-hard-actions,
  body.eva-hard-menu-open .eva-hard-actions {
    z-index: 6 !important;
  }

  /* =========================================================
     MENU PANEL NOW OPENS ABOVE THE BOTTOM NAV
     ========================================================= */

  .eva-hard-panel {
    top: auto !important;
    bottom: var(--eva-bottom-panel-bottom) !important;

    max-height: min(64vh, calc(100dvh - 170px)) !important;

    transform: translateX(-50%) translateY(10px) scale(.985) !important;
    transform-origin: bottom center !important;

    border-radius: 34px !important;
  }

  body.eva-hard-menu-open .eva-hard-panel {
    transform: translateX(-50%) translateY(0) scale(1) !important;
  }

  /* Keep backdrop clean behind bottom menu */
  body.eva-hard-menu-open .eva-hard-backdrop {
    background:
      radial-gradient(circle at 18% 100%, rgba(216,0,32,.10), transparent 30%),
      rgba(0,0,0,.28) !important;
  }

  /* Mobile tuning */
  @media (max-width: 430px) {
    :root {
      --eva-bottom-dot-size: 38px;
      --eva-bottom-dot-logo: 29px;
      --eva-bottom-dot-left: max(17px, env(safe-area-inset-left, 0px) + 17px);
      --eva-bottom-dot-bottom: max(16px, calc(env(safe-area-inset-bottom, 0px) + 16px));
      --eva-bottom-pill-bottom: max(12px, calc(env(safe-area-inset-bottom, 0px) + 12px));
      --eva-bottom-panel-bottom: max(82px, calc(env(safe-area-inset-bottom, 0px) + 82px));
    }
  }

  @media (max-width: 390px) {
    :root {
      --eva-bottom-dot-size: 36px;
      --eva-bottom-dot-logo: 27px;
      --eva-bottom-dot-left: max(15px, env(safe-area-inset-left, 0px) + 15px);
      --eva-bottom-panel-bottom: max(80px, calc(env(safe-area-inset-bottom, 0px) + 80px));
    }
  }
</style>

<script id="evaBottomDotNavTuneScript">
(function () {
  var autoCloseTimer = null;
  var lastScrollY = window.scrollY || 0;

  function compact() {
    clearTimeout(autoCloseTimer);
    autoCloseTimer = null;
    document.body.classList.remove("eva-hard-expanded", "eva-hard-menu-open");
    document.body.classList.add("eva-hard-compact");
  }

  function expand() {
    document.body.classList.remove("eva-hard-compact", "eva-hard-menu-open");
    document.body.classList.add("eva-hard-expanded");
    startAutoClose();
  }

  function openMenu() {
    clearTimeout(autoCloseTimer);
    autoCloseTimer = null;
    document.body.classList.remove("eva-hard-compact");
    document.body.classList.add("eva-hard-expanded", "eva-hard-menu-open");
  }

  function isExpandedOnly() {
    return document.body.classList.contains("eva-hard-expanded") &&
      !document.body.classList.contains("eva-hard-menu-open");
  }

  function startAutoClose() {
    clearTimeout(autoCloseTimer);
    if (!isExpandedOnly()) return;

    autoCloseTimer = setTimeout(function () {
      if (isExpandedOnly()) compact();
    }, 4000);
  }

  function resetAutoClose() {
    if (isExpandedOnly()) startAutoClose();
  }

  function bindBottomNav() {
    var nav = document.getElementById("evaHardNav");
    var menuBtn = document.querySelector(".eva-hard-menu-btn");
    var backdrop = document.querySelector(".eva-hard-backdrop");
    var tapPad = document.getElementById("evaHardDotTapPad");

    if (!nav) return;

    if (nav.dataset.bottomDotBound !== "true") {
      nav.dataset.bottomDotBound = "true";

      nav.addEventListener("click", function (event) {
        if (event.target.closest(".eva-hard-menu-btn, .eva-hard-theme")) return;

        event.preventDefault();
        event.stopPropagation();

        if (document.body.classList.contains("eva-hard-compact")) {
          expand();
        } else {
          compact();
        }
      }, true);

      nav.addEventListener("pointerdown", resetAutoClose, true);
      nav.addEventListener("mousemove", resetAutoClose, true);
      nav.addEventListener("touchstart", resetAutoClose, { passive: true, capture: true });
    }

    if (tapPad && tapPad.dataset.bottomDotPadBound !== "true") {
      tapPad.dataset.bottomDotPadBound = "true";

      tapPad.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        expand();
      }, true);

      tapPad.addEventListener("touchstart", function (event) {
        event.stopPropagation();
      }, { passive: true, capture: true });
    }

    if (menuBtn && menuBtn.dataset.bottomDotMenuBound !== "true") {
      menuBtn.dataset.bottomDotMenuBound = "true";

      menuBtn.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();

        if (document.body.classList.contains("eva-hard-menu-open")) {
          compact();
        } else {
          openMenu();
        }
      }, true);
    }

    if (backdrop && backdrop.dataset.bottomDotBackdropBound !== "true") {
      backdrop.dataset.bottomDotBackdropBound = "true";

      backdrop.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        compact();
      }, true);
    }
  }

  function bindScrollClose() {
    if (window.evaBottomDotScrollCloseBound === true) return;
    window.evaBottomDotScrollCloseBound = true;

    window.addEventListener("scroll", function () {
      var y = window.scrollY || 0;
      var delta = Math.abs(y - lastScrollY);
      lastScrollY = y;

      if (delta < 2) return;

      if (
        document.body.classList.contains("eva-hard-expanded") ||
        document.body.classList.contains("eva-hard-menu-open")
      ) {
        compact();
      }
    }, { passive: true });

    window.addEventListener("touchmove", function () {
      if (
        document.body.classList.contains("eva-hard-expanded") ||
        document.body.classList.contains("eva-hard-menu-open")
      ) {
        compact();
      }
    }, { passive: true });

    window.addEventListener("wheel", function () {
      if (
        document.body.classList.contains("eva-hard-expanded") ||
        document.body.classList.contains("eva-hard-menu-open")
      ) {
        compact();
      }
    }, { passive: true });
  }

  function boot() {
    bindBottomNav();
    bindScrollClose();

    setTimeout(bindBottomNav, 300);
    setTimeout(bindBottomNav, 1000);
    setTimeout(bindBottomNav, 1800);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})();
</script>
<!-- /EVARAOS BOTTOM DOT NAV + ABOVE DROPDOWN TUNE -->
