<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Login • Evaraos Inc</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>

<body class="app-theme">

  <!-- NAV -->
  <header class="landing-header">
    <div class="landing-header-inner">
      <a href="./index.html" class="brand-link">
        <img src="./assets/img/evaraos_logo.png" class="brand-logo" />
        <div class="brand-copy">
          <strong>Evaraos Inc</strong>
          <span>Subsidiaries Allocation SaaS</span>
        </div>
      </a>

      <nav class="landing-nav">
        <a href="./index.html" class="nav-pill">Home</a>
        <a href="./login.html" class="nav-pill active">Login</a>
      </nav>
    </div>
  </header>

  <!-- LOGIN -->
  <main class="login-shell">

    <section class="login-panel glass-card">

      <img src="./assets/img/evaraos_logo.png" class="login-badge" />

      <h1 class="login-title">Welcome Back</h1>
      <p class="login-subtitle">Login with your email, username, or @handle</p>

      <form id="loginForm" class="login-form">

        <label>Username</label>
        <input
          id="username"
          class="input login-input"
          placeholder="Email, username, or @handle"
          required
        />

        <label>Password</label>
        <div class="password-wrap">
          <input
            id="password"
            type="password"
            class="input login-input"
            placeholder="Password"
            required
          />

          <button type="button" id="togglePasswordBtn" class="password-toggle">
            <svg id="passwordIconOpen" viewBox="0 0 24 24">
              <path d="M12 5c5 0 9 4 10 6-1 2-5 6-10 6S3 13 2 11c1-2 5-6 10-6z"/>
            </svg>

            <svg id="passwordIconClosed" viewBox="0 0 24 24" style="display:none;">
              <path d="M3 3l18 18"/>
            </svg>
          </button>
        </div>

        <div class="login-actions">
          <button type="submit" class="btn-primary">Login</button>
          <button type="button" id="openResetBtn" class="link-btn">Forgot password?</button>
        </div>

        <p id="loginMessage" class="error-text"></p>
      </form>
    </section>

    <!-- RESET -->
    <section id="resetPanel" class="reset-panel hidden">

      <h2>Reset Password</h2>

      <form id="resetForm">
        <input id="resetEmail" placeholder="Account Email" required />
        <button type="submit">Send Reset Email</button>
        <p id="resetMessage"></p>
      </form>

      <button id="closeResetBtn">Close</button>
    </section>

  </main>

  <script type="module" src="./assets/js/auth.js"></script>
</body>
</html>
