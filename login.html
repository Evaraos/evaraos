<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaraos Access</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-body">

  <div class="auth-shell-wrap">
    <div class="auth-tabs">
      <button id="loginTab" class="auth-tab active" onclick="showAuthTab('login')">Login</button>
      <button id="signupTab" class="auth-tab" onclick="showAuthTab('signup')">Sign Up</button>
    </div>

    <div class="auth-box">

      <div id="loginPanel">
        <img src="assets/img/evaraos_logo.png" class="auth-logo" alt="Evaraos logo">
        <h2 style="text-align:center;margin:0 0 8px;">Welcome Back</h2>
        <p class="auth-subtext">Login to access Evaraos Inc</p>

        <input id="loginEmail" type="email" placeholder="Email">

        <div class="password-wrap">
          <input id="loginPassword" type="password" placeholder="Password">
          <button class="eye-toggle" type="button" onclick="togglePassword('loginPassword', this)">👁</button>
        </div>

        <div class="action-row">
          <button class="btn" onclick="loginUser()">Login</button>
          <button class="btn secondary" onclick="forgotPassword()">Forgot Password</button>
        </div>

        <p id="loginMsg" class="auth-msg"></p>
      </div>

      <div id="signupPanel" style="display:none;">
        <img src="assets/img/evaraos_logo.png" class="auth-logo" alt="Evaraos logo">
        <h2 style="text-align:center;margin:0 0 8px;">Create Account</h2>
        <p class="auth-subtext">Join the Evaraos platform</p>

        <input id="signupName" type="text" placeholder="Full Name">
        <input id="signupUsername" type="text" placeholder="Username (must be unique)">
        <input id="signupEmail" type="email" placeholder="Email">

        <div class="password-wrap">
          <input id="signupPassword" type="password" placeholder="Password">
          <button class="eye-toggle" type="button" onclick="togglePassword('signupPassword', this)">👁</button>
        </div>

        <div class="password-wrap">
          <input id="signupPasswordConfirm" type="password" placeholder="Confirm Password">
          <button class="eye-toggle" type="button" onclick="togglePassword('signupPasswordConfirm', this)">👁</button>
        </div>

        <select id="signupRole">
          <option value="customer">Customer</option>
          <option value="sales_rep">Sales Rep</option>
          <option value="technician">Technician</option>
          <option value="manager">Manager</option>
          <option value="operations_coordinator">Operations Coordinator</option>
          <option value="hr">HR</option>
          <option value="admin">Admin</option>
        </select>

        <button class="btn" onclick="signupUser()">Create Account</button>
        <p class="auth-subtext" style="text-align:left;">
          Staff signups require approval by an Admin or Super Admin before access is granted.
        </p>
        <p id="signupMsg" class="auth-msg"></p>
      </div>

    </div>
  </div>

  <script type="module">
    import { signup as createAccount, login as loginAccount, getCurrentUserDoc, resetPassword } from "./assets/auth.js";
    import { auth } from "./assets/firebase.js";

    function getDashboardPath(role) {
      return role === "customer" ? "customer_dashboard.html" : "dashboard.html";
    }

    window.togglePassword = function(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";
      btn.textContent = isPassword ? "🙈" : "👁";
    };

    window.showAuthTab = function(tab) {
      const loginPanel = document.getElementById("loginPanel");
      const signupPanel = document.getElementById("signupPanel");
      const loginTab = document.getElementById("loginTab");
      const signupTab = document.getElementById("signupTab");

      if (tab === "login") {
        loginPanel.style.display = "block";
        signupPanel.style.display = "none";
        loginTab.classList.add("active");
        signupTab.classList.remove("active");
      } else {
        loginPanel.style.display = "none";
        signupPanel.style.display = "block";
        loginTab.classList.remove("active");
        signupTab.classList.add("active");
      }
    };

    window.loginUser = async function() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const msg = document.getElementById("loginMsg");

      msg.textContent = "";

      if (!email || !password) {
        msg.textContent = "Enter your email and password.";
        return;
      }

      try {
        await loginAccount(email, password);
        const user = auth.currentUser;
        const userDoc = await getCurrentUserDoc(user);

        if (!userDoc) {
          msg.textContent = "No user profile found.";
          return;
        }

        window.location.href = getDashboardPath(userDoc.role);
      } catch (e) {
        msg.textContent = e.message || "Login failed.";
      }
    };

    window.forgotPassword = async function() {
      const email = document.getElementById("loginEmail").value.trim();
      const msg = document.getElementById("loginMsg");

      if (!email) {
        msg.textContent = "Enter your email first, then tap Forgot Password.";
        return;
      }

      try {
        await resetPassword(email);
        msg.textContent = "Password reset email sent.";
      } catch (e) {
        msg.textContent = e.message || "Could not send reset email.";
      }
    };

    window.signupUser = async function() {
      const name = document.getElementById("signupName").value.trim();
      const username = document.getElementById("signupUsername").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value;
      const passwordConfirm = document.getElementById("signupPasswordConfirm").value;
      const role = document.getElementById("signupRole").value;
      const msg = document.getElementById("signupMsg");

      msg.textContent = "";

      if (!name || !username || !email || !password || !passwordConfirm || !role) {
        msg.textContent = "Complete all sign up fields.";
        return;
      }

      if (password !== passwordConfirm) {
        msg.textContent = "Passwords do not match.";
        return;
      }

      try {
        await createAccount(name, username, email, password, role);
        msg.textContent = role === "customer"
          ? "Account created successfully."
          : "Staff account created and sent for approval.";

        setTimeout(() => {
          showAuthTab("login");
          document.getElementById("loginEmail").value = email;
          document.getElementById("loginPassword").value = "";
        }, 900);
      } catch (e) {
        msg.textContent = e.message || "Sign up failed.";
      }
    };
  </script>

</body>
</html>
