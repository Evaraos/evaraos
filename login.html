<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Login • Evaraos Inc</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body class="login-page">
  <header class="landing-header">
    <div class="landing-header-inner">
      <a href="./index.html" class="brand-link no-underline">
        <img src="./assets/img/evaraos_logo.png" alt="Evaraos logo" class="brand-logo" />
        <div class="brand-copy">
          <strong>Evaraos Inc</strong>
          <span>Subsidiaries Allocation SaaS</span>
        </div>
      </a>

      <nav class="landing-nav">
        <a href="./index.html" class="nav-pill no-underline">Home</a>
        <a href="./login.html" class="nav-pill active no-underline">Login</a>
      </nav>
    </div>
  </header>

  <main class="login-shell">
    <section class="login-panel glass">
      <div class="login-badge-wrap">
        <img src="./assets/img/evaraos_logo.png" alt="Evaraos" class="login-badge" />
      </div>

      <h1>Welcome Back</h1>
      <p class="login-subtitle">Login with your username or @handle</p>

      <form id="loginForm" class="login-form">
        <label class="sr-only" for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          class="input login-input"
          placeholder="Username or @handle"
          autocomplete="username"
          required
        />

        <label class="sr-only" for="password">Password</label>
        <div class="password-wrap">
          <input
            id="password"
            name="password"
            type="password"
            class="input login-input"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
          <button type="button" id="togglePasswordBtn" class="password-toggle" aria-label="Toggle password">
            👁️
          </button>
        </div>

        <div class="login-meta-row">
          <button type="submit" class="btn primary no-underline">Login</button>
          <button type="button" id="openResetBtn" class="text-link-btn">Forgot password?</button>
        </div>

        <p id="loginMessage" class="login-message muted"></p>
      </form>
    </section>

    <section id="resetPanel" class="reset-panel glass hidden">
      <div class="section-title-row">
        <h2 style="margin:0;">Reset Password</h2>
        <button type="button" id="closeResetBtn" class="btn secondary">Close</button>
      </div>

      <form id="resetForm" class="login-form" style="margin-top:16px;">
        <input
          id="resetEmail"
          type="email"
          class="input login-input"
          placeholder="Account Email"
          autocomplete="email"
          required
        />
        <button type="submit" class="btn secondary">Send Reset Email</button>
        <p id="resetMessage" class="login-message muted"></p>
      </form>
    </section>
  </main>

  <script type="module" src="./assets/js/auth.js"></script>
</body>
</html>
