<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaraos Access</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .forgot-link-wrap{
      text-align:right;
      margin:-4px 0 12px;
    }
    .forgot-link{
      background:none;
      border:none;
      color:#f5f7fb;
      cursor:pointer;
      padding:0;
      font:inherit;
      text-decoration:underline;
      text-underline-offset:3px;
    }
    .forgot-link.glow{
      animation:forgotGlow .55s ease;
    }
    @keyframes forgotGlow{
      0%{text-shadow:0 0 0 rgba(227,6,19,0);}
      50%{text-shadow:0 0 18px rgba(227,6,19,.85);}
      100%{text-shadow:0 0 0 rgba(227,6,19,0);}
    }
    .username-feedback{
      margin:8px 0 10px;
      color:#b8c0d0;
      font-size:13px;
      min-height:20px;
    }
    .suggestions-wrap{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:6px 0 12px;
    }
    .suggestion-chip{
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.05);
      color:#fff;
      border-radius:999px;
      padding:8px 12px;
      cursor:pointer;
      font-size:13px;
    }
    .suggestion-chip:hover{
      background:rgba(255,255,255,.10);
    }
  </style>
</head>
<body class="auth-page">

  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html">
        <img src="assets/img/evaraos_logo.png" alt="logo">
        <div class="brand-text">
          <strong>Evaraos Inc</strong>
          <span>Subsidiaries Allocation SaaS</span>
        </div>
      </a>

      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="login.html" class="active">Login</a>
      </nav>
    </div>
  </header>

  <div class="auth-center">
    <div class="auth-shell-wrap">
      <div class="auth-tabs">
        <button id="loginTab" class="auth-tab active" onclick="showAuthTab('login')">Login</button>
        <button id="signupTab" class="auth-tab" onclick="showAuthTab('signup')">Sign Up</button>
      </div>

      <div class="auth-box">

        <div id="loginPanel">
          <img src="assets/img/evaraos_logo.png" class="auth-logo" alt="Evaraos logo">
          <h2 style="text-align:center;margin:0 0 8px;">Welcome Back</h2>
          <p class="auth-subtext">Login with your username or @handle</p>

          <input id="loginUsername" type="text" placeholder="Username or @handle">

          <div class="password-wrap">
            <input id="loginPassword" type="password" placeholder="Password">
            <button class="eye-toggle" type="button" onclick="togglePassword('loginPassword', this)">👁</button>
          </div>

          <div class="forgot-link-wrap">
            <button id="forgotPasswordLink" class="forgot-link" type="button">Forgot password?</button>
          </div>

          <div class="action-row">
            <button class="btn" onclick="loginUser()">Login</button>
          </div>

          <p id="loginMsg" class="auth-msg"></p>
        </div>

        <div id="signupPanel" style="display:none;">
          <img src="assets/img/evaraos_logo.png" class="auth-logo" alt="Evaraos logo">
          <h2 style="text-align:center;margin:0 0 8px;">Create Account</h2>
          <p class="auth-subtext">Choose your @handle</p>

          <input id="signupName" type="text" placeholder="Full Name">
          <input id="signupUsername" type="text" placeholder="Username">

          <div id="usernameFeedback" class="username-feedback"></div>
          <div id="usernameSuggestions" class="suggestions-wrap"></div>

          <input id="signupEmail" type="email" placeholder="Email">

          <div class="password-wrap">
            <input id="signupPassword" type="password" placeholder="Password">
            <button class="eye-toggle" type="button" onclick="togglePassword('signupPassword', this)">👁</button>
          </div>

          <div class="password-wrap">
            <input id="signupPasswordConfirm" type="password" placeholder="Confirm Password">
            <button class="eye-toggle" type="button" onclick="togglePassword('signupPasswordConfirm', this)">👁</button>
          </div>

          <select id="signupRole">
            <option value="customer">Customer</option>
            <option value="sales_rep">Sales Rep</option>
            <option value="technician">Technician</option>
            <option value="manager">Manager</option>
            <option value="operations_coordinator">Operations Coordinator</option>
            <option value="hr">HR</option>
            <option value="admin">Admin</option>
          </select>

          <button class="btn" onclick="signupUser()">Create Account</button>

          <p class="auth-subtext" style="text-align:left;">
            Staff accounts require admin or super admin approval before access is granted.
          </p>

          <p id="signupMsg" class="auth-msg"></p>
        </div>

      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="forgotModal">
    <div class="modal-card" style="max-width:520px;">
      <div class="modal-head">
        <h2 style="margin:0;">Reset Password</h2>
        <button class="modal-close" id="closeForgotModalBtn">Close</button>
      </div>

      <input id="resetEmail" type="email" placeholder="Account Email">
      <button class="btn" id="sendResetBtn">Send Reset Email</button>
      <p id="forgotMsg" class="status-text"></p>
    </div>
  </div>

  <script type="module">
    import {
      signup as createAccount,
      loginWithUsername,
      getCurrentUserDoc,
      resetPassword,
      usernameExists,
      generateUsernameSuggestions,
      normalizeUsernameInput,
      buildUserIdentity
    } from "./assets/auth.js";
    import { auth } from "./assets/firebase.js";

    function getDashboardPath(role) {
      return role === "customer" ? "customer_dashboard.html" : "dashboard.html";
    }

    function openModal(id) {
      document.getElementById(id).classList.add("active");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("active");
    }

    function renderSuggestions(items) {
      const root = document.getElementById("usernameSuggestions");
      root.innerHTML = items.map((item) => `
        <button type="button" class="suggestion-chip" data-username="${item.username}">
          ${item.handle}
        </button>
      `).join("");

      root.querySelectorAll(".suggestion-chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.getElementById("signupUsername").value = btn.dataset.username;
          document.getElementById("usernameFeedback").textContent = `Selected ${"@" + btn.dataset.username}`;
          root.innerHTML = "";
        });
      });
    }

    async function checkUsernameLive() {
      const raw = document.getElementById("signupUsername").value;
      const clean = normalizeUsernameInput(raw);
      const feedback = document.getElementById("usernameFeedback");
      const suggestionsRoot = document.getElementById("usernameSuggestions");

      if (!clean) {
        feedback.textContent = "";
        suggestionsRoot.innerHTML = "";
        return;
      }

      const identity = buildUserIdentity(clean);

      if (identity.username.length < 3) {
        feedback.textContent = "Username must be at least 3 characters.";
        suggestionsRoot.innerHTML = "";
        return;
      }

      const taken = await usernameExists(identity.username);

      if (!taken) {
        feedback.textContent = `${identity.handle} is available`;
        suggestionsRoot.innerHTML = "";
        return;
      }

      feedback.textContent = `${identity.handle} is already taken`;
      const suggestions = await generateUsernameSuggestions(identity.username);
      renderSuggestions(suggestions);
    }

    window.togglePassword = function(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";
      btn.textContent = isPassword ? "🙈" : "👁";
    };

    window.showAuthTab = function(tab) {
      const loginPanel = document.getElementById("loginPanel");
      const signupPanel = document.getElementById("signupPanel");
      const loginTab = document.getElementById("loginTab");
      const signupTab = document.getElementById("signupTab");

      if (tab === "login") {
        loginPanel.style.display = "block";
        signupPanel.style.display = "none";
        loginTab.classList.add("active");
        signupTab.classList.remove("active");
      } else {
        loginPanel.style.display = "none";
        signupPanel.style.display = "block";
        loginTab.classList.remove("active");
        signupTab.classList.add("active");
      }
    };

    window.loginUser = async function() {
      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value;
      const msg = document.getElementById("loginMsg");

      msg.textContent = "";

      if (!username || !password) {
        msg.textContent = "Enter your username and password.";
        return;
      }

      try {
        await loginWithUsername(username, password);
        const user = auth.currentUser;
        const userDoc = await getCurrentUserDoc(user);

        if (!userDoc) {
          msg.textContent = "No user profile found.";
          return;
        }

        window.location.href = getDashboardPath(userDoc.role);
      } catch (e) {
        msg.textContent = e.message || "Login failed.";
      }
    };

    window.signupUser = async function() {
      const name = document.getElementById("signupName").value.trim();
      const username = document.getElementById("signupUsername").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value;
      const passwordConfirm = document.getElementById("signupPasswordConfirm").value;
      const role = document.getElementById("signupRole").value;
      const msg = document.getElementById("signupMsg");

      msg.textContent = "";

      if (!name || !username || !email || !password || !passwordConfirm) {
        msg.textContent = "Complete all fields.";
        return;
      }

      if (password !== passwordConfirm) {
        msg.textContent = "Passwords do not match.";
        return;
      }

      try {
        await createAccount(name, username, email, password, role);
        const identity = buildUserIdentity(username);

        msg.textContent = role === "customer"
          ? `Account created successfully as ${identity.handle}.`
          : `Account pending admin approval as ${identity.handle}.`;

        setTimeout(() => showAuthTab("login"), 900);
      } catch (e) {
        msg.textContent = e.message || "Signup failed.";
      }
    };

    const forgotLink = document.getElementById("forgotPasswordLink");
    forgotLink.addEventListener("click", () => {
      forgotLink.classList.remove("glow");
      void forgotLink.offsetWidth;
      forgotLink.classList.add("glow");
      openModal("forgotModal");
    });

    document.getElementById("closeForgotModalBtn").addEventListener("click", () => {
      closeModal("forgotModal");
    });

    document.getElementById("sendResetBtn").addEventListener("click", async () => {
      const email = document.getElementById("resetEmail").value.trim();
      const msg = document.getElementById("forgotMsg");

      msg.textContent = "";

      if (!email) {
        msg.textContent = "Enter your account email.";
        return;
      }

      try {
        await resetPassword(email);
        msg.textContent = "Password reset email sent.";
      } catch (e) {
        msg.textContent = e.message || "Error sending reset email.";
      }
    });

    document.getElementById("signupUsername").addEventListener("input", checkUsernameLive);
  </script>

</body>
</html>
