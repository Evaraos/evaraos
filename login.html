<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Login • Evaraos Inc</title>
  <link rel="stylesheet" href="/evaraos/assets/css/styles.css" />
</head>
<body class="login-page">
  <div class="page-grid-overlay"></div>
  <div id="universalNav"></div>

  <main class="login-shell">
    <section class="login-panel glass-card aurora-card">
      <div class="login-badge-wrap">
        <img
          src="/evaraos/assets/img/evaraos_logo.png"
          alt="Evaraos logo"
          class="login-badge"
        />
      </div>

      <h1 class="login-title">Welcome Back</h1>
      <p class="login-subtitle">
        Sign in to access your Evaraos control center, companies, leads, jobs, and platform tools.
      </p>

      <form id="loginForm" class="login-form" novalidate>
        <div class="form-grid-2">
          <div class="form-group">
            <label class="field-label" for="loginEmail">Email</label>
            <div class="input-shell aurora-card">
              <input
                id="loginEmail"
                name="email"
                type="email"
                class="input"
                placeholder="Enter your email"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="field-label" for="loginPassword">Password</label>
            <div class="password-wrap input-shell aurora-card">
              <input
                id="loginPassword"
                name="password"
                type="password"
                class="input"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                id="loginPasswordToggle"
                aria-label="Show password"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5c5.5 0 9.5 5.1 10.7 6.9.2.3.2.8 0 1.1C21.5 14.9 17.5 20 12 20S2.5 14.9 1.3 13.1a1 1 0 0 1 0-1.1C2.5 10.1 6.5 5 12 5Zm0 2C8 7 4.8 10.3 3.4 12 4.8 13.7 8 17 12 17s7.2-3.3 8.6-5C19.2 10.3 16 7 12 7Zm0 1.8A3.2 3.2 0 1 1 8.8 12 3.2 3.2 0 0 1 12 8.8Zm0 2A1.2 1.2 0 1 0 13.2 12 1.2 1.2 0 0 0 12 10.8Z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="remember-row aurora-card">
          <label class="remember-check" for="rememberDevice">
            <input id="rememberDevice" name="rememberDevice" type="checkbox" checked />
            <span>Remember this device</span>
          </label>
        </div>

        <div class="login-actions-row">
          <button type="submit" class="btn btn-theme-primary">Login</button>
          <a href="/evaraos/reset.html" class="btn btn-theme-secondary">Forgot Password</a>
        </div>

        <p id="loginMessage" class="login-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script type="module">
    import {
      auth,
      signInWithEmailAndPassword,
      setAuthPersistence,
      syncUserSession,
      protectRoute
    } from "/evaraos/assets/js/firebase.js";

    protectRoute({
      requireAuth: false,
      redirectAuthedTo: "/evaraos/dashboard.html"
    });

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("loginEmail");
    const passwordInput = document.getElementById("loginPassword");
    const rememberDeviceInput = document.getElementById("rememberDevice");
    const messageEl = document.getElementById("loginMessage");
    const toggleBtn = document.getElementById("loginPasswordToggle");

    function setMessage(message = "") {
      if (messageEl) messageEl.textContent = message;
    }

    function togglePasswordVisibility(input, button) {
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";
      button.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
      button.classList.add("active-glow");
      setTimeout(() => button.classList.remove("active-glow"), 220);
    }

    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener("click", () => {
        togglePasswordVisibility(passwordInput, toggleBtn);
      });
    }

    form?.addEventListener("submit", async (event) => {
      event.preventDefault();
      setMessage("");

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const rememberDevice = Boolean(rememberDeviceInput?.checked);

      if (!email || !password) {
        setMessage("Please enter your email and password.");
        return;
      }

      try {
        await setAuthPersistence(rememberDevice);
        const credential = await signInWithEmailAndPassword(auth, email, password);
        syncUserSession(credential.user);
        window.location.href = "/evaraos/dashboard.html";
      } catch (error) {
        console.error("Login failed:", error);

        switch (error.code) {
          case "auth/invalid-email":
            setMessage("That email format is invalid.");
            break;
          case "auth/user-not-found":
          case "auth/wrong-password":
          case "auth/invalid-credential":
            setMessage("Incorrect email or password.");
            break;
          case "auth/too-many-requests":
            setMessage("Too many attempts. Try again in a bit.");
            break;
          default:
            setMessage("Unable to sign in right now. Please try again.");
            break;
        }
      }
    });
  </script>

  <script type="module" src="/evaraos/assets/js/theme.js"></script>
  <script type="module" src="/evaraos/assets/js/nav.js"></script>
  <script type="module" src="/evaraos/assets/js/firebase.js"></script>
</body>
</html>
