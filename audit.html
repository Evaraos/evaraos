<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit | Evaraos</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header id="topbar"></header>
  <div id="sidebar" style="display:none;"></div>

  <main class="page-container">
    <section class="glass-card">
      <div class="section-title-row">
        <div>
          <h1 style="margin:0;">Audit Logs</h1>
          <p class="muted" style="margin:10px 0 0;">
            Track org changes, roll back recent moves, monitor suspicious activity, and export logs.
          </p>
        </div>
        <div class="top-actions">
          <button class="btn secondary" id="exportCsvBtn">Export CSV</button>
          <button class="btn" id="refreshAuditBtn">Refresh</button>
        </div>
      </div>

      <div class="form-grid" style="margin-top:18px;">
        <div class="field">
          <label for="auditSearchInput">Search</label>
          <input id="auditSearchInput" type="text" placeholder="Search actor, target, company, role, note..." />
        </div>

        <div class="field">
          <label for="auditActionFilter">Action Filter</label>
          <select id="auditActionFilter">
            <option value="all">All Actions</option>
            <option value="role_drag_move">Role Change</option>
            <option value="company_drag_move">Company Move</option>
            <option value="company_and_role_drag_move">Company + Role Move</option>
            <option value="company_drag_move_keep_role">Company Move Keep Role</option>
            <option value="modal_user_edit">Manual Edit</option>
            <option value="modal_role_edit">Manual Role Edit</option>
            <option value="modal_company_edit">Manual Company Edit</option>
            <option value="modal_company_and_role_edit">Manual Company + Role Edit</option>
            <option value="rollback_change">Rollback Change</option>
          </select>
        </div>
      </div>
    </section>

    <section class="glass-card" style="margin-top:18px;">
      <div class="section-title-row">
        <h2 style="margin:0;">Audit Analytics</h2>
      </div>
      <div id="auditAnalyticsRoot" style="margin-top:16px;">Loading analytics...</div>
    </section>

    <section class="glass-card" style="margin-top:18px;">
      <div class="section-title-row">
        <h2 style="margin:0;">Suspicious Activity</h2>
      </div>
      <div id="auditSuspiciousRoot" style="margin-top:16px;">Checking suspicious activity...</div>
    </section>

    <section class="glass-card" style="margin-top:18px;">
      <div class="section-title-row">
        <h2 style="margin:0;">Audit Feed</h2>
        <div class="muted" id="auditCountLabel">0 logs</div>
      </div>

      <div class="top-actions" style="margin-top:14px;">
        <span class="chip">Live feed every 20s</span>
      </div>

      <div id="auditRoot" style="margin-top:16px;">
        Loading audit logs...
      </div>
    </section>
  </main>

  <script type="module" src="assets/audit.js"></script>
</body>
</html>
