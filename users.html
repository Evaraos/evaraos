<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users | Evaraos</title>
  <link rel="stylesheet" href="/evaraos/assets/css/styles.css" />
</head>
<body class="app-shell app-theme">
  <div class="app-bg">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-grid"></div>
  </div>

  <header id="topbar" class="topbar"></header>

  <div class="page-shell">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="main-content">
      <section class="glass-card aurora-card shine-border">
        <div class="section-title-row">
          <div>
            <h1 style="margin:0;">Users</h1>
            <p class="muted" style="margin:8px 0 0;">
              Manage internal users, status, approval state, reporting lines, and role assignment.
            </p>
          </div>
        </div>
      </section>

      <main id="usersRoot" class="content-root"></main>
    </main>
  </div>

  <div class="modal-backdrop" id="userModal">
    <div class="modal-card aurora-card shine-border">
      <div class="section-title-row">
        <h2 id="userModalTitle" style="margin:0;">Edit User</h2>
        <button class="btn secondary" id="userModalCloseBtn" type="button">Close</button>
      </div>

      <form id="userForm">
        <section class="form-section">
          <h3 class="form-section-title">Identity</h3>
          <div class="form-grid">
            <div class="field">
              <label for="editUserName">Full Name</label>
              <input id="editUserName" />
            </div>

            <div class="field">
              <label for="editUserEmail">Email</label>
              <input id="editUserEmail" type="email" />
            </div>

            <div class="field">
              <label for="editUserPhone">Phone</label>
              <input id="editUserPhone" />
            </div>

            <div class="field full">
              <label for="editUserReportsTo">Reports To</label>
              <input id="editUserReportsTo" />
            </div>
          </div>
        </section>

        <section class="form-section">
          <h3 class="form-section-title">Role & Approval</h3>
          <div class="form-grid">
            <div class="field">
              <label for="editUserRole">Role</label>
              <select id="editUserRole">
                <option value="super_admin">Super Admin</option>
                <option value="admin">Admin</option>
                <option value="manager">Manager</option>
                <option value="operations_coordinator">Operations Coordinator</option>
                <option value="sales_rep">Sales Rep</option>
                <option value="technician">Technician</option>
                <option value="hr">HR</option>
                <option value="customer">Customer</option>
              </select>
            </div>

            <div class="field">
              <label for="editUserStatus">Status</label>
              <select id="editUserStatus">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>

            <div class="field">
              <label for="editUserApproval">Approval</label>
              <select id="editUserApproval">
                <option value="approved">Approved</option>
                <option value="pending">Pending</option>
                <option value="denied">Denied</option>
              </select>
            </div>
          </div>
        </section>

        <div class="top-actions" style="margin-top:18px;">
          <button class="btn" type="submit">Save User</button>
          <button class="btn secondary" id="userModalCancelBtn" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/evaraos/assets/js/users.js"></script>
</body>
</html>
