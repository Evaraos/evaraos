<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leads | Evaraos</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header id="topbar"></header>
  <div id="sidebar" style="display:none;"></div>
  <main id="leadsRoot"></main>

  <div class="modal-backdrop" id="leadModal">
    <div class="modal-card">
      <div class="section-row">
        <h2 id="leadModalTitle" style="margin:0;">Add Lead</h2>
        <button class="btn secondary" id="leadModalCloseBtn" type="button">Close</button>
      </div>

      <form id="leadForm">
        <div class="form-grid">
          <div class="field">
            <label for="leadFullName">Full Name</label>
            <input id="leadFullName" required />
          </div>

          <div class="field">
            <label for="leadPhone">Phone</label>
            <input id="leadPhone" />
          </div>

          <div class="field">
            <label for="leadEmail">Email</label>
            <input id="leadEmail" type="email" />
          </div>

          <div class="field">
            <label for="leadAssignedRep">Assigned Rep</label>
            <select id="leadAssignedRep"></select>
          </div>

          <div class="field full">
            <label for="leadAddress">Address</label>
            <input id="leadAddress" />
          </div>

          <div class="field">
            <label for="leadCity">City</label>
            <input id="leadCity" />
          </div>

          <div class="field">
            <label for="leadState">State</label>
            <input id="leadState" />
          </div>

          <div class="field">
            <label for="leadZip">Zip</label>
            <input id="leadZip" />
          </div>

          <div class="field">
            <label for="leadCategory">Service Category</label>
            <select id="leadCategory"></select>
          </div>

          <div class="field">
            <label for="leadServiceType">Service Type</label>
            <select id="leadServiceType"></select>
          </div>

          <div class="field">
            <label for="leadEstimatedSqFt">Estimated Sq Ft / Quantity</label>
            <input id="leadEstimatedSqFt" type="number" min="0" step="1" />
          </div>

          <div class="field">
            <label for="leadStatus">Status</label>
            <select id="leadStatus">
              <option value="new">New</option>
              <option value="contacted">Contacted</option>
              <option value="quoted">Quoted</option>
              <option value="scheduled">Booked</option>
              <option value="won">Won</option>
              <option value="lost">Lost</option>
            </select>
          </div>

          <div class="field">
            <label for="leadLeadSource">Lead Source</label>
            <select id="leadLeadSource">
              <option value="">Select source</option>
              <option value="website">Website</option>
              <option value="door_to_door">Door to Door</option>
              <option value="referral">Referral</option>
              <option value="phone">Phone</option>
              <option value="manual">Manual</option>
            </select>
          </div>

          <div class="field">
            <label for="leadContactMethod">Preferred Contact</label>
            <select id="leadContactMethod">
              <option value="">Select method</option>
              <option value="call">Call</option>
              <option value="text">Text</option>
              <option value="email">Email</option>
            </select>
          </div>

          <div class="field">
            <label for="leadAppointmentDate">Appointment Date</label>
            <input id="leadAppointmentDate" type="date" />
          </div>

          <div class="field full">
            <label>Add-ons</label>
            <div class="checkbox-grid" id="leadAddOnsWrap"></div>
          </div>

          <div class="field full">
            <label for="leadNotes">Notes</label>
            <textarea id="leadNotes" rows="4"></textarea>
          </div>

          <div class="field full">
            <div id="leadEstimatePreview" class="muted">Estimated price: $0.00</div>
          </div>
        </div>

        <div class="top-actions" style="margin-top:18px;">
          <button class="btn" type="submit">Save Lead</button>
          <button class="btn secondary" id="leadModalCancelBtn" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="convertModal">
    <div class="modal-card">
      <div class="section-row">
        <h2 style="margin:0;">Convert Lead to Job</h2>
        <button class="btn secondary" id="convertModalCloseBtn" type="button">Close</button>
      </div>

      <form id="convertForm">
        <input id="convertLeadId" type="hidden" />

        <div class="form-grid">
          <div class="field">
            <label for="convertTechnician">Technician</label>
            <select id="convertTechnician"></select>
          </div>

          <div class="field">
            <label for="convertScheduledDate">Scheduled Date</label>
            <input id="convertScheduledDate" type="date" />
          </div>

          <div class="field">
            <label for="convertTimeWindow">Time Window</label>
            <input id="convertTimeWindow" placeholder="8am–12pm" />
          </div>

          <div class="field full">
            <label for="convertNotes">Job Notes</label>
            <textarea id="convertNotes" rows="4"></textarea>
          </div>
        </div>

        <div class="top-actions" style="margin-top:18px;">
          <button class="btn" type="submit">Create Job</button>
          <button class="btn secondary" id="convertModalCancelBtn" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="assets/leads.js"></script>
</body>
</html>
