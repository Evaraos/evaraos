<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leads - Evaraos Inc</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .pipeline-list{
      display:grid;
      gap:16px;
    }
    .pipeline-card{
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      border-radius:24px;
      padding:18px;
    }
    .pipeline-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      margin-bottom:14px;
      flex-wrap:wrap;
    }
    .pipeline-name{
      margin:0;
      font-size:18px;
      line-height:1.2;
    }
    .pipeline-sub{
      color:#b8c0d0;
      font-size:14px;
      margin-top:6px;
      line-height:1.5;
    }
    .badge-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }
    .status-badge{
      display:inline-flex;
      align-items:center;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.06);
      color:#fff;
    }
    .status-new{ background:rgba(59,130,246,.18); }
    .status-contacted{ background:rgba(168,85,247,.18); }
    .status-quoted{ background:rgba(245,158,11,.18); }
    .status-scheduled{ background:rgba(34,197,94,.18); }
    .status-won{ background:rgba(16,185,129,.18); }
    .status-lost{ background:rgba(239,68,68,.18); }
    .status-archived{ background:rgba(148,163,184,.18); }

    .pipeline-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
      margin-top:12px;
    }
    .pipeline-box{
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
      border-radius:18px;
      padding:14px;
      min-height:110px;
    }
    .pipeline-label{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:#8fa0bb;
      margin-bottom:8px;
    }
    .pipeline-value{
      color:#fff;
      font-size:14px;
      line-height:1.6;
      word-break:break-word;
    }
    .identity-chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      font-size:12px;
      color:#fff;
      margin:4px 8px 0 0;
    }
    .pipeline-actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:16px;
    }
    .meta-line{
      color:#9fb0c9;
      font-size:12px;
      margin-top:12px;
      line-height:1.6;
    }
    @media (max-width: 1100px){
      .pipeline-grid{
        grid-template-columns:repeat(2,1fr);
      }
    }
    @media (max-width: 700px){
      .pipeline-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body class="app-shell">
  <header class="app-topbar" id="topbar"></header>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-panel">
      <section class="glass-card">
        <div class="action-row" style="justify-content:space-between;align-items:center;">
          <div>
            <h1 style="margin:0;">Leads Module</h1>
            <p class="muted" style="margin:8px 0 0;">Create, edit, archive, request deletion, and convert leads into jobs.</p>
          </div>
          <button class="btn" id="openLeadModalBtn">Add Lead</button>
        </div>
      </section>

      <section class="glass-card">
        <h2 style="margin-top:0;">Lead Pipeline</h2>
        <div id="leadsList" class="pipeline-list"></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="leadModal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 style="margin:0;">Create / Edit Lead</h2>
        <button class="modal-close" id="closeLeadModalBtn">Close</button>
      </div>

      <div class="form-grid">
        <input id="leadFullName" placeholder="Full Name">
        <input id="leadPhone" placeholder="Phone">
        <input id="leadEmail" placeholder="Email">
        <input id="leadAddress" placeholder="Address">
        <input id="leadCity" placeholder="City">

        <select id="leadState">
          <option value="">State</option>
          <option value="AL">Alabama</option>
          <option value="AK">Alaska</option>
          <option value="AZ">Arizona</option>
          <option value="AR">Arkansas</option>
          <option value="CA">California</option>
          <option value="CO">Colorado</option>
          <option value="CT">Connecticut</option>
          <option value="DE">Delaware</option>
          <option value="FL">Florida</option>
          <option value="GA">Georgia</option>
          <option value="HI">Hawaii</option>
          <option value="ID">Idaho</option>
          <option value="IL">Illinois</option>
          <option value="IN">Indiana</option>
          <option value="IA">Iowa</option>
          <option value="KS">Kansas</option>
          <option value="KY">Kentucky</option>
          <option value="LA">Louisiana</option>
          <option value="ME">Maine</option>
          <option value="MD">Maryland</option>
          <option value="MA">Massachusetts</option>
          <option value="MI">Michigan</option>
          <option value="MN">Minnesota</option>
          <option value="MS">Mississippi</option>
          <option value="MO">Missouri</option>
          <option value="MT">Montana</option>
          <option value="NE">Nebraska</option>
          <option value="NV">Nevada</option>
          <option value="NH">New Hampshire</option>
          <option value="NJ">New Jersey</option>
          <option value="NM">New Mexico</option>
          <option value="NY">New York</option>
          <option value="NC">North Carolina</option>
          <option value="ND">North Dakota</option>
          <option value="OH">Ohio</option>
          <option value="OK">Oklahoma</option>
          <option value="OR">Oregon</option>
          <option value="PA">Pennsylvania</option>
          <option value="RI">Rhode Island</option>
          <option value="SC">South Carolina</option>
          <option value="SD">South Dakota</option>
          <option value="TN">Tennessee</option>
          <option value="TX">Texas</option>
          <option value="UT">Utah</option>
          <option value="VT">Vermont</option>
          <option value="VA">Virginia</option>
          <option value="WA">Washington</option>
          <option value="WV">West Virginia</option>
          <option value="WI">Wisconsin</option>
          <option value="WY">Wyoming</option>
        </select>

        <input id="leadZip" placeholder="Zip">

        <select id="leadServiceCategory">
          <option value="">Service Category</option>
          <option value="exterior">Exterior Cleaning</option>
          <option value="trash_bin">Trash Bin Cleaning</option>
          <option value="bundle">Bundle</option>
        </select>

        <select id="leadServiceType">
          <option value="">Select Service</option>
        </select>

        <select id="leadAddOns" multiple>
          <option value="deodorizing">Deodorizing</option>
          <option value="rust_removal">Rust Removal</option>
          <option value="oil_stain_removal">Oil Stain Removal</option>
          <option value="mold_treatment">Mold Treatment</option>
          <option value="sealing">Sealing</option>
        </select>

        <select id="leadLeadSource">
          <option value="">Lead Source</option>
          <option value="website">🌐 Website</option>
          <option value="referral">🤝 Referral</option>
          <option value="door_to_door">🚪 Door to Door</option>
          <option value="facebook">📘 Facebook</option>
          <option value="instagram">📸 Instagram</option>
          <option value="x_twitter">🐦 X / Twitter</option>
          <option value="tiktok">🎵 TikTok</option>
          <option value="google">🔎 Google</option>
          <option value="yelp">⭐ Yelp</option>
          <option value="phone_call">📞 Phone Call</option>
          <option value="other">➕ Other</option>
        </select>

        <select id="leadPreferredContactMethod">
          <option value="">Preferred Contact Method</option>
          <option value="call">Call</option>
          <option value="text">Text</option>
          <option value="email">Email</option>
        </select>

        <input id="leadEstimatedSqFt" type="number" placeholder="Estimated Sq Ft / Panels / Quantity">
        <input id="leadEstimatedPrice" placeholder="Estimated Price" disabled>

        <select id="leadAssignedRep">
          <option value="">Assigned Sales Rep</option>
        </select>

        <select id="leadStatus">
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="quoted">Quoted</option>
          <option value="scheduled">Scheduled</option>
          <option value="won">Won</option>
          <option value="lost">Lost</option>
        </select>

        <input id="leadAppointmentDate" type="date">
      </div>

      <textarea id="leadNotes" class="notes-field" placeholder="Notes"></textarea>

      <div class="stack">
        <button class="btn" id="saveLeadBtn">Save Lead</button>
        <button class="btn secondary" id="cancelLeadEditBtn" style="display:none;">Cancel Edit</button>
      </div>

      <p id="leadMsg" class="status-text"></p>
    </div>
  </div>

  <div class="modal-backdrop" id="convertModal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 style="margin:0;">Convert Lead to Job</h2>
        <button class="modal-close" id="closeConvertModalBtn">Close</button>
      </div>

      <div class="form-grid">
        <input id="convertCustomerName" placeholder="Customer Name" disabled>
        <input id="convertServiceType" placeholder="Service Type">

        <select id="convertAssignedTechnician">
          <option value="">Assigned Technician</option>
        </select>

        <input id="convertScheduledDate" type="date">

        <select id="convertScheduledTimeWindow">
          <option value="">Time Window</option>
          <option value="8am-10am">8am - 10am</option>
          <option value="10am-12pm">10am - 12pm</option>
          <option value="12pm-2pm">12pm - 2pm</option>
          <option value="2pm-4pm">2pm - 4pm</option>
          <option value="4pm-6pm">4pm - 6pm</option>
        </select>
      </div>

      <textarea id="convertNotes" class="notes-field" placeholder="Job Notes"></textarea>

      <div class="stack">
        <button class="btn" id="confirmConvertBtn">Create Job</button>
      </div>

      <p id="convertMsg" class="status-text"></p>
    </div>
  </div>

  <script type="module" src="assets/leads.js"></script>
</body>
</html>
