<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Reps | Evaraos</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header id="topbar"></header>
  <div id="sidebar" style="display:none;"></div>
  <main id="salesRepsRoot"></main>

  <div class="modal-backdrop" id="repModal">
    <div class="modal-card">
      <div class="section-title-row">
        <h2 id="repModalTitle" style="margin:0;">Add Sales Rep</h2>
        <button class="btn secondary" id="repModalCloseBtn" type="button">Close</button>
      </div>

      <form id="repForm">
        <div class="form-grid">
          <div class="field">
            <label for="repFullName">Full Name</label>
            <input id="repFullName" required />
          </div>

          <div class="field">
            <label for="repUsername">Username</label>
            <input id="repUsername" required />
          </div>

          <div class="field">
            <label for="repEmail">Email</label>
            <input id="repEmail" type="email" />
          </div>

          <div class="field">
            <label for="repPhone">Phone</label>
            <input id="repPhone" />
          </div>

          <div class="field">
            <label for="repStatus">Status</label>
            <select id="repStatus">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>

          <div class="field full">
            <label for="repNotes">Notes</label>
            <textarea id="repNotes" rows="4"></textarea>
          </div>
        </div>

        <div class="top-actions" style="margin-top:18px;">
          <button class="btn" type="submit">Save Sales Rep</button>
          <button class="btn secondary" id="repModalCancelBtn" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="assets/sales_reps.js"></script>
</body>
</html>
