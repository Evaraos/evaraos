<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Evaraos App Identity / PWA / Favicons -->
  <link rel="manifest" href="/manifest.json" />

  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/icon-192.png" />
  <link rel="shortcut icon" href="/favicon.ico" />

  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />

  <meta name="theme-color" content="#f4f7f6" />
  <meta name="msapplication-TileColor" content="#f4f7f6" />
  <meta name="msapplication-TileImage" content="/assets/img/icon-192.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Evaraos" />
  <meta name="application-name" content="Evaraos" />

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="https://www.gstatic.com" />
  <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
  <link rel="preload" as="image" href="/assets/img/evaraos_logo.png" />

  <title>Sales Reps • Evaraos Inc</title>

  <script>
    (function () {
      try {
        var raw = localStorage.getItem("evaraos-appearance");
        var theme = "light";

        if (raw) {
          var appearance = JSON.parse(raw);

          if (appearance.mode === "light") theme = "light";
          else if (appearance.mode === "galaxy") theme = "galaxy";
          else if (appearance.mode === "custom") {
            if (appearance.baseFamily === "light") theme = "light";
            else if (appearance.baseFamily === "galaxy") theme = "galaxy";
            else theme = "dark";
          }
        }

        document.documentElement.setAttribute("data-theme", theme);
      } catch {
        document.documentElement.setAttribute("data-theme", "light");
      }

      document.documentElement.classList.add("boot-pending", "auth-pending");
    })();
  </script>

  <style>
    html,
    body { background: #f4f7f6; }

    html[data-theme="light"],
    html[data-theme="light"] body { background: #f4f7f6; }

    html[data-theme="galaxy"],
    html[data-theme="galaxy"] body { background: #050311; }

    html.boot-pending body {
      margin: 0;
      overflow: hidden;
      touch-action: none;
    }

    html.auth-pending body,
    body.auth-pending {
      opacity: 0;
      pointer-events: none;
    }

    body.dashboard-body {
      margin: 0;
      min-height: 100vh;
      background: transparent;
    }

    body.app-loading #appRoot { visibility: hidden; }
    body.app-ready #appRoot { visibility: visible; }

    .legacy-page-wrap {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 132px 0 56px;
      position: relative;
      z-index: 2;
    }

    .legacy-title-row,
    .section-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      flex-wrap: wrap;
    }

    .legacy-kicker {
      margin: 0 0 8px;
      color: var(--theme-primary, #ff2f57);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .legacy-title {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.5rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    .legacy-copy,
    .muted {
      color: var(--text-muted, rgba(255,255,255,0.68));
      line-height: 1.65;
    }

    .legacy-copy {
      margin: 14px 0 0;
      max-width: 760px;
    }

    .content-root {
      display: grid;
      gap: 18px;
      margin-top: 18px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(0,0,0,0.62);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .modal-backdrop.open { display: grid; }

    .modal-card {
      width: min(760px, 100%);
      max-height: min(780px, calc(100vh - 40px));
      overflow: auto;
      border-radius: 28px;
      padding: 22px;
      background: rgba(10, 12, 26, 0.88);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 34px 120px rgba(0,0,0,0.46);
    }

    .form-section {
      margin-top: 18px;
    }

    .form-section-title {
      margin: 0 0 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field.full { grid-column: 1 / -1; }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted, rgba(255,255,255,0.68));
      font-size: 13px;
      font-weight: 800;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
      color: var(--text-primary, #fff);
      padding: 13px 14px;
      outline: none;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: rgba(255,255,255,0.42);
    }

    .field select option {
      color: #111;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
      color: var(--text-primary, #fff);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    .quick-links-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .quick-link-card {
      border-radius: 22px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
    }

    @media (max-width: 960px) {
      .quick-links-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .legacy-page-wrap {
        width: min(100% - 20px, 1220px);
        padding-top: 112px;
      }

      .form-grid,
      .quick-links-grid {
        grid-template-columns: 1fr;
      }

      .top-actions {
        justify-content: flex-start;
      }
    }
  </style>

  <link rel="stylesheet" href="/assets/css/base.css?v=34" />
  <link rel="stylesheet" href="/assets/css/theme.css?v=36" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=54" />
  <link rel="stylesheet" href="/assets/css/dashboard.css?v=34" />
</head>

<body class="dashboard-body auth-pending app-loading" data-route-guard="private">
  <div id="universalNavRoot"></div>
  <div id="evaPageTransition" class="eva-page-transition" aria-hidden="true"></div>

  <div id="appRoot">
    <div class="page-aurora"></div>
    <div id="galaxyEngine" class="galaxy-engine" aria-hidden="true"></div>
    <div class="page-grid-overlay"></div>

    <main class="legacy-page-wrap">
      <section class="glass-card aurora-card active-glow beam-target">
        <div class="legacy-title-row">
          <div>
            <p class="legacy-kicker">SALES COMMAND</p>
            <h1 class="legacy-title">Sales Reps</h1>
            <p class="legacy-copy">
              Manage rep profiles, usernames, contact information, activity state, notes,
              and team visibility across the Evaraos sales pipeline.
            </p>
          </div>

          <a href="/performance.html" class="btn btn-theme-secondary beam-target">View Performance</a>
        </div>
      </section>

      <main id="salesRepsRoot" class="content-root">
        <section class="glass-card aurora-card active-glow beam-target">
          Loading sales reps...
        </section>
      </main>
    </main>
  </div>

  <div class="modal-backdrop" id="repModal">
    <div class="modal-card aurora-card active-glow beam-target">
      <div class="section-title-row">
        <h2 id="repModalTitle" style="margin:0;">Add Sales Rep</h2>
        <button class="btn btn-theme-secondary beam-target" id="repModalCloseBtn" type="button">Close</button>
      </div>

      <form id="repForm">
        <section class="form-section">
          <h3 class="form-section-title">Rep Profile</h3>

          <div class="form-grid">
            <div class="field">
              <label for="repFullName">Full Name</label>
              <input id="repFullName" required />
            </div>

            <div class="field">
              <label for="repUsername">Username</label>
              <input id="repUsername" required />
            </div>

            <div class="field">
              <label for="repEmail">Email</label>
              <input id="repEmail" type="email" />
            </div>

            <div class="field">
              <label for="repPhone">Phone</label>
              <input id="repPhone" />
            </div>

            <div class="field">
              <label for="repStatus">Status</label>
              <select id="repStatus">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>

            <div class="field full">
              <label for="repNotes">Notes</label>
              <textarea id="repNotes" rows="4"></textarea>
            </div>
          </div>
        </section>

        <div class="top-actions" style="margin-top:18px;">
          <button class="btn btn-theme-primary beam-target" type="submit">Save Sales Rep</button>
          <button class="btn btn-theme-secondary beam-target" id="repModalCancelBtn" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/assets/js/loader.js?v=35"></script>
  <script type="module" src="/assets/js/firebase.js?v=36"></script>
  <script type="module" src="/assets/js/theme.js?v=37"></script>
  <script src="/assets/js/theme-css-loader.js?v=1"></script>
  <script src="/assets/js/galaxy.js?v=2"></script>
  <script type="module" src="/assets/js/route-guard.js?v=35"></script>
  <script type="module" src="/assets/js/nav.js?v=48"></script>
  <script type="module" src="/assets/js/sales_reps.js?v=1"></script>
</body>
</html>
