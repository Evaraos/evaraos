<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard - Evaraos Inc</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .customer-hero{
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:20px;
    }
    .portfolio-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:16px;
    }
    .profile-shell{
      display:flex;
      gap:16px;
      align-items:center;
      flex-wrap:wrap;
    }
    .avatar-fallback{
      width:76px;
      height:76px;
      border-radius:24px;
      display:grid;
      place-items:center;
      font-weight:800;
      font-size:28px;
      background:linear-gradient(135deg, rgba(227,6,19,.35), rgba(246,89,44,.18));
      border:1px solid rgba(255,255,255,.12);
      overflow:hidden;
    }
    .avatar-fallback img{
      width:100%;
      height:100%;
      object-fit:cover;
    }
    .mini-muted{
      color:#b8c0d0;
      font-size:14px;
      line-height:1.6;
    }
    .card-stack{
      display:grid;
      gap:16px;
    }
    .service-row{
      padding:16px;
      border-radius:18px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      margin-bottom:12px;
    }
    .quick-actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:14px;
    }
    .avatar-edit-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      margin-bottom:18px;
    }
    .avatar-edit-button{
      position:relative;
      width:96px;
      height:96px;
      border-radius:28px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.14);
      background:linear-gradient(135deg, rgba(227,6,19,.35), rgba(246,89,44,.18));
      display:grid;
      place-items:center;
      cursor:pointer;
    }
    .avatar-edit-button img{
      width:100%;
      height:100%;
      object-fit:cover;
    }
    .avatar-edit-button span{
      font-size:34px;
      font-weight:800;
      color:#fff;
    }
    .avatar-edit-button input[type="file"]{
      position:absolute;
      inset:0;
      opacity:0;
      cursor:pointer;
    }
    .avatar-edit-text{
      font-size:13px;
      color:#b8c0d0;
      text-align:center;
    }
    .handle-chip{
      display:inline-block;
      margin-top:10px;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      font-size:13px;
    }
    @media (max-width: 1024px){
      .customer-hero,.portfolio-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body class="app-shell">
  <header class="app-topbar" id="topbar"></header>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-panel">
      <section class="glass-card">
        <div class="customer-hero">
          <div>
            <h1 style="margin-top:0;font-size:clamp(30px,4vw,48px);" id="welcomeTitle">Welcome</h1>
            <p class="muted" id="welcomeSubtext">Loading your customer experience...</p>
            <div class="handle-chip" id="customerHandleChip">@loading</div>

            <div class="quick-actions">
              <button class="btn" id="openProfileEditBtn">Edit Profile</button>
              <button class="btn secondary" id="openAccountSecurityBtn">Account & Security</button>
              <button class="btn secondary" id="jumpToServicesBtn">My Services</button>
            </div>
          </div>

          <div class="glass-card" style="padding:18px;">
            <div class="profile-shell">
              <div class="avatar-fallback" id="avatarFallback">C</div>
              <div>
                <strong id="customerName">Customer</strong><br>
                <span class="mini-muted" id="customerEmail">Loading...</span><br>
                <span class="mini-muted" id="customerCompany">Loading company...</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="glass-card" id="myServicesSection">
        <h2 style="margin-top:0;">My Services</h2>
        <div id="servicesList" class="card-stack"></div>
      </section>

      <section class="glass-card">
        <h2 style="margin-top:0;">Customer Summary</h2>
        <div id="customerSummary" class="mini-muted">Loading...</div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="profileModal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 style="margin:0;">Edit Profile</h2>
        <button class="modal-close" id="closeProfileModalBtn">Close</button>
      </div>

      <div class="avatar-edit-wrap">
        <label class="avatar-edit-button" id="modalAvatarButton">
          <span id="modalAvatarFallback">C</span>
          <input id="profilePhotoFile" type="file" accept="image/*">
        </label>
        <div class="avatar-edit-text">Tap the profile icon to change your photo</div>
      </div>

      <div class="portfolio-grid">
        <input id="profileName" placeholder="Full Name">
        <input id="profileUsername" placeholder="Username">
        <input id="profileEmail" placeholder="Email">
        <input id="profilePhone" placeholder="Phone">
        <input id="profilePreferredContactMethod" placeholder="Preferred Contact Method">
        <input id="profileAddress" placeholder="Address">
        <input id="profileCity" placeholder="City">

        <select id="profileState">
          <option value="">State</option>
          <option value="AL">Alabama</option>
          <option value="AK">Alaska</option>
          <option value="AZ">Arizona</option>
          <option value="AR">Arkansas</option>
          <option value="CA">California</option>
          <option value="CO">Colorado</option>
          <option value="CT">Connecticut</option>
          <option value="DE">Delaware</option>
          <option value="FL">Florida</option>
          <option value="GA">Georgia</option>
          <option value="HI">Hawaii</option>
          <option value="ID">Idaho</option>
          <option value="IL">Illinois</option>
          <option value="IN">Indiana</option>
          <option value="IA">Iowa</option>
          <option value="KS">Kansas</option>
          <option value="KY">Kentucky</option>
          <option value="LA">Louisiana</option>
          <option value="ME">Maine</option>
          <option value="MD">Maryland</option>
          <option value="MA">Massachusetts</option>
          <option value="MI">Michigan</option>
          <option value="MN">Minnesota</option>
          <option value="MS">Mississippi</option>
          <option value="MO">Missouri</option>
          <option value="MT">Montana</option>
          <option value="NE">Nebraska</option>
          <option value="NV">Nevada</option>
          <option value="NH">New Hampshire</option>
          <option value="NJ">New Jersey</option>
          <option value="NM">New Mexico</option>
          <option value="NY">New York</option>
          <option value="NC">North Carolina</option>
          <option value="ND">North Dakota</option>
          <option value="OH">Ohio</option>
          <option value="OK">Oklahoma</option>
          <option value="OR">Oregon</option>
          <option value="PA">Pennsylvania</option>
          <option value="RI">Rhode Island</option>
          <option value="SC">South Carolina</option>
          <option value="SD">South Dakota</option>
          <option value="TN">Tennessee</option>
          <option value="TX">Texas</option>
          <option value="UT">Utah</option>
          <option value="VT">Vermont</option>
          <option value="VA">Virginia</option>
          <option value="WA">Washington</option>
          <option value="WV">West Virginia</option>
          <option value="WI">Wisconsin</option>
          <option value="WY">Wyoming</option>
        </select>

        <input id="profileZip" placeholder="Zip">
      </div>

      <div class="stack">
        <button class="btn" id="saveProfileBtn">Save Profile</button>
      </div>
      <p id="profileMsg" class="status-text"></p>
    </div>
  </div>

  <div class="modal-backdrop" id="accountSecurityModal">
    <div class="modal-card" style="max-width:640px;">
      <div class="modal-head">
        <h2 style="margin:0;">Account & Security</h2>
        <button class="modal-close" id="closeAccountSecurityModalBtn">Close</button>
      </div>

      <div class="portfolio-grid">
        <input id="securityUsername" placeholder="Username">
        <input id="securityHandle" placeholder="@handle" disabled>

        <div class="password-wrap" style="position:relative;">
          <input id="currentPassword" type="password" placeholder="Current Password" style="padding-right:54px;">
          <button class="eye-toggle" type="button" id="toggleCurrentPasswordBtn">👁</button>
        </div>

        <div class="password-wrap" style="position:relative;">
          <input id="newPassword" type="password" placeholder="New Password" style="padding-right:54px;">
          <button class="eye-toggle" type="button" id="toggleNewPasswordBtn">👁</button>
        </div>
      </div>

      <div class="stack">
        <button class="btn" id="saveSecurityBtn">Save Changes</button>
      </div>
      <p id="securityMsg" class="status-text"></p>
    </div>
  </div>

  <script type="module">
    import {
      bindTopbar,
      requireAuth,
      loadCompany,
      renderSidebar,
      updateOwnCustomerProfile,
      fetchCustomerServices,
      hasPermission
    } from "./assets/app.js";
    import { updateOwnUsername, changeOwnPassword, buildUserIdentity } from "./assets/auth.js";

    function initials(name) {
      const parts = (name || "").trim().split(" ").filter(Boolean);
      if (!parts.length) return "C";
      return parts.slice(0, 2).map(part => part[0]?.toUpperCase()).join("");
    }

    function setAvatar(user) {
      const avatar = document.getElementById("avatarFallback");
      if (user.photoUrl) {
        avatar.innerHTML = `<img src="${user.photoUrl}" alt="Profile Photo">`;
      } else {
        avatar.textContent = initials(user.name);
      }
    }

    function setModalAvatar(user, previewUrl = "") {
      const modalAvatarButton = document.getElementById("modalAvatarButton");

      if (previewUrl) {
        modalAvatarButton.innerHTML = `
          <img src="${previewUrl}" alt="Profile Photo Preview">
          <input id="profilePhotoFile" type="file" accept="image/*">
        `;
        return;
      }

      if (user.photoUrl) {
        modalAvatarButton.innerHTML = `
          <img src="${user.photoUrl}" alt="Profile Photo">
          <input id="profilePhotoFile" type="file" accept="image/*">
        `;
      } else {
        modalAvatarButton.innerHTML = `
          <span id="modalAvatarFallback">${initials(user.name)}</span>
          <input id="profilePhotoFile" type="file" accept="image/*">
        `;
      }
    }

    function setProfileForm(user) {
      document.getElementById("profileName").value = user.name || "";
      document.getElementById("profileUsername").value = user.username || "";
      document.getElementById("profileEmail").value = user.email || "";
      document.getElementById("profilePhone").value = user.phone || "";
      document.getElementById("profilePreferredContactMethod").value = user.preferredContactMethod || "";
      document.getElementById("profileAddress").value = user.address || "";
      document.getElementById("profileCity").value = user.city || "";
      document.getElementById("profileState").value = user.state || "";
      document.getElementById("profileZip").value = user.zip || "";
    }

    function serviceCard(service) {
      return `
        <div class="service-row">
          <strong>${service.name}</strong><br>
          <span class="mini-muted">Status: ${service.status}</span><br>
          <span class="mini-muted">Billing: ${service.billingType}</span><br>
          <span class="mini-muted">${service.cancellationPolicy}</span>
        </div>
      `;
    }

    function openModal(id) {
      document.getElementById(id).classList.add("active");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("active");
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function togglePasswordField(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";
      btn.textContent = isPassword ? "🙈" : "👁";
    }

    function scrollToSection(id) {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    requireAuth(async (user) => {
      if (user.role !== "customer") {
        window.location.href = "dashboard.html";
        return;
      }

      await bindTopbar(user);
      document.getElementById("sidebar").innerHTML = renderSidebar(user.role, "overview");

      const company = await loadCompany(user.companyId);
      const services = await fetchCustomerServices(user);

      document.getElementById("welcomeTitle").textContent = `Welcome, ${user.name || "Customer"}`;
      document.getElementById("welcomeSubtext").textContent = `You are viewing your customer dashboard for ${company?.name || user.companyId}.`;
      document.getElementById("customerHandleChip").textContent = user.handle || `@${user.username || "user"}`;

      setAvatar(user);
      document.getElementById("customerName").textContent = user.name || "Customer";
      document.getElementById("customerEmail").textContent = user.email || "No email";
      document.getElementById("customerCompany").textContent = company?.name || user.companyId;

      setProfileForm(user);
      setModalAvatar(user);
      document.getElementById("securityUsername").value = user.username || "";
      document.getElementById("securityHandle").value = user.handle || `@${user.username || ""}`;

      document.getElementById("servicesList").innerHTML = services.map(serviceCard).join("");

      document.getElementById("customerSummary").innerHTML = `
        <strong>Customer Role:</strong> ${user.role}<br>
        <strong>Display Username:</strong> ${user.displayUsername || user.username || "—"}<br>
        <strong>Handle:</strong> ${user.handle || `@${user.username || ""}`}<br>
        <strong>Company Access Level:</strong> ${user.companyAccessLevel}<br>
        <strong>Organization Level:</strong> ${user.organizationLevel}<br>
        <strong>Reports To:</strong> ${user.reportsTo || "Not set"}
      `;

      document.getElementById("openProfileEditBtn").addEventListener("click", () => {
        openModal("profileModal");
      });

      document.getElementById("openAccountSecurityBtn").addEventListener("click", () => {
        openModal("accountSecurityModal");
      });

      document.getElementById("jumpToServicesBtn").addEventListener("click", () => {
        scrollToSection("myServicesSection");
      });

      document.getElementById("closeProfileModalBtn").addEventListener("click", () => closeModal("profileModal"));
      document.getElementById("closeAccountSecurityModalBtn").addEventListener("click", () => closeModal("accountSecurityModal"));

      document.getElementById("toggleCurrentPasswordBtn").addEventListener("click", function() {
        togglePasswordField("currentPassword", this);
      });

      document.getElementById("toggleNewPasswordBtn").addEventListener("click", function() {
        togglePasswordField("newPassword", this);
      });

      document.getElementById("securityUsername").addEventListener("input", (e) => {
        const identity = buildUserIdentity(e.target.value);
        document.getElementById("securityHandle").value = identity.handle || "";
      });

      document.addEventListener("change", async (event) => {
        if (event.target && event.target.id === "profilePhotoFile") {
          const file = event.target.files[0];
          if (!file) return;
          const previewUrl = await fileToDataUrl(file);
          setModalAvatar(user, previewUrl);
        }
      });

      document.getElementById("saveProfileBtn").addEventListener("click", async () => {
        const msg = document.getElementById("profileMsg");

        if (!hasPermission(user, "self")) {
          msg.textContent = "Your account does not have permission to edit profile data.";
          return;
        }

        try {
          const currentFileInput = document.getElementById("profilePhotoFile");
          const file = currentFileInput?.files?.[0];
          let photoUrl = user.photoUrl || "";

          if (file) {
            photoUrl = await fileToDataUrl(file);
          }

          await updateOwnCustomerProfile(user.uid || user.id, {
            name: document.getElementById("profileName").value.trim(),
            username: document.getElementById("profileUsername").value.trim().toLowerCase(),
            email: document.getElementById("profileEmail").value.trim(),
            phone: document.getElementById("profilePhone").value.trim(),
            preferredContactMethod: document.getElementById("profilePreferredContactMethod").value.trim(),
            address: document.getElementById("profileAddress").value.trim(),
            city: document.getElementById("profileCity").value.trim(),
            state: document.getElementById("profileState").value,
            zip: document.getElementById("profileZip").value.trim(),
            photoUrl
          });

          msg.textContent = "Profile updated successfully.";
        } catch (e) {
          msg.textContent = e.message || "Failed to update profile.";
        }
      });

      document.getElementById("saveSecurityBtn").addEventListener("click", async () => {
        const msg = document.getElementById("securityMsg");
        const newUsername = document.getElementById("securityUsername").value.trim().toLowerCase();
        const currentPassword = document.getElementById("currentPassword").value;
        const newPassword = document.getElementById("newPassword").value;

        msg.textContent = "";

        try {
          if (newUsername && newUsername !== (user.username || "").toLowerCase()) {
            const identity = await updateOwnUsername(user.uid || user.id, newUsername);
            document.getElementById("securityHandle").value = identity.handle;
          }

          if (currentPassword || newPassword) {
            await changeOwnPassword(currentPassword, newPassword);
          }

          msg.textContent = "Account settings updated successfully. Refresh once to see updated handle everywhere.";
        } catch (e) {
          msg.textContent = e.message || "Failed to update account settings.";
        }
      });
    });
  </script>
</body>
</html>
